check: JSONMissingBlock
severity: error
cases:
  - name: allows app and named section-local blocks in a Dawn-style section
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "title": {
                  "type": "title"
                },
                "price": {
                  "type": "price"
                },
                "widget": {
                  "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "title",
              "name": "Title"
            },
            {
              "type": "price",
              "name": "Price"
            },
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
  - name: requires app permission in a Dawn-style section
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "title": {
                  "type": "title"
                },
                "price": {
                  "type": "price"
                },
                "widget": {
                  "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "title",
              "name": "Title"
            },
            {
              "type": "price",
              "name": "Price"
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: templates/product.json
        message: "Block type 'shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000' is not allowed in 'sections/main-product.liquid'."
        start: [12, 18]
        highlight: '"shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"'
  - name: still validates theme block files and permissions in an app-enabled section
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "title": {
                  "type": "title"
                },
                "price": {
                  "type": "price"
                },
                "widget": {
                  "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                },
                "missing": {
                  "type": "missing"
                },
                "text": {
                  "type": "text"
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "title",
              "name": "Title"
            },
            {
              "type": "price",
              "name": "Price"
            },
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: |
    offenses:
      - file: templates/product.json
        message: "Theme block 'blocks/missing.liquid' does not exist."
        start: [15, 18]
        highlight: '"missing"'
      - file: templates/product.json
        message: "Block type 'text' is not allowed in 'sections/main-product.liquid'."
        start: [18, 18]
        highlight: '"text"'
  - name: allows app and theme blocks in a Horizon-style section
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "widget": {
                  "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                },
                "text": {
                  "type": "text"
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            },
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: |
  - name: does not let theme permission or static bypass section app permission
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "widget": {
                  "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000",
                  "static": true
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: templates/product.json
        message: "Block type 'shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000' is not allowed in 'sections/main-product.liquid'."
        start: [6, 18]
        highlight: '"shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"'
  - name: does not let app permission allow a section theme block
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "widget": {
                  "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                },
                "text": {
                  "type": "text"
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: |
    offenses:
      - file: templates/product.json
        message: "Block type 'text' is not allowed in 'sections/main-product.liquid'."
        start: [9, 18]
        highlight: '"text"'
  - name: rejects an app in a section with no allowed blocks
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "widget": {
                  "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": []
        }
        {% endschema %}
    offenses:
      - file: templates/product.json
        message: "Block type 'shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000' is not allowed in 'sections/main-product.liquid'."
        start: [6, 18]
        highlight: '"shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"'
  - name: allows a nested app when only its immediate host allows apps
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "details": {
                  "type": "product-details",
                  "blocks": {
                    "widget": {
                      "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                    },
                    "text": {
                      "type": "text"
                    }
                  }
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            }
          ]
        }
        {% endschema %}
      blocks/product-details.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            },
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: |
  - name: does not inherit app permission from the containing section
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "details": {
                  "type": "product-details",
                  "blocks": {
                    "widget": {
                      "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                    }
                  }
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            },
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
      blocks/product-details.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: templates/product.json
        message: "Block type 'shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000' is not allowed in 'blocks/product-details.liquid'."
        start: [9, 22]
        highlight: '"shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"'
  - name: does not let app permission allow a nested theme block
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "details": {
                  "type": "product-details",
                  "blocks": {
                    "widget": {
                      "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                    },
                    "text": {
                      "type": "text"
                    }
                  }
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            }
          ]
        }
        {% endschema %}
      blocks/product-details.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: |
    offenses:
      - file: templates/product.json
        message: "Block type 'text' is not allowed in 'blocks/product-details.liquid'."
        start: [12, 22]
        highlight: '"text"'
  - name: rejects a nested app when its host has no allowed blocks
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "details": {
                  "type": "product-details",
                  "blocks": {
                    "widget": {
                      "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                    }
                  }
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            }
          ]
        }
        {% endschema %}
      blocks/product-details.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": []
        }
        {% endschema %}
    offenses:
      - file: templates/product.json
        message: "Block type 'shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000' is not allowed in 'blocks/product-details.liquid'."
        start: [9, 22]
        highlight: '"shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"'
  - name: still detects a missing theme block alongside a valid nested app
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "details": {
                  "type": "product-details",
                  "blocks": {
                    "widget": {
                      "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                    },
                    "missing": {
                      "type": "missing"
                    }
                  }
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            }
          ]
        }
        {% endschema %}
      blocks/product-details.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            },
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: templates/product.json
        message: "Theme block 'blocks/missing.liquid' does not exist."
        start: [12, 22]
        highlight: '"missing"'
  - name: does not treat other Shopify URIs as app blocks
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "other": {
                  "type": "shopify://other/widget"
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            },
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: templates/product.json
        message: "Theme block 'blocks/shopify://other/widget.liquid' does not exist."
        start: [6, 18]
        highlight: '"shopify://other/widget"'
