[[cases]]
name = "@theme in a section's schema means every public theme block, and private ones are named"

[cases.files]
"sections/custom-section.liquid" = '''
{% schema %}
{
  "name": "custom section",
  "blocks": [{ "type": "@theme" }, { "type": "_private" }]
}
{% endschema %}
'''
"blocks/group.liquid" = '''
Group
'''
"blocks/layout-block.liquid" = '''
Layout block
'''
"blocks/render-static.liquid" = '''
Render static
'''
"blocks/text.liquid" = '''
Text
'''
"blocks/_private.liquid" = '''
hoho I'm private
'''
"blocks/_static.liquid" = '''
Static
'''

