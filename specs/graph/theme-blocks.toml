[[cases]]
name = "@theme and presets in a block's schema"

[cases.files]
"sections/main.liquid" = '''
{% content_for 'block', type: 'group', id: 'group' %}
'''
"blocks/group.liquid" = '''
{% doc %}
  Fixture block component that passes its blocks to the parent snippet
{% enddoc %}

{% capture children %}
  {%- content_for "blocks" -%}
{% endcapture %}

{% render 'parent', children: children %}

{% schema %}
{
  "name": "Group block",
  "blocks": [{ "type": "@theme" }],
  "presets": [
    {
      "name": "Group block",
      "category": "Group",
      "blocks": [
        {
          "type": "text"
        }
      ]
    }
  ]
}
{% endschema %}
'''
"blocks/layout-block.liquid" = '''
Layout block
'''
"blocks/render-static.liquid" = '''
Render static
'''
"blocks/text.liquid" = '''
hello world

{% schema %}
{
  "name": "Text block",
  "settings": [],
  "presets": [
    {
      "name": "Text block",
      "category": "Text"
    }
  ]
}
{% endschema %}
'''
"blocks/_private.liquid" = '''
Private
'''
"snippets/parent.liquid" = '''
Parent
'''

