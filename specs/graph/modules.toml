[[cases]]
name = "a module's type and kind follow from its folder"
modules = [
  { file = "assets/icon.svg", type = "SVG", kind = "unused" },
  { file = "assets/logo.png", type = "Image", kind = "unused" },
  { file = "assets/theme.css", type = "CSS", kind = "unused" },
  { file = "assets/theme.js", type = "JavaScript", kind = "unused" },
  { file = "blocks/text.liquid", type = "Liquid", kind = "block" },
  { file = "layout/theme.liquid", type = "Liquid", kind = "layout" },
  { file = "sections/header-group.json", type = "JSON", kind = "section-group" },
  { file = "sections/main.liquid", type = "Liquid", kind = "section" },
  { file = "snippets/snippet.liquid", type = "Liquid", kind = "snippet" },
  { file = "templates/index.json", type = "JSON", kind = "template" },
  { file = "templates/page.liquid", type = "Liquid", kind = "template" },
]

[cases.files]
"layout/theme.liquid" = '''
{{ 'theme.js' | asset_url | script_tag }}
{{ 'theme.css' | asset_url | stylesheet_tag }}
{{ 'icon.svg' | asset_url }}
{{ 'logo.png' | asset_url }}
{% sections 'header-group' %}
{{ content_for_layout }}
'''
"templates/index.json" = '''
{
  "sections": {
    "main": { "type": "main" }
  },
  "order": ["main"]
}
'''
"templates/page.liquid" = '''
{% render 'snippet' %}
'''
"sections/main.liquid" = '''
{% content_for 'block', type: 'text', id: 'text' %}
'''
"sections/header-group.json" = '''
{ "type": "header", "name": "Header", "sections": {}, "order": [] }
'''
"blocks/text.liquid" = '''
{% render 'snippet' %}
'''
"snippets/snippet.liquid" = '''
Snippet
'''
"assets/theme.js" = ""
"assets/theme.css" = ""
"assets/icon.svg" = '''
<svg></svg>
'''
"assets/logo.png" = ""

