[[cases]]
name = "a file that's referenced but missing is a module that doesn't exist"
modules = [
  { file = "assets/missing.js", type = "JavaScript", kind = "unused", exists = false },
  { file = "sections/main.liquid", type = "Liquid", kind = "section" },
  { file = "snippets/missing.liquid", type = "Liquid", kind = "snippet", exists = false },
]

[cases.files]
"sections/main.liquid" = '''
{% render 'missing' %}
{{ 'missing.js' | asset_url }}
'''

[[cases.edges]]
source = "sections/main.liquid"
start = [ 0, 0 ]
text = "{% render 'missing' %}"
target = "snippets/missing.liquid"

[[cases.edges]]
source = "sections/main.liquid"
start = [ 1, 3 ]
text = "'missing.js' | asset_url "
target = "assets/missing.js"
