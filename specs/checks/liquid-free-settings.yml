check: LiquidFreeSettings
severity: warning
cases:
  - name: should not report errors for valid settings without liquid logic in sections bucket
    files:
      sections/test-section.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "settings": [
            {
              "id": "text_value",
              "type": "text",
              "label": "Text Value",
              "default": "Some text without liquid logic."
            }
          ]
        }
        {% endschema %}
  - name: should not report errors for valid settings with dynamic source liquid logic in sections bucket
    files:
      sections/test-section.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "settings": [
            {
              "id": "text_value",
              "type": "text",
              "label": "Text Value",
              "default": "Title {{ product.title }}"
            }
          ]
        }
        {% endschema %}
  - name: should not report errors for valid settings with liquid type field in sections bucket
    files:
      sections/test-section.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "settings": [
            {
              "id": "text_value",
              "type": "liquid",
              "label": "Text Value",
              "default": "{% render 'block' %}"
            }
          ]
        }
        {% endschema %}
  - name: should report an error when settings value contains Liquid logic in sections bucket
    files:
      sections/test-section.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "settings": [
            {
              "id": "input_with_logic",
              "type": "text",
              "label": "Input with Logic",
              "default": "Hello {% if user %} User {% endif %}!"
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: sections/test-section.liquid
        message: Settings values cannot contain liquid logic.
        start: [8, 17]
        highlight: '"Hello {% if user %} User {% endif %}!"'
  - name: should report an error with correct indices when settings value contains Liquid logic in sections bucket
    files:
      sections/test-section.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "settings": [
            {
              "id": "input_with_logic",
              "type": "text",
              "label": "Input with Logic",
              "default": "Hello {% if user %} User {% endif %}!"
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: sections/test-section.liquid
        message: Settings values cannot contain liquid logic.
        start: [8, 17]
        highlight: '"Hello {% if user %} User {% endif %}!"'
  - name: should report an error when settings value contains Liquid logic in object format in sections bucket
    files:
      sections/test-section.liquid: |2
          {% schema %}
          {
            "name": "test",
            "settings": {
              "text_block": {
                "type": "text",
                "id": "text_block",
                "label": "Text Block",
                "default": "Hello {% if user %} User {% endif %}!"
              }
            }
          }
        {% endschema %}
    offenses:
      - file: sections/test-section.liquid
        message: Settings values cannot contain liquid logic.
        start: [8, 19]
        highlight: '"Hello {% if user %} User {% endif %}!"'
  - name: should report errors when preset block values contain Liquid logic in sections bucket
    files:
      sections/test-section.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "presets": [
            {
              "name": "Default",
              "block": [
                {
                  "type": "text",
                  "settings": {
                    "text": "Hello World!{% random liquid logic %}"
                  }
                }
              ]
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: sections/test-section.liquid
        message: Settings values cannot contain liquid logic.
        start: [10, 20]
        highlight: '"Hello World!{% random liquid logic %}"'
  - name: should not report errors when settings value is available_if and it contains liquid logic (1)
    files:
      sections/test-section.liquid: |2
          {% schema %}
          {
            "name": "test",
            "settings": {
              "text_block": {
                "type": "text",
                "id": "text_block",
                "label": "Text Block",
                "default": "Hello World!",
                "visible_if": "{% if user %} true {% endif %}"
              }
            }
          }
        {% endschema %}
