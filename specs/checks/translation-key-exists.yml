check: TranslationKeyExists
severity: error
cases:
  - name: should report all keys if default locale file does not exist
    files:
      code.liquid: |-
        {{"key" | t}}
        {{"nested.key" | t}}
    docset: default
    offenses:
      - file: code.liquid
        message: "'key' does not have a matching entry in 'locales/en.default.json'"
        start: [0, 2]
        highlight: '"key"'
      - file: code.liquid
        message: "'nested.key' does not have a matching entry in 'locales/en.default.json'"
        start: [1, 2]
        highlight: '"nested.key"'
  - name: should report nothing if default locale file is invalid
    files:
      locales/en.default.json: "{"
      code.liquid: |-
        {{"key" | t}}
        {{"nested.key" | t}}
        {% schema %}
          {
            "locales": {
              "en": {
                "key": "I will be ignored",
                "nested": {
                  "key": "Me too!"
                }
              }
            }
          }
        {% endschema %}
    docset: default
  - name: should report unknown keys even if schema is invalid
    files:
      locales/en.default.json: |-
        {}
      code.liquid: |-
        {{"key" | t}}
        {% schema %}
          {
        {% endschema %}
    docset: default
    offenses:
      - file: code.liquid
        message: "'key' does not have a matching entry in 'locales/en.default.json'"
        start: [0, 2]
        highlight: '"key"'
  - name: should ignore existing keys
    files:
      locales/en.default.json: |-
        {
          "key": "",
          "nested": {
            "key": ""
          }
        }
      code.liquid: |-
        {{"key" | t}}
        {{"nested.key" | t}}
    docset: default
  - name: should ignore keys included in schema
    files:
      code.liquid: |-
        {{"submit" | t}}
        {{ "this.does.not.exist" | translate }}
        {% schema %}
          {
            "locales": {
              "en": {
                "submit": "Subscribe"
              }
            }
          }
        {% endschema %}
    docset: default
    offenses:
      - file: code.liquid
        message: "'this.does.not.exist' does not have a matching entry in 'locales/en.default.json' or 'code.liquid'"
        start: [1, 3]
        highlight: '"this.does.not.exist"'
  - name: should not crash if the schema locales does not exist
    files:
      code.liquid: |-
        {{ "this.does.not.exist" | translate }}
        {% schema %}
          {
            "name": "Slideshow",
            "tag": "section",
            "class": "slideshow",
            "limit": 1
          }
        {% endschema %}
    docset: default
    offenses:
      - file: code.liquid
        message: "'this.does.not.exist' does not have a matching entry in 'locales/en.default.json'"
        start: [0, 3]
        highlight: '"this.does.not.exist"'
  - name: should only report unknown keys for translate filter
    files:
      locales/en.default.json: |-
        {}
      code.liquid: |-
        {{ "unknownkey" | t }}
        {{ "do.not.report.me" | unknown_filter }}
        {{ "unknown.nested.key" | translate }}
    docset: default
    offenses:
      - file: code.liquid
        message: "'unknownkey' does not have a matching entry in 'locales/en.default.json'"
        start: [0, 3]
        highlight: '"unknownkey"'
      - file: code.liquid
        message: "'unknown.nested.key' does not have a matching entry in 'locales/en.default.json'"
        start: [2, 3]
        highlight: '"unknown.nested.key"'
  - name: should count Shopify-provided translations as defined
    files:
      locales/en.default.json: |-
        {}
      code.liquid: |-
        {{ 'shopify.sentence.words_connector' | t }}
        {{ 'shopify.this.does.not.exist' | t }}
    docset: default
    offenses:
      - file: code.liquid
        message: "'shopify.this.does.not.exist' does not have a matching entry in 'locales/en.default.json'"
        start: [1, 3]
        highlight: "'shopify.this.does.not.exist'"
  - name: should handle key conflicts
    files:
      locales/en.default.json: |-
        {
          "product": {
            "quantity": "TODO"
          }
        }
      code.liquid: '{{"product.quantity.decrease" | t}}'
    docset: default
    offenses:
      - file: code.liquid
        message: "'product.quantity.decrease' does not have a matching entry in 'locales/en.default.json'"
        start: [0, 2]
        highlight: '"product.quantity.decrease"'
