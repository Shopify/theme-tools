        }'''
"sections/custom-section.liquid" = '''
{% schema %}
{
  "name": "Custom Section",
  "blocks": [
    {
      "type": "text"
    }
  ]
}
{% endschema %}
'''
"blocks/text.liquid" = '''
{% schema %}
