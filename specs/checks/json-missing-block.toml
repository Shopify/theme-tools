[[cases]]
name = "should not report an offense when a static block exists and is not in the block liquid schema"

[cases.files]
"templates/product.static.json" = '''
{
          "sections": {
            "custom-section": {
              "type": "custom-section",
              "blocks": {
                "child_block": {
                  "type": "text"
                },
                "static_block": {
                  "type": "static_block",
                  "static": true
                }
              },
              "block_order": ["child_block"]
            }
          },
          "order": ["custom-section"]
        }'''
"sections/custom-section.liquid" = '''
{% schema %}
{
  "name": "Custom Section",
  "blocks": [
    {
      "type": "text"
    }
  ]
}
{% endschema %}
'''
"blocks/text.liquid" = '''
{% schema %}
  {
    "name": "Text Block",
    "blocks": [
      {
        "type": "@theme"
      }
    ]
  }
  {% endschema %}
'''
"blocks/static_block.liquid" = '''
{% schema %}
  {
    "name": "Static Block",
  }
  {% endschema %}
'''

[[cases]]
name = "should ignore non-template JSON files"

[cases.files]
"config/index.json" = '''
{
          "blocks": {
            "text_block": {
              "type": "nonexistent"
            }
          }
        }'''

[[cases]]
name = "should ignore templates with local blocks"

[cases.files]
"templates/product.nested.json" = '''
{
          "sections": {
            "custom-section": {
              "type": "custom-section",
              "blocks": {
                "parent_block": {
                  "type": "text",
                  "blocks": {
                    "child_block": {
                      "type": "_private_block"
                    }
                  }
                }
              },
              "block_order": ["parent_block"]
            }
          },
          "order": ["custom-section"]
        }'''
"sections/custom-section.liquid" = '''
{% schema %}
{
  "name": "Custom Section",
  "blocks": [
    {
      "type": "text",
      "name": "Text Block"
    }
  ]
}
{% endschema %}
'''
"blocks/text.liquid" = '''
{% schema %}
  {
    "name": "Text Block",
    "blocks": [
      {
        "type": "image",
        "name": "Image Block"
      }
    ]
  }
  {% endschema %}
'''
"blocks/image.liquid" = ""
"blocks/_private_block.liquid" = ""
