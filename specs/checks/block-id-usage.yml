check: BlockIdUsage
severity: warning
cases:
  - name: reports offense with the use of block.id in an if liquid tag
    files:
      file.liquid: |
        {% if block.id == '123' %}
          No bueno
        {% endif %}
    offenses:
      - file: file.liquid
        message: The ID is dynamically generated by Shopify and is subject to change. You should avoid relying on a literal value of this ID.
        start: [0, 6]
        highlight: "block.id == '123'"
  - name: reports offense with the use of block.id in an elseif liquid tag
    files:
      file.liquid: |
        {% if potato == '123' %}
          No bueno
        {% elsif block.id == '123' %}
          No bueno
        {% endif %}
    offenses:
      - file: file.liquid
        message: The ID is dynamically generated by Shopify and is subject to change. You should avoid relying on a literal value of this ID.
        start: [2, 9]
        highlight: "block.id == '123'"
  - name: reports offense with the use of block.id in an unless liquid tag
    files:
      file.liquid: |
        {% unless block.id == '123' %}
          No bueno
        {% endunless %}
    offenses:
      - file: file.liquid
        message: The ID is dynamically generated by Shopify and is subject to change. You should avoid relying on a literal value of this ID.
        start: [0, 10]
        highlight: "block.id == '123'"
  - name: reports offense with the use of block.id in a case liquid tag
    files:
      file.liquid: |
        {% case block.id %}
          {% when '123' %}
            No bueno
        {% endcase %}
    offenses:
      - file: file.liquid
        message: The ID is dynamically generated by Shopify and is subject to change. You should avoid relying on a literal value of this ID.
        start: [0, 8]
        highlight: block.id
