check: OrphanedSnippet
severity: warning
cases:
  - name: should report a warning
    files:
      snippets/orphaned.liquid: '<div>Orphaned content</div>'
    offenses:
      - file: snippets/orphaned.liquid
        message: This snippet is not referenced by any other files
        start: [0, 0]
        highlight: "<"
  - name: should not report a warning
    files:
      snippets/product-card.liquid: '<div>Referenced snippet</div>'
      templates/product.liquid: "{% render 'product-card' %}"
    references:
      - { source: templates/product.liquid, target: snippets/product-card.liquid }
  - name: should not report warnings for templates
    files:
      templates/index.liquid: "{% section 'header' %}"
