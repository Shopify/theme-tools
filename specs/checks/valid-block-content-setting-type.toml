name = "does not report a non-string content setting outside theme block files"

[cases.files]
"sections/main.liquid" = '''
{% schema %}
{"settings":[{"id":"content","type":"number"}]}
{% endschema %}'''

[[cases]]
name = "reports the schema mismatch once alongside ValidBlockArgumentTypes"
checks = [ "ValidBlockArgumentTypes", "ValidBlockContentSettingType" ]

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} [content] - Body
{% enddoc %}
{% schema %}
{"settings":[{"id":"content","type":"number"}]}
{% endschema %}'''

[[cases.offenses]]
check = "ValidBlockContentSettingType"
file = "blocks/card.liquid"
message = "Schema setting 'content' has Liquid type 'number', but the built-in 'content' parameter has type 'string'."
start = [ 4, 36 ]
highlight = "\"number\""

[[cases]]
name = "names the built-in parameter as the string authority when schema and LiquidDoc agree on another type"
checks = [ "ValidBlockArgumentTypes", "ValidBlockContentSettingType" ]

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {number} [content] - Body
{% enddoc %}
{% schema %}
{"settings":[{"id":"content","type":"number"}]}
{% endschema %}'''

[[cases.offenses]]
check = "ValidBlockContentSettingType"
file = "blocks/card.liquid"
message = "Schema setting 'content' has Liquid type 'number', but the built-in 'content' parameter has type 'string'."
start = [ 4, 36 ]
highlight = "\"number\""

[[cases.offenses]]
check = "ValidBlockArgumentTypes"
file = "blocks/card.liquid"
message = "The built-in parameter 'content' has Liquid type 'string', but LiquidDoc declares 'number'. The built-in parameter type is authoritative."
start = [ 1, 9 ]
highlight = "{number}"
