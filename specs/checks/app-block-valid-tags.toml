check = "AppBlockValidTags"
severity = "error"

[[cases]]
name = "should report an offense when the forbidden tag is used in blocks directory liquid file (1)"

[cases.files]
"blocks/app.liquid" = '''
{% include 'test' %}
{% schema %}
{ }
{% endschema %}
'''

[[cases.offenses]]
file = "blocks/app.liquid"
message = "Theme app extension blocks cannot contain 'include' tags"
start = [ 0, 0 ]
highlight = "{% include 'test' %}"

