{% enddoc %}
<div>{{ title }}</div>
'''
"file.liquid" = "{% render 'card', title: product_title %}"

[[cases]]
name = "should not report when snippet has no doc comment"
docset = "default"

[cases.files]
"snippets/card.liquid" = "<h1>This snippet has no doc comment</h1>"
"file.liquid" = "{% render 'card', title: 123 %}"

