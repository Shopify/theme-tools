[[cases]]
name = "validates named types, arrays, and enums together"
docset = "default"

[cases.files]
"file.liquid" = '''
{% doc %}
      @param {product} product
      @param {string[]} labels
      @param {'heading' | 'small'} [variant]
      @param {unknown[]} unknown
      @param {'heading' |} invalid_variant
    {% enddoc %}'''

[[cases.offenses]]
file = "file.liquid"
message = "The parameter type 'unknown[]' is not supported."
start = [ 4, 13 ]
highlight = "{unknown[]}"

[[cases.offenses.suggest]]
message = "Remove invalid parameter type"
result = '''
{% doc %}
      @param {product} product
      @param {string[]} labels
      @param {'heading' | 'small'} [variant]
      @param unknown
      @param {'heading' |} invalid_variant
    {% enddoc %}'''

[[cases.offenses]]
file = "file.liquid"
message = "The parameter type ''heading' |' is not supported."
start = [ 5, 13 ]
highlight = "{'heading' |}"

[[cases.offenses.suggest]]
message = "Remove invalid parameter type"
result = '''
{% doc %}
      @param {product} product
      @param {string[]} labels
      @param {'heading' | 'small'} [variant]
      @param {unknown[]} unknown
      @param invalid_variant
    {% enddoc %}'''

[[cases]]
name = "removes the invalid type without changing braces in its description"
docset = "default"

[cases.files]
"file.liquid" = '''
{% doc %}
