check: LiquidComplexity
severity: warning
cases:
  - name: does not report when complexity equals the default maximum of 120
    files:
      snippets/test.liquid: [{ repeat: "{% if enabled %}{% endif %}\n", times: 119 }]
  - name: reports when complexity exceeds the default maximum of 120
    files:
      snippets/test.liquid: [{ repeat: "{% if enabled %}{% endif %}\n", times: 120 }]
    offenses:
      - file: snippets/test.liquid
        message: Liquid complexity is 121, which exceeds the maximum of 120. The decision at line 120 pushed it over the limit. Consider simplifying conditional logic, or moving self-contained decision logic into snippets with the render tag.
        start: [119, 0]
        highlight: "{% if enabled %}"
  - name: counts nested logical expressions, with a maximum of 5
    config:
      LiquidComplexity: { maxComplexity: 5 }
    files:
      snippets/test.liquid: |-
        {% if available and visible %}
                Featured product
              {% elsif featured or highlighted %}
                Highlighted product
              {% endif %}
  - name: counts nested logical expressions, with a maximum of 4
    config:
      LiquidComplexity: { maxComplexity: 4 }
    files:
      snippets/test.liquid: |-
        {% if available and visible %}
                Featured product
              {% elsif featured or highlighted %}
                Highlighted product
              {% endif %}
    offenses:
      - file: snippets/test.liquid
        message: Liquid complexity is 5, which exceeds the maximum of 4. The decision at line 1 pushed it over the limit. Consider simplifying conditional logic, or moving self-contained decision logic into snippets with the render tag.
        start: [0, 6]
        highlight: "available and visible "
  - name: counts logical expressions in unless conditions, with a maximum of 3
    config:
      LiquidComplexity: { maxComplexity: 3 }
    files:
      snippets/test.liquid: |-
        {% unless hidden or archived %}
                Visible product
              {% endunless %}
  - name: counts logical expressions in unless conditions, with a maximum of 2
    config:
      LiquidComplexity: { maxComplexity: 2 }
    files:
      snippets/test.liquid: |-
        {% unless hidden or archived %}
                Visible product
              {% endunless %}
    offenses:
      - file: snippets/test.liquid
        message: Liquid complexity is 3, which exceeds the maximum of 2. The decision at line 1 pushed it over the limit. Consider simplifying conditional logic, or moving self-contained decision logic into snippets with the render tag.
        start: [0, 10]
        highlight: "hidden or archived "
  - name: does not count logical expressions in variable output or assign tags
    config:
      LiquidComplexity: { maxComplexity: 1 }
    files:
      snippets/test.liquid: |-
        {% assign visible = product.available and customer %}
              {{ product.available or customer }}
  - name: counts decision points inside liquid tags, with a maximum of 3
    config:
      LiquidComplexity: { maxComplexity: 3 }
    files:
      snippets/test.liquid: |-
        {% liquid
                if enabled
                  echo 'Enabled'
                elsif archived
                  echo 'Archived'
                endif
              %}
  - name: counts decision points inside liquid tags, with a maximum of 2
    config:
      LiquidComplexity: { maxComplexity: 2 }
    files:
      snippets/test.liquid: |-
        {% liquid
                if enabled
                  echo 'Enabled'
                elsif archived
                  echo 'Archived'
                endif
              %}
    offenses:
      - file: snippets/test.liquid
        message: Liquid complexity is 3, which exceeds the maximum of 2. The decision at line 4 pushed it over the limit. Consider simplifying conditional logic, or moving self-contained decision logic into snippets with the render tag.
        start: [3, 8]
        highlight: elsif archived
  - name: counts each nested condition as another decision point, with a maximum of 9
    config:
      LiquidComplexity: { maxComplexity: 9 }
    files:
      snippets/test.liquid: |-
        {% if product.available and product.published %}
                {% unless customer.banned or customer.guest %}
                  {% if customer.tags contains 'vip' and settings.vip_enabled %}
                    VIP offer
                  {% elsif product.tags contains 'sale' or product.compare_at_price > product.price %}
                    Sale offer
                  {% endif %}
                {% endunless %}
              {% endif %}
  - name: counts each nested condition as another decision point, with a maximum of 8
    config:
      LiquidComplexity: { maxComplexity: 8 }
    files:
      snippets/test.liquid: |-
        {% if product.available and product.published %}
                {% unless customer.banned or customer.guest %}
                  {% if customer.tags contains 'vip' and settings.vip_enabled %}
                    VIP offer
                  {% elsif product.tags contains 'sale' or product.compare_at_price > product.price %}
                    Sale offer
                  {% endif %}
                {% endunless %}
              {% endif %}
    offenses:
      - file: snippets/test.liquid
        message: Liquid complexity is 9, which exceeds the maximum of 8. The decision at line 1 pushed it over the limit. Consider simplifying conditional logic, or moving self-contained decision logic into snippets with the render tag.
        start: [0, 6]
        highlight: "product.available and product.published "
  - name: resets complexity for each file
    config:
      LiquidComplexity: { maxComplexity: 2 }
    files:
      snippets/first.liquid: '{% if enabled %}{% endif %}'
      snippets/second.liquid: '{% if enabled %}{% endif %}'
  - name: tolerates parse errors
    config:
      LiquidComplexity: { maxComplexity: 1 }
    files:
      snippets/test.liquid: '{% if enabled %}'
  - name: reports plain files when maxComplexity is 0
    config:
      LiquidComplexity: { maxComplexity: 0 }
    files:
      snippets/test.liquid: Hello
    offenses:
      - file: snippets/test.liquid
        message: Liquid complexity is 1, which exceeds the maximum of 0. The decision at line 1 pushed it over the limit. Consider simplifying conditional logic, or moving self-contained decision logic into snippets with the render tag.
        start: [0, 0]
        highlight: Hello
  - name: counts case consistently with if and elsif, with a maximum of 4
    config:
      LiquidComplexity: { maxComplexity: 4 }
    files:
      snippets/test.liquid: |-
        {% case status %}
              {% when 'active' %}
                Active
              {% when 'draft' %}
                Draft
              {% endcase %}
  - name: counts case consistently with if and elsif, with a maximum of 3
    config:
      LiquidComplexity: { maxComplexity: 3 }
    files:
      snippets/test.liquid: |-
        {% case status %}
              {% when 'active' %}
                Active
              {% when 'draft' %}
                Draft
              {% endcase %}
    offenses:
      - file: snippets/test.liquid
        message: Liquid complexity is 4, which exceeds the maximum of 3. The decision at line 4 pushed it over the limit. Consider simplifying conditional logic, or moving self-contained decision logic into snippets with the render tag.
        start: [3, 6]
        highlight: "{% when 'draft' %}"
  - name: reports the range of the decision point that first exceeds the maximum
    config:
      LiquidComplexity: { maxComplexity: 2 }
    files:
      snippets/test.liquid: |-
        {% if first %}{% endif %}
        {% if second %}{% endif %}
    offenses:
      - file: snippets/test.liquid
        message: Liquid complexity is 3, which exceeds the maximum of 2. The decision at line 2 pushed it over the limit. Consider simplifying conditional logic, or moving self-contained decision logic into snippets with the render tag.
        start: [1, 0]
        highlight: "{% if second %}"
