check: ValidLocalBlocks
severity: error
cases:
  - name: should report errors when root level local blocks are defined in a block bucket
    files:
      blocks/local-blocks.liquid: |
        {% schema %}
        {
            "name": "Block name",
            "blocks": [
            {
                "type": "local_block",
                "name": "Local Block"
            }
            ]
        }
        {% endschema %}
    offenses:
      - file: blocks/local-blocks.liquid
        message: Local scoped blocks are not supported in theme blocks.
        start: [5, 16]
        highlight: '"local_block"'
  - name: should report errors when sections use theme blocks together with locally scoped blocks in root level
    files:
      blocks/text.liquid: ""
      sections/local-blocks.liquid: |
        {% schema %}
        {
            "name": "Section name",
            "blocks": [
            {
                "type": "text"
            },
            {
                "type": "local_block",
                "name": "Local Block"
            }
            ]
        }
        {% endschema %}
    offenses:
      - file: sections/local-blocks.liquid
        message: Sections cannot use theme blocks together with locally scoped blocks.
        start: [8, 16]
        highlight: '"local_block"'
  - name: should report errors when sections use static theme blocks together with locally scoped blocks
    files:
      sections/local-blocks.liquid: |
        {% schema %}
        {
            "name": "Section name",
            "blocks": [
            {
                "type": "local_block",
                "name": "Local Block"
            }
            ],
            "presets": [
            {
                "name": "Default",
                "blocks": [
                {
                    "id": "static_block",
                    "type": "static_block",
                    "static": true
                }
                ]
            }
            ]
        }
        {% endschema %}
    offenses:
      - file: sections/local-blocks.liquid
        message: Sections cannot use static theme blocks together with locally scoped blocks.
        start: [15, 20]
        highlight: '"static_block"'
  - name: should report errors with correct indices when sections use static theme blocks together with locally scoped blocks
    files:
      sections/local-blocks.liquid: |
        {% schema %}
        {
        "name": "Section name",
        "blocks": [
            {
            "type": "local_block",
            "name": "Local Block"
            }
        ],
        "presets": [
            {
            "name": "Default",
            "blocks": [
                {
                "id": "static_block",
                "type": "static_block",
                "static": true
                }
            ]
            }
        ]
        }
        {% endschema %}
    offenses:
      - file: sections/local-blocks.liquid
        message: Sections cannot use static theme blocks together with locally scoped blocks.
        start: [15, 16]
        highlight: '"static_block"'
  - name: should not report errors for block setting types
    files:
      sections/local-blocks.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "@app"
            },
            {
              "type": "link_list",
              "name": "Link list",
              "settings": [
                {
                  "type": "inline_richtext",
                  "id": "heading",
                  "default": "Heading"
                },
                {
                  "type": "link_list",
                  "id": "menu",
                  "default": "Footer"
                }
              ]
            }
          ]
        }
        {% endschema %}
  - name: "should not report errors when @app is used alongside static blocks"
    files:
      sections/local-blocks.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "@app"
            },
            {
              "type": "static_block",
              "static": true
            }
          ]
        }
        {% endschema %}
  - name: should not report errors on themes that define local blocks at the root level and use them in presets
    files:
      sections/local-blocks.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "local_block",
              "name": "Local Block"
            }
          ],
          "presets": [
            {
              "name": "Default",
              "blocks": [
                {
                  "type": "local_block"
                }
              ]
            }
          ]
        }
        {% endschema %}
  - name: should not report errors on older themes that define local blocks at the root level and use them in hash-style presets
    files:
      sections/local-blocks.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "local_block",
              "name": "Local Block"
            }
          ],
          "presets": [
            {
              "name": "Default",
              "blocks": {
                "local_block": {
                  "type": "local_block"
                }
              }
            }
          ]
        }
        {% endschema %}
  - name: should not report errors when preset blocks have a name property
    files:
      blocks/product-grid.liquid: |
        {% schema %}
        {
          "name": "Product grid",
          "blocks": [{ "type": "product-card" }],
          "presets": [
            {
              "name": "Product grid",
              "blocks": {
                "product-grid-card": {
                  "type": "product-card",
                  "static": true,
                  "blocks": {
                    "card_gallery_eK4Hr7": {
                      "type": "card-gallery",
                      "name": "potato",
                    },
                    "group_4RMFLV": {
                      "type": "group"
                    }
                  },
                  "block_order": ["card_gallery_eK4Hr7", "group_4RMFLV"]
                }
              }
            }
          ]
        }
        {% endschema %}
