check: StylesheetOncePerFile
severity: error
cases:
  - name: reports second and subsequent stylesheet tags in a file
    files:
      sections/test.liquid: |-
        {% stylesheet %}{% endstylesheet %}
        {% stylesheet %}{% endstylesheet %}
        {% stylesheet %}{% endstylesheet %}
    offenses:
      - file: sections/test.liquid
        message: "{% stylesheet %} can only appear once per file."
        start: [1, 0]
        highlight: "{% stylesheet %}"
      - file: sections/test.liquid
        message: "{% stylesheet %} can only appear once per file."
        start: [2, 0]
        highlight: "{% stylesheet %}"
