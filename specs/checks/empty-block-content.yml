check: EmptyBlockContent
severity: warning
cases:
  - name: should not report offenses when the blocks array is not empty in sections
    files:
      sections/test_block.liquid: |
        <div> 
            {% content_for 'blocks' %}
        </div>
        {% schema %}
        {
            "name": "Test",
            "blocks": [
              {
                "type": "test-block"
              }
            ]
        }
        {% endschema %}
  - name: should report offenses when the blocks array is empty in sections
    files:
      sections/test_block.liquid: |
        <div> 
            {% content_for 'blocks' %}
        </div>
        {% schema %}
        {
            "name": "Test",
            "blocks": []
        }
        {% endschema %}
    offenses:
      - file: sections/test_block.liquid
        message: "The 'content_for \"blocks\"' tag is present, but the blocks array is empty."
        start: [1, 4]
        highlight: "{% content_for 'blocks' %}"
  - name: should report offenses when the blocks array is empty with the correct indices in sections
    files:
      sections/test_block.liquid: |
        <div> 
            {% content_for 'blocks' %}
        </div>
        {% schema %}
        {
            "name": "Test",
            "blocks": []
        }
        {% endschema %}
    offenses:
      - file: sections/test_block.liquid
        message: "The 'content_for \"blocks\"' tag is present, but the blocks array is empty."
        start: [1, 4]
        highlight: "{% content_for 'blocks' %}"
  - name: should report offenses when the blocks array has not been defined in sections
    files:
      sections/test_block.liquid: |
