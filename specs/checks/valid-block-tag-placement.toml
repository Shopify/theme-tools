[[cases]]
name = "leaves malformed block tags with unstructured markup to LiquidSyntaxError"
checks = [ "LiquidSyntaxError", "ValidBlockTagPlacement" ]
docset = "default"

[cases.files]
"snippets/card.liquid" = "{% block card %}{% endblock %}"

[[cases.offenses]]
check = "LiquidSyntaxError"
file = "snippets/card.liquid"
message = "Syntax error in 'block' tag"
start = [ 0, 0 ]
highlight = "{% block card %}{% endblock %}"

[[cases]]
name = "leaves malformed block tags with structured markup to LiquidSyntaxError"
checks = [ "LiquidSyntaxError", "ValidBlockTagPlacement" ]
docset = "default"

[cases.files]
"snippets/card.liquid" = "{% block 'card', block.bad: true %}Card{% endblock %}"

[[cases.offenses]]
check = "LiquidSyntaxError"
file = "snippets/card.liquid"
message = "Liquid syntax error: in 'block' - Use plain named arguments, for example: block 'name', heading: value"
start = [ 0, 17 ]
highlight = "block.bad: true"
