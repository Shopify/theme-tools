"layout/custom/theme.liquid" = '''
{% liquid
  block 'outer'
    block 'inner'
    endblock
  endblock
%}'''

[[cases.offenses]]
file = "layout/custom/theme.liquid"
message = "The 'block' tag can only be used in templates/**/*.liquid and layout/*.liquid."
start = [ 1, 2 ]
highlight = '''
block 'outer'
    block 'inner'
    endblock
  endblock'''

[[cases.offenses]]
file = "layout/custom/theme.liquid"
message = "The 'block' tag can only be used in templates/**/*.liquid and layout/*.liquid."
start = [ 2, 4 ]
highlight = '''
block 'inner'
    endblock'''

[[cases]]
name = "reports 'a direct block tag' in 'snippets\\card.liquid'"

