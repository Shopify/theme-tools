check = "ValidContentForArgumentTypes"
severity = "warning"

[[cases]]
name = "should accept 'hello' for string"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} param - Description
{% enddoc %}
<div>{{ param }}</div>
'''
"file.liquid" = "{% content_for 'block', type: 'card', param: 'hello' %}"

[[cases]]
name = "should accept '' for string"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} param - Description
{% enddoc %}
<div>{{ param }}</div>
'''
"file.liquid" = "{% content_for 'block', type: 'card', param: '' %}"

[[cases]]
name = "should accept product for string"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} param - Description
{% enddoc %}
<div>{{ param }}</div>
'''
"file.liquid" = "{% content_for 'block', type: 'card', param: product %}"

[[cases]]
name = "should reject 123 for string"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} param - Description
{% enddoc %}
<div>{{ param }}</div>
'''
"file.liquid" = "{% content_for 'block', type: 'card', param: 123 %}"

[[cases.offenses]]
file = "file.liquid"
message = "Type mismatch for argument 'param': expected string, got number"
start = [ 0, 45 ]
highlight = "123"

[[cases.offenses.suggest]]
message = "Replace with default value '''' for string"
result = "{% content_for 'block', type: 'card', param: '' %}"

[[cases.offenses.suggest]]
message = "Remove value"
result = "{% content_for 'block', type: 'card', param:  %}"

[[cases]]
name = "should reject true for string"

