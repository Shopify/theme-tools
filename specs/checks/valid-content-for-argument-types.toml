"blocks/card.liquid" = '''
{% doc %}
  @param {string} param - Description
{% enddoc %}
<div>{{ param }}</div>
'''
"file.liquid" = "{% content_for 'block', type: 'card', param: true %}"

[[cases.offenses]]
file = "file.liquid"
message = "Type mismatch for argument 'param': expected string, got boolean"
start = [ 0, 45 ]
highlight = "true"

[[cases.offenses.suggest]]
