[[cases]]
name = "should suggest replacing with default value for type or removing value"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} param - Description
{% enddoc %}
<div>{{ param }}</div>
'''
"file.liquid" = "{% content_for 'block', type: 'card', param: 123 %}"

[[cases.offenses]]
file = "file.liquid"
message = "Type mismatch for argument 'param': expected string, got number"
start = [ 0, 45 ]
highlight = "123"

[[cases.offenses.suggest]]
message = "Replace with default value '''' for string"
result = "{% content_for 'block', type: 'card', param: '' %}"

[[cases.offenses.suggest]]
message = "Remove value"
result = "{% content_for 'block', type: 'card', param:  %}"

[[cases]]
name = "should allow users to fix a single argument when multiple are provided`"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} title - The title
  @param {number} count - The count
{% enddoc %}
<div>{{ title }} {{ count }}</div>
'''
"file.liquid" = "{% content_for 'block', type: 'card', title: 123, count: 5 %}"

[[cases.offenses]]
file = "file.liquid"
message = "Type mismatch for argument 'title': expected string, got number"
start = [ 0, 45 ]
highlight = "123"

[[cases.offenses.suggest]]
message = "Replace with default value '''' for string"
result = "{% content_for 'block', type: 'card', title: '', count: 5 %}"

[[cases.offenses.suggest]]
message = "Remove value"
result = "{% content_for 'block', type: 'card', title: , count: 5 %}"

