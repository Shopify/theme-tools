check: ValidStandardEventData
severity: error
cases:
  - name: reports an offense when the context is not a supported value for products
    files:
      file.liquid: "{{ product | standard_event_data: 'view', context: 'homepage' }}"
    offenses:
      - file: file.liquid
        message: "Unsupported context 'homepage' for product. Valid values: page, search, collection, dialog, recommendation. The 'context' argument can also be omitted."
        start: [0, 51]
        highlight: "'homepage'"
  - name: reports an offense when the context is not a supported value for carts
    files:
      file.liquid: "{{ cart | standard_event_data: 'view', context: 'banner' }}"
    offenses:
      - file: file.liquid
        message: "Unsupported context 'banner' for cart. Valid values: page, dialog. The 'context' argument can also be omitted."
        start: [0, 48]
        highlight: "'banner'"
  - name: reports an offense when the context is valid for products but the input is a cart
    files:
      file.liquid: "{{ cart | standard_event_data: 'view', context: 'recommendation' }}"
    offenses:
      - file: file.liquid
        message: "Unsupported context 'recommendation' for cart. Valid values: page, dialog. The 'context' argument can also be omitted."
        start: [0, 48]
        highlight: "'recommendation'"
  - name: does not report an offense on supported product context values (1)
    files:
      file.liquid: "{{ product | standard_event_data: 'view', context: 'page' }}"
  - name: does not report an offense on supported product context values (2)
    files:
      file.liquid: "{{ product | standard_event_data: 'view', context: 'search' }}"
  - name: does not report an offense on supported product context values (3)
    files:
      file.liquid: "{{ product | standard_event_data: 'view', context: 'collection' }}"
  - name: does not report an offense on supported product context values (4)
    files:
      file.liquid: "{{ product | standard_event_data: 'view', context: 'dialog' }}"
  - name: does not report an offense on supported product context values (5)
    files:
      file.liquid: "{{ product | standard_event_data: 'view', context: 'recommendation' }}"
  - name: does not report an offense on supported cart context values (1)
    files:
      file.liquid: "{{ cart | standard_event_data: 'view', context: 'page' }}"
  - name: does not report an offense on supported cart context values (2)
    files:
      file.liquid: "{{ cart | standard_event_data: 'view', context: 'dialog' }}"
  - name: does not report an offense on collections, whose context is ignored
    files:
      file.liquid: "{{ collection | standard_event_data: 'view', context: 'homepage' }}"
  - name: falls back to the union of contexts when the input is not a known global
    files:
      file.liquid: "{{ line_item.product | standard_event_data: 'view', context: 'recommendation' }}"
  - name: falls back to the union of contexts when the filter input is chained
    files:
      file.liquid: "{{ cart | default: other_cart | standard_event_data: 'view', context: 'recommendation' }}"
  - name: reports an offense when the context is outside the union for an unknown input
    files:
      file.liquid: "{{ line_item.product | standard_event_data: 'view', context: 'homepage' }}"
    offenses:
      - file: file.liquid
        message: "Unsupported context 'homepage'. Valid values: page, search, collection, dialog, recommendation. The 'context' argument can also be omitted."
        start: [0, 61]
        highlight: "'homepage'"
  - name: does not report an offense when the context is a variable
    files:
      file.liquid: "{{ product | standard_event_data: 'view', context: section.settings.context }}"
  - name: reports an offense when the context is a non-string literal
    files:
      file.liquid: "{{ product | standard_event_data: 'view', context: 123 }}"
    offenses:
      - file: file.liquid
        message: "Unsupported context for product. Valid values: page, search, collection, dialog, recommendation. The 'context' argument can also be omitted."
        start: [0, 51]
        highlight: "123"
  - name: does not report an offense when the context argument is omitted
    files:
      file.liquid: "{{ collection | standard_event_data: 'view' }}"
  - name: reports an offense when the event type is not supported
    files:
      file.liquid: "{{ product | standard_event_data: 'click', context: 'page' }}"
    offenses:
      - file: file.liquid
        message: "Unsupported event type 'click'. The only supported event type is 'view'."
        start: [0, 34]
        highlight: "'click'"
  - name: reports an offense when the event type is not supported on a collection
    files:
      file.liquid: "{{ collection | standard_event_data: 'click' }}"
    offenses:
      - file: file.liquid
        message: "Unsupported event type 'click'. The only supported event type is 'view'."
        start: [0, 37]
        highlight: "'click'"
  - name: does not report an offense when the event type is a variable
    files:
      file.liquid: "{{ product | standard_event_data: event_type }}"
  - name: reports an offense when the event type is a non-string literal
    files:
      file.liquid: "{{ product | standard_event_data: 123 }}"
    offenses:
      - file: file.liquid
        message: "Unsupported event type. The only supported event type is 'view'."
        start: [0, 34]
        highlight: "123"
  - name: reports an offense when the event type is a boolean literal
    files:
      file.liquid: "{{ product | standard_event_data: true }}"
    offenses:
      - file: file.liquid
        message: "Unsupported event type. The only supported event type is 'view'."
        start: [0, 34]
        highlight: "true"
  - name: reports both offenses when the event type and the context are invalid
    files:
      file.liquid: "{{ product | standard_event_data: 'click', context: 'homepage' }}"
    offenses:
      - file: file.liquid
        message: "Unsupported event type 'click'. The only supported event type is 'view'."
        start: [0, 34]
        highlight: "'click'"
      - file: file.liquid
        message: "Unsupported context 'homepage' for product. Valid values: page, search, collection, dialog, recommendation. The 'context' argument can also be omitted."
        start: [0, 52]
        highlight: "'homepage'"
  - name: does not report an offense on other filters
    files:
      file.liquid: "{{ product | json }}{{ 'homepage' | append: 'view' }}"
