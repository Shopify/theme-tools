check: LiquidSyntaxError
severity: error
cases:
  - name: accepts strings, numbers, booleans, flat arrays and dynamic source strings on app blocks
    files:
      templates/test.liquid: |-
        {% block 'shopify://apps/example_app/blocks/example-block/00000000-0000-4000-8000-000000000000', heading: "Hello", quoted_keyword: 'empty', count: -1, ratio: 1.5, enabled: true, disabled: false, empty_items: [], items: ['x', 2, true, false,], title: '{{ closest.product.title }}' %}
          {% endblock %}
  - name: accepts fixed app settings inside liquid tags
    files:
      templates/test.liquid: |-
        {% liquid
          block 'shopify://apps/example_app/blocks/example-block/00000000-0000-4000-8000-000000000000', heading: "Hello", quoted_keyword: 'empty', count: -1, ratio: 1.5, enabled: true, disabled: false, empty_items: [], items: ['x', 2, true, false,], title: '{{ closest.product.title }}'
          endblock
        %}
  - name: does not treat whitespace as overriding an app setting named content
    checks:
      [
        LiquidSyntaxError,
        LiquidHTMLSyntaxError,
        MissingBlockArguments,
        UnrecognizedBlockArguments,
        ValidBlockArgumentTypes,
        DuplicateBlockArguments,
      ]
    files:
      templates/test.liquid: "{% block 'shopify://apps/example_app/blocks/example-block/00000000-0000-4000-8000-000000000000', content: 'Explicit' %}\n  {% endblock %}"
  - name: accepts a string block.name alongside fixed app settings
    files:
      templates/test.liquid: "{% block 'shopify://apps/example_app/blocks/example-block/00000000-0000-4000-8000-000000000000', block.name: 'Example', heading: 'Hi' %}{% endblock %}"
  - name: 'rejects a non-fixed app setting: product.title'
    files:
      templates/test.liquid: "{% block 'shopify://apps/example_app/blocks/example-block/00000000-0000-4000-8000-000000000000', count: 1, title: product.title, other: product.title %}{% endblock %}"
    offenses:
      - file: templates/test.liquid
        message: "Liquid syntax error: in 'block' - app block settings must be fixed values; 'title' is not a string, number, boolean or array of those"
        start:
          - 0
          - 107
        highlight: "title: product.title"
  - name: 'rejects a non-fixed app setting: title'
    files:
