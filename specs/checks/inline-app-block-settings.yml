  - name: reports only the fixed-value error across block checks
    files:
      templates/test.liquid: "{% block 'shopify://apps/example_app/blocks/example-block/00000000-0000-4000-8000-000000000000', title: product.title, title: 'fixed' %}{% endblock %}"
    checks: &a1
