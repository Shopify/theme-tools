        highlight: "title: product.title"
  - name: rejects a dynamic app setting inside liquid tags
    files:
      templates/test.liquid: |-
        {% liquid
          block 'shopify://apps/example_app/blocks/example-block/00000000-0000-4000-8000-000000000000', title: product.title
          endblock
        %}
    offenses:
      - file: templates/test.liquid
        message: "Liquid syntax error: in 'block' - app block settings must be fixed values; 'title' is not a string, number, boolean or array of those"
        start:
          - 1
          - 96
        highlight: "title: product.title"
  - name: reports namespaced app settings before dynamic values
    files:
      templates/test.liquid: "{% block 'shopify://apps/example_app/blocks/example-block/00000000-0000-4000-8000-000000000000', title: product.title, block.settings.color: 'red' %}{% endblock %}"
    offenses:
      - file: templates/test.liquid
        message: "Liquid syntax error: in 'block' - Use 'color:' instead of 'block.settings.color:' when calling a block."
        start:
          - 0
          - 119
        highlight: "block.settings.color: 'red'"
  - name: 'rejects app body content with fixed settings: <p>inner</p>'
    files:
      templates/test.liquid: "{% block 'shopify://apps/example_app/blocks/example-block/00000000-0000-4000-8000-000000000000', title: 'hello' %}<p>inner</p>{% endblock %}"
    offenses:
      - file: templates/test.liquid
        message: "Liquid syntax error: in 'block' - app blocks do not accept content"
        start:
          - 0
          - 0
        highlight: "{% block 'shopify://apps/example_app/blocks/example-block/00000000-0000-4000-8000-000000000000', title: 'hello' %}<p>inner</p>{% endblock %}"
