check: JavascriptTagInWrongFile
severity: error
cases:
  - name: allows javascript tags in sections/test.liquid
    files:
      sections/test.liquid: "{% javascript %}{% endjavascript %}"
  - name: allows javascript tags in blocks/test.liquid
    files:
      blocks/test.liquid: "{% javascript %}{% endjavascript %}"
  - name: allows javascript tags in snippets/test.liquid
    files:
      snippets/test.liquid: "{% javascript %}{% endjavascript %}"
  - name: reports javascript tags in templates/index.liquid
    files:
      templates/index.liquid: "{% javascript %}{% endjavascript %}"
    offenses:
      - file: templates/index.liquid
        message: "{% javascript %} is only valid in section, block, or snippet files."
        start: [0, 0]
        highlight: "{% javascript %}"
