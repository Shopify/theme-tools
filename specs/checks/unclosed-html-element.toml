[[cases]]
name = "should not report for paired conditional open/close in for-loop boundary conditions (1)"

[cases.files]
"file.liquid" = '''
{% for item in items %}
  {% if forloop.first or item_modulo == 1 %}
    <div class="grid-row">
  {% endif %}

  <div class="grid-item">{{ item }}</div>

  {% if forloop.last or item_modulo == 0 %}
    </div>
  {% endif %}
{% endfor %}
'''

[[cases]]
name = "should not report for paired conditional open/close in for-loop boundary conditions (2)"

[cases.files]
"file.liquid" = '''
<div>
  {% if condition_a %}
    <section>
  {% endif %}

  {% if condition_b %}
    </section>
  {% endif %}
</div>
'''

[[cases]]
name = "should still report when cross-identifier tags do not balance by name"

[cases.files]
