check = "UnclosedHTMLElement"
severity = "warning"

[[cases]]
name = "should not report for files without unbalanced tags (1)"

[cases.files]
"file.liquid" = '''
<div>
  {% if cond %}
    <details>
      <summary>
  {% else %}
    <h2>
  {% endif %}

  {% if cond %}
    </summary>
  {% else %}
    </h2>
  {% endif %}

  {% if cond %}
    </details>
  {% endif %}
</div>
'''

[[cases]]
name = "should not report for files without unbalanced tags (2)"

[cases.files]
"file.liquid" = '''
<div>
  {% if cond %}
  {% else %}
    <h1>
  {% endif %}

  {% unless cond %}
    </h1>
  {% endunless %}
</div>
'''

[[cases]]
name = "should not report for files without unbalanced tags (3)"

[cases.files]
"file.liquid" = '''
<div>
  {% case thing %}
  {% when 'one', 'two' %}
    <h1>
  {% when 'three' %}
    <h3>
  {% else %}
    <p>
  {% endcase %}

  {% case thing %}
  {% when 'one','two' %}
    </h1>
  {% when 'three' %}
    </h3>
  {% else %}
    </p>
  {% endunless %}
</div>
'''

[[cases]]
name = "should not report offenses for similarly written, but not string-equal, conditions (1)"

[cases.files]
"file.liquid" = '''
{% if number>10 %}
  <h1>
{% endif %}

{% if number > 10 %}
  </h1>
{% endif %}
'''

[[cases]]
name = "should not report offenses for similarly written, but not string-equal, conditions (2)"

