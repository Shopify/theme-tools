  </h1>
{% endif %}
'''

[[cases]]
name = "should not report offenses for similarly written, but not string-equal, conditions (3)"

[cases.files]
"file.liquid" = '''
{% if x == nil %}
  <h1>
{% endif %}

{% if x==null %}
