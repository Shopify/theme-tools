[[cases]]
name = "should not report offenses for similarly written, but not string-equal, conditions (6)"

[cases.files]
"file.liquid" = '''
{% if a or b %}
  <h1>
{% endif %}

{% if a     or     b %}
  </h1>
{% endif %}
'''

[[cases]]
name = "should report an offense for a branch open tag without its close tag"

[cases.files]
"file.liquid" = '''
<div>
  {% if cond %}
    <main>
  {% endif %}
</div>
'''

[[cases.offenses]]
file = "file.liquid"
message = "Opening tag does not have a matching closing tag for condition `cond` in HtmlElement 'div'"
start = [ 2, 4 ]
highlight = "<main>"

[[cases]]
name = "should report an offense for a branch close tag without its open tag"

[cases.files]
"file.liquid" = '''
<div>
