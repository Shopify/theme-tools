[[cases]]
name = "should report an offense for unclosed or unopened in case statements"

[cases.files]
"file.liquid" = '''
<div>
  {% case thing %}
    {% when 'one' %}
      <h1>
    {% else %}
      <p>
  {% endcase %}

  {% case thing %}
    {% when 'two' %}
      </h2>
  {% endcase %}
</div>
'''

[[cases.offenses]]
file = "file.liquid"
message = "Opening tag does not have a matching closing tag for condition `case thing == 'one'` in HtmlElement 'div'"
start = [ 3, 6 ]
highlight = "<h1>"

[[cases.offenses]]
file = "file.liquid"
message = "Opening tag does not have a matching closing tag for condition `case thing` in HtmlElement 'div'"
