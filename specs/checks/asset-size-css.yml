check: AssetSizeCSS
severity: error
cases:
  - name: should not report any offenses if CSS is smaller than threshold
    files:
      assets/theme.css: "* { color: green !important; }"
      templates/index.liquid: |
        <html>
          <head>
            <link href="{{ 'theme.css' | asset_url }}" rel="stylesheet">
          </head>
        </html>
  - name: should report an offense if CSS is larger than threshold
    files:
      assets/theme.css: "* { color: green !important; }"
      templates/index.liquid: |
        <html>
          <head>
            <link href="{{ 'theme.css' | asset_url }}" rel="stylesheet">
          </head>
        </html>
    config:
      AssetSizeCSS: { thresholdInBytes: 1 }
    offenses:
      - file: templates/index.liquid
        message: The CSS file size exceeds the threshold of 1 bytes
        start: [2, 16]
        highlight: "{{ 'theme.css' | asset_url }}"
  - name: should report a warning when the CSS file size exceeds the threshold
    files:
      templates/index.liquid: |
        <html>
          <head>
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
          </head>
        </html>
      https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css: "* { color: green; }"
    config:
      AssetSizeCSS: { thresholdInBytes: 1 }
    offenses:
      - file: templates/index.liquid
        message: The CSS file size exceeds the threshold of 1 bytes
        start: [2, 16]
        highlight: "https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
  - name: should not report any offenses if CSS is smaller than threshold 2
    files:
      assets/theme.css: 'console.log("hello world");'
      templates/index.liquid: |
        <html>
          <head>
            {{ 'theme.css' | asset_url | stylesheet_tag }}
            {{ "https://example.com" | stylesheet_tag }}
          </head>
        </html>
      https://example.com: "* { color: green; }"
  - name: should report an offense if CSS is larger than threshold 2
    files:
      assets/theme.css: 'console.log("hello world");'
      templates/index.liquid: |
        <html>
          <head>
            {{ 'theme.css' | asset_url | stylesheet_tag }}
            {{ "https://example.com" | stylesheet_tag }}
          </head>
        </html>
      https://example.com: "* { color: green; }"
    config:
      AssetSizeCSS: { thresholdInBytes: 2 }
    offenses:
      - file: templates/index.liquid
        message: The CSS file size exceeds the threshold of 2 bytes
        start: [2, 7]
        highlight: "'theme.css' | asset_url | stylesheet_tag "
      - file: templates/index.liquid
        message: The CSS file size exceeds the threshold of 2 bytes
        start: [3, 7]
        highlight: '"https://example.com"'
  - name: should not report any offenses if there is no stylesheet
    files:
      templates/index.liquid: |
        <html>
          <head>
          </head>
        </html>
