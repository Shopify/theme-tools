check: AssetSizeCSS
severity: error
cases:
  - name: should not report any offenses if CSS is smaller than threshold
    files:
      assets/theme.css: "* { color: green !important; }"
      templates/index.liquid: |
        <html>
          <head>
            <link href="{{ 'theme.css' | asset_url }}" rel="stylesheet">
          </head>
        </html>
  - name: should report an offense if CSS is larger than threshold
    files:
      assets/theme.css: "* { color: green !important; }"
      templates/index.liquid: |
        <html>
          <head>
            <link href="{{ 'theme.css' | asset_url }}" rel="stylesheet">
          </head>
        </html>
    config:
      AssetSizeCSS: { thresholdInBytes: 1 }
    offenses:
      - file: templates/index.liquid
        message: The CSS file size exceeds the threshold of 1 bytes
        start: [2, 16]
        highlight: "{{ 'theme.css' | asset_url }}"
  - name: should report a warning when the CSS file size exceeds the threshold
    files:
      templates/index.liquid: |
        <html>
          <head>
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
          </head>
        </html>
      https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css: "* { color: green; }"
    config:
      AssetSizeCSS: { thresholdInBytes: 1 }
    offenses:
      - file: templates/index.liquid
        message: The CSS file size exceeds the threshold of 1 bytes
        start: [2, 16]
        highlight: "https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
  - name: should not report any offenses if CSS is smaller than threshold 2
    files:
      assets/theme.css: 'console.log("hello world");'
      templates/index.liquid: |
        <html>
          <head>
            {{ 'theme.css' | asset_url | stylesheet_tag }}
            {{ "https://example.com" | stylesheet_tag }}
          </head>
        </html>
      https://example.com: "* { color: green; }"
  - name: should report an offense if CSS is larger than threshold 2
    files:
      assets/theme.css: 'console.log("hello world");'
      templates/index.liquid: |
        <html>
          <head>
            {{ 'theme.css' | asset_url | stylesheet_tag }}
            {{ "https://example.com" | stylesheet_tag }}
          </head>
        </html>
      https://example.com: "* { color: green; }"
    config:
      AssetSizeCSS: { thresholdInBytes: 2 }
    offenses:
      - file: templates/index.liquid
        message: The CSS file size exceeds the threshold of 2 bytes
        start: [2, 7]
        highlight: "'theme.css' | asset_url | stylesheet_tag "
      - file: templates/index.liquid
        message: The CSS file size exceeds the threshold of 2 bytes
        start: [3, 7]
        highlight: '"https://example.com"'
  - name: should not report any offenses if there is no stylesheet
    files:
      templates/index.liquid: |
        <html>
          <head>
          </head>
        </html>
  - name: should not report the size of a file outside the assets directory
    files:
      outside.css: "* { color: green !important; }"
      templates/index.liquid: |
        <html>
          <head>
            <link href="{{ '../outside.css' | asset_url }}" rel="stylesheet">
          </head>
        </html>
    config:
      AssetSizeCSS: { thresholdInBytes: 1 }
  - name: should not report the size of a remote file at a local or private address
    files:
      templates/index.liquid: |
        <html>
          <head>
            <link href="http://127.0.0.1/loopback.css" rel="stylesheet">
            <link href="http://localhost:8080/localhost.css" rel="stylesheet">
            <link href="http://169.254.169.254/latest/metadata.css" rel="stylesheet">
            <link href="http://[::1]/ipv6-loopback.css" rel="stylesheet">
            <link href="http://0x7f000001/hex-loopback.css" rel="stylesheet">
            <link href="https://user:password@cdn.example.com/credentials.css" rel="stylesheet">
            {{ "http://10.0.0.1/private.css" | stylesheet_tag }}
            <link href="https://cdn.example.com/public.css" rel="stylesheet">
          </head>
        </html>
      http://127.0.0.1/loopback.css: "* { color: green; }"
      http://localhost:8080/localhost.css: "* { color: green; }"
      http://169.254.169.254/latest/metadata.css: "* { color: green; }"
      http://[::1]/ipv6-loopback.css: "* { color: green; }"
      http://0x7f000001/hex-loopback.css: "* { color: green; }"
      https://user:password@cdn.example.com/credentials.css: "* { color: green; }"
      http://10.0.0.1/private.css: "* { color: green; }"
      https://cdn.example.com/public.css: "* { color: green; }"
    config:
      AssetSizeCSS: { thresholdInBytes: 1 }
    offenses:
      - file: templates/index.liquid
        message: The CSS file size exceeds the threshold of 1 bytes
        start: [9, 16]
        highlight: "https://cdn.example.com/public.css"
