check: AssetSizeAppBlockJavaScript
severity: error
cases:
  - name: should not report any offenses if JavaScript is smaller than threshold
    files:
      assets/app.js: 'console.log("Hello, world!");'
      blocks/app.liquid: |
        {% schema %}
        {
          "javascript": "app.js"
        }
        {% endschema %}
  - name: should report an offense if JavaScript is larger than threshold
    files:
      assets/app.js: 'console.log("Hello, world!");'
      blocks/app.liquid: |
        {% schema %}
        {
          "javascript": "app.js"
        }
        {% endschema %}
    config:
      AssetSizeAppBlockJavaScript: { thresholdInBytes: 1 }
    offenses:
      - file: blocks/app.liquid
        message: "The file size for 'app.js' (29 B) exceeds the configured threshold (1 B)"
        start: [2, 17]
        highlight: app.js
  - name: should report an offense if the JavaScript file does not exist
    files:
      blocks/app.liquid: |
        {% schema %}
        {
          "javascript": "nonexistent.js"
        }
        {% endschema %}
    offenses:
      - file: blocks/app.liquid
        message: "'nonexistent.js' does not exist."
        start: [2, 17]
        highlight: nonexistent.js
  - name: should report a file name that leaves the assets directory instead of the size of the file
    files:
      secret.txt: "secret"
      blocks/app.liquid: |
        {% schema %}
        {
          "javascript": "../secret.txt"
        }
        {% endschema %}
    config:
      AssetSizeAppBlockJavaScript: { thresholdInBytes: 1 }
    offenses:
      - file: blocks/app.liquid
        message: "'../secret.txt' must be the name of a file in the assets directory."
        start: [2, 17]
        highlight: "../secret.txt"
  - name: should report a file name that leaves the assets directory the same way when the file does not exist
    files:
      blocks/app.liquid: |
        {% schema %}
        {
          "javascript": "../secret.txt"
        }
        {% endschema %}
    offenses:
      - file: blocks/app.liquid
        message: "'../secret.txt' must be the name of a file in the assets directory."
        start: [2, 17]
        highlight: "../secret.txt"
  - name: should report an absolute path instead of the size of the file
    files:
      secret.txt: "secret"
      blocks/app.liquid: |
        {% schema %}
        {
          "javascript": "/secret.txt"
        }
        {% endschema %}
    config:
      AssetSizeAppBlockJavaScript: { thresholdInBytes: 1 }
    offenses:
      - file: blocks/app.liquid
        message: "'/secret.txt' must be the name of a file in the assets directory."
        start: [2, 17]
        highlight: "/secret.txt"
  - name: should report a percent-encoded path that leaves the assets directory
    files:
      secret.txt: "secret"
      blocks/app.liquid: |
        {% schema %}
        {
          "javascript": "%2e%2e%2fsecret.txt"
        }
        {% endschema %}
    config:
      AssetSizeAppBlockJavaScript: { thresholdInBytes: 1 }
    offenses:
      - file: blocks/app.liquid
        message: "'%2e%2e%2fsecret.txt' must be the name of a file in the assets directory."
        start: [2, 17]
        highlight: "%2e%2e%2fsecret.txt"
  - name: should report a file name in a subdirectory of the assets directory
    files:
      assets/nested/app.js: "nested"
      blocks/app.liquid: |
        {% schema %}
        {
          "javascript": "nested/app.js"
        }
        {% endschema %}
    config:
      AssetSizeAppBlockJavaScript: { thresholdInBytes: 1 }
    offenses:
      - file: blocks/app.liquid
        message: "'nested/app.js' must be the name of a file in the assets directory."
        start: [2, 17]
        highlight: "nested/app.js"
  - name: should report a percent-encoded path with a backslash
    files:
      secret.txt: "secret"
      blocks/app.liquid: |
        {% schema %}
        {
          "javascript": "..%5csecret.txt"
        }
        {% endschema %}
    config:
      AssetSizeAppBlockJavaScript: { thresholdInBytes: 1 }
    offenses:
      - file: blocks/app.liquid
        message: "'..%5csecret.txt' must be the name of a file in the assets directory."
        start: [2, 17]
        highlight: "..%5csecret.txt"
  - name: should report a percent-encoded name of the assets directory itself
    files:
      blocks/app.liquid: |
        {% schema %}
        {
          "javascript": "%2e"
        }
        {% endschema %}
    config:
      AssetSizeAppBlockJavaScript: { thresholdInBytes: 1 }
    offenses:
      - file: blocks/app.liquid
        message: "'%2e' must be the name of a file in the assets directory."
        start: [2, 17]
        highlight: "%2e"
  - name: should report a percent-encoded name of the parent directory
    files:
      blocks/app.liquid: |
        {% schema %}
        {
          "javascript": "%2e%2e"
        }
        {% endschema %}
    config:
      AssetSizeAppBlockJavaScript: { thresholdInBytes: 1 }
    offenses:
      - file: blocks/app.liquid
        message: "'%2e%2e' must be the name of a file in the assets directory."
        start: [2, 17]
        highlight: "%2e%2e"
