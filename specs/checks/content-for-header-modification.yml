check: ContentForHeaderModification
severity: error
cases:
  - name: reports a offense with the use of a filter
    files:
      file.liquid: "{{ content_for_header | split: ',' }}"
    offenses:
      - file: file.liquid
        message: "Do not rely on the content of `content_for_header`"
        start: [0, 0]
        highlight: "{{ content_for_header | split: ',' }}"
  - name: reports offense with the use of assign
    files:
      file.liquid: "{% assign x = content_for_header %}"
    offenses:
      - file: file.liquid
        message: "Do not rely on the content of `content_for_header`"
        start: [0, 0]
        highlight: "{% assign x = content_for_header %}"
  - name: reports offense with the use of capture
    files:
      file.liquid: |
        {% capture x %}
          {{ content_for_header }}
        {% endcapture %}
    offenses:
      - file: file.liquid
        message: "Do not rely on the content of `content_for_header`"
        start: [1, 2]
        highlight: "{{ content_for_header }}"
  - name: reports offense with the use of echo
    files:
      file.liquid: |
        {% liquid
          echo content_for_header | split: ','
        %}
    offenses:
      - file: file.liquid
        message: "Do not rely on the content of `content_for_header`"
        start: [1, 2]
        highlight: "echo content_for_header | split: ','"
  - name: does not report an offense with normal use
    files:
      file.liquid: "{{ content_for_header }}"
