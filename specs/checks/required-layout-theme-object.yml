check: RequiredLayoutThemeObject
severity: error
cases:
  - name: should report an error if content_for_header is missing
    files:
      layout/theme.liquid: |
        <html>
          <head>
            <!-- missing content_for_header -->
          </head>
          <body>
            {{ content_for_layout }}
          </body>
        </html>
    offenses:
      - file: layout/theme.liquid
        message: "The required object '{{ content_for_header }}' is missing in layout/theme.liquid"
        start: [1, 2]
        highlight: |-
          <head>
              <!-- missing content_for_header -->
            </head>
        fix: |
          <html>
            <head>
              <!-- missing content_for_header -->
            {{ content_for_header }}</head>
            <body>
              {{ content_for_layout }}
            </body>
          </html>
  - name: should report an error if content_for_layout is missing
    files:
      layout/theme.liquid: |
        <html>
          <head>
            {{ content_for_header }}
          </head>
          <body>
            <!-- missing content_for_layout -->
          </body>
        </html>
    offenses:
      - file: layout/theme.liquid
        message: "The required object '{{ content_for_layout }}' is missing in layout/theme.liquid"
        start: [4, 2]
        highlight: |-
          <body>
              <!-- missing content_for_layout -->
            </body>
        fix: |
          <html>
            <head>
              {{ content_for_header }}
            </head>
            <body>
              <!-- missing content_for_layout -->
            {{ content_for_layout }}</body>
          </html>
  - name: should not report an error if both content_for_header and content_for_layout are present
    files:
      layout/theme.liquid: |
        <html>
          <head>
            {{ content_for_header }}
          </head>
          <body>
            {{ content_for_layout }}
          </body>
        </html>
  - name: should not report an error or fix if head or body tags are missing
    files:
      layout/theme.liquid: |
        <html>
          <!-- missing head and body tags -->
          {{ content_for_header }}
          {{ content_for_layout }}
        </html>
  - name: should not report an error for non-layout/theme.liquid files
    files:
      snippets/example.liquid: "{% echo 'hello world' %}"
  - name: "should report for any layout/*.liquid file, not only layout/theme.liquid"
    files:
      layout/checkout.liquid: |
        <html>
          <head>
            <!-- missing content_for_header -->
          </head>
          <body>
            {{ content_for_layout }}
          </body>
        </html>
    offenses:
      - file: layout/checkout.liquid
        message: "The required object '{{ content_for_header }}' is missing in layout/theme.liquid"
        start: [1, 2]
        highlight: |-
          <head>
              <!-- missing content_for_header -->
            </head>
        fix: |
          <html>
            <head>
              <!-- missing content_for_header -->
            {{ content_for_header }}</head>
            <body>
              {{ content_for_layout }}
            </body>
          </html>
  - name: should not report an error if the file is unparseable
    files:
      snippets/example.liquid: |
        <html>
          <head>{{ content_for_header }}</head>
          <body>{{ content_for_layout }}{% echo }}</body>
        </html>
