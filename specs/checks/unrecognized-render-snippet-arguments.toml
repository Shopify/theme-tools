check = "UnrecognizedRenderSnippetArguments"
severity = "warning"

[[cases]]
name = "should report unknown arguments that are provided in the render markup"

[cases.files]
"snippets/card.liquid" = '''
{% doc %}
  @param {string} required_string - A required string
  @param {number} required_number - A required number
  @param {boolean} required_boolean - A required boolean
  @param {object} required_object - A required object
  @param {string} [optional_string] - An optional string
  @param {number} [optional_number] - An optional number
  @param {object} [optional_object] - An optional object
  @param {boolean} [optional_boolean] - An optional boolean
{% enddoc %}
'''
"file.liquid" = '''
{% render 'card',
required_string: 'My Card',
required_number: 1,
required_boolean: true,
required_object: product,
unknown_param: 'unknown',
second_unknown_param: 'second unknown',
%}
'''

[[cases.offenses]]
file = "file.liquid"
message = "Unknown argument 'unknown_param' in render tag for snippet 'card'."
start = [ 5, 0 ]
highlight = "unknown_param: 'unknown'"

[[cases.offenses.suggest]]
message = "Remove 'unknown_param'"
result = '''
{% render 'card',
required_string: 'My Card',
required_number: 1,
required_boolean: true,
required_object: product,
second_unknown_param: 'second unknown',
%}
'''

[[cases.offenses]]
file = "file.liquid"
message = "Unknown argument 'second_unknown_param' in render tag for snippet 'card'."
start = [ 6, 0 ]
highlight = "second_unknown_param: 'second unknown'"

[[cases.offenses.suggest]]
message = "Remove 'second_unknown_param'"
result = '''
{% render 'card',
required_string: 'My Card',
required_number: 1,
required_boolean: true,
required_object: product,
unknown_param: 'unknown'
%}
'''

[[cases]]
name = "should not report when snippet has no doc comment"

[cases.files]
"snippets/card.liquid" = "<h1>This snippet has no doc comment</h1>"
"file.liquid" = "{% render 'card', title: 'My Card' %}"

[[cases]]
name = "should not report when LiquidDoc definition has no defined params"

[cases.files]
"snippets/card.liquid" = '''
{% doc %}
  @description this is a description
  @example this is an example
{% enddoc %}
<div>{{ title }}</div>
<div>{{ description }}</div>
'''
"file.liquid" = "{% render 'card', title: 'My Card' %}"

[[cases]]
name = "should not report when snippet name is a VariableLookup"

[cases.files]
"snippets/card.liquid" = '''
{% doc %}
  @param {string} title - The title of the card
  @param {string} description - The description of the card
{% enddoc %}
<div>{{ title }}</div>
<div>{{ description }}</div>
'''
"file.liquid" = "{% assign snippet_name = 'card' %}{% render snippet_name, title: 'My Card' %}"

[[cases]]
name = "should report when \"with/for\" alias syntax is used (1)"

[cases.files]
"snippets/card.liquid" = '''
{% doc %}
  @param {string} title - The title of the card
{% enddoc %}
<div>{{ title }}</div>
'''
"file.liquid" = "{% render 'card' with 'my-card' as unknown_param %}"

[[cases.offenses]]
file = "file.liquid"
message = "Unknown argument 'unknown_param' in render tag for snippet 'card'."
start = [ 0, 17 ]
highlight = "with 'my-card' as unknown_param"

[[cases.offenses.suggest]]
message = "Remove 'unknown_param'"
result = "{% render 'card' %}"

[[cases]]
name = "should report when \"with/for\" alias syntax is used (2)"

[cases.files]
"snippets/card.liquid" = '''
{% doc %}
  @param {string} title - The title of the card
{% enddoc %}
<div>{{ title }}</div>
'''
"file.liquid" = "{% render 'card' for array as unknown_param %}"

[[cases.offenses]]
file = "file.liquid"
message = "Unknown argument 'unknown_param' in render tag for snippet 'card'."
start = [ 0, 17 ]
highlight = "for array as unknown_param"

[[cases.offenses.suggest]]
message = "Remove 'unknown_param'"
result = "{% render 'card' %}"

[[cases]]
