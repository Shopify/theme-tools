check = "MissingRenderSnippetArguments"
severity = "warning"

[[cases]]
name = "should report missing required arguments"

[cases.files]
"snippets/card.liquid" = '''
{% doc %}
  @param {string} required_string - A required string
  @param {number} required_number - A required number
  @param {boolean} required_boolean - A required boolean
  @param {object} required_object - A required object
  @param {string} [optional_string] - An optional string
  @param {number} [optional_number] - An optional number
  @param {object} [optional_object] - An optional object
  @param {boolean} [optional_boolean] - An optional boolean
{% enddoc %}
'''
"file.liquid" = "{% render 'card' %}"

[[cases.offenses]]
file = "file.liquid"
message = "Missing required argument 'required_string' in render tag for snippet 'card'."
start = [ 0, 10 ]
highlight = "'card' "

[[cases.offenses.suggest]]
message = "Add required argument 'required_string'"
result = "{% render 'card', required_string: '' %}"

[[cases.offenses]]
file = "file.liquid"
message = "Missing required argument 'required_number' in render tag for snippet 'card'."
start = [ 0, 10 ]
highlight = "'card' "

[[cases.offenses.suggest]]
message = "Add required argument 'required_number'"
result = "{% render 'card', required_number: 0 %}"

[[cases.offenses]]
file = "file.liquid"
message = "Missing required argument 'required_boolean' in render tag for snippet 'card'."
start = [ 0, 10 ]
highlight = "'card' "

[[cases.offenses.suggest]]
message = "Add required argument 'required_boolean'"
result = "{% render 'card', required_boolean: false %}"

[[cases.offenses]]
file = "file.liquid"
message = "Missing required argument 'required_object' in render tag for snippet 'card'."
start = [ 0, 10 ]
highlight = "'card' "

[[cases.offenses.suggest]]
message = "Add required argument 'required_object'"
result = "{% render 'card', required_object:  %}"

[[cases]]
name = "should suggest adding missing required arguments when none already exist"

