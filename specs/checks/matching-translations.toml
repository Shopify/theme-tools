check = "MatchingTranslations"
severity = "error"

[[cases]]
name = "should report offenses when the translation file is missing a key (1)"

[cases.files]
"locales/en.default.json" = '''
{
  "hello": "Hello",
  "world": "World"
}'''
"locales/pt-BR.json" = '''
{
  "hello": "Olá"
}'''

[[cases.offenses]]
file = "locales/pt-BR.json"
message = "The translation for 'world' is missing"
start = [ 0, 0 ]
highlight = '''
{
  "hello": "Olá"
}'''
fix = '''
{
  "hello": "Olá",
  "world": "TODO"
}'''

