check: ValidVisibleIf
severity: error
cases:
  - name: reports no error for a valid reference to a block schema setting (simple lookup)
    checks: [ValidVisibleIf, ValidVisibleIf]
    files:
      sections/example.liquid: |2
          {% schema %}
            {
          "name": "My Section",
          "settings": [
            {
              "id": "some-section-setting"
            }
          ]
        }
          {% endschema %}
      blocks/example.liquid: |2
          {% schema %}
            {
          "name": "My Block",
          "settings": [
            {
              "id": "some-block-setting"
            },
            {
              "id": "some-other-setting",
              "visible_if": "{{ block.settings.some-block-setting }}"
            }
          ]
        }
          {% endschema %}
      config/settings_schema.json: |-
        [
          {
            "name": "theme_info",
            "theme_name": "Test Theme",
            "theme_version": "0.1.0",
            "theme_author": "Shopify"
          },
          {
            "name": "t:some.namespace",
            "settings": [
              {
                "type": "header",
                "content": "t:some.other.namespace"
              },
              {
                "id": "some-global-setting"
              }
            ]
          }
        ]
  - name: reports no error for a valid reference to a block schema setting (expression)
    checks: [ValidVisibleIf, ValidVisibleIf]
    files:
