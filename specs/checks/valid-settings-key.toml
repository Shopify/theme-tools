check = "ValidSettingsKey"
severity = "error"

[[cases]]
name = "does not report an error when default setting exists"

[cases.files]
"sections/example.liquid" = '''
{% schema %}
  {"name":"Example","settings":[{"id":"existent-setting","type":"text","label":"Example Text Setting"}],"default":{"settings":{"existent-setting":"value"}}}
{% endschema %}
'''

[[cases]]
name = "reports an error when default setting does not exist"

[cases.files]
"sections/example.liquid" = '''
{% schema %}
  {"name":"Example","settings":[{"id":"existent-setting","type":"text","label":"Example Text Setting"}],"default":{"settings":{"non-existent-setting":"value"}}}
{% endschema %}
'''

[[cases.offenses]]
file = "sections/example.liquid"
message = "Setting 'non-existent-setting' does not exist in schema."
start = [ 1, 127 ]
highlight = "\"non-existent-setting\""

[[cases]]
name = "does not report an error when missing default settings is referenced from a block schema"

[cases.files]
"blocks/example.liquid" = '''
{% schema %}
  {"name":"Example","settings":[{"id":"existent-setting","type":"text","label":"Example Text Setting"}],"default":{"settings":{"non-existent-setting":"value"}}}
{% endschema %}
'''

[[cases]]
name = "does not report an error when presets setting exists"

[cases.files]
"sections/example.liquid" = '''
{% schema %}
  {"name":"Example","settings":[{"id":"existent-setting","type":"text","label":"Example Text Setting"}],"presets":[{"settings":{"existent-setting":"value"}}]}
{% endschema %}
'''

[[cases]]
name = "reports an error when presets setting does not exist"

[cases.files]
"sections/example.liquid" = '''
{% schema %}
  {"name":"Example","settings":[{"id":"existent-setting","type":"text","label":"Example Text Setting"}],"presets":[{"settings":{"non-existent-setting-1":"value"}},{"settings":{"non-existent-setting-2":"value"}}]}
{% endschema %}
'''

[[cases.offenses]]
file = "sections/example.liquid"
message = "Setting 'non-existent-setting-1' does not exist in schema."
start = [ 1, 128 ]
highlight = "\"non-existent-setting-1\""

[[cases.offenses]]
file = "sections/example.liquid"
message = "Setting 'non-existent-setting-2' does not exist in schema."
start = [ 1, 176 ]
highlight = "\"non-existent-setting-2\""

[[cases]]
