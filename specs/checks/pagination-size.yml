check: PaginationSize
severity: warning
cases:
  - name: should report an offense when paginate size is less than minSize
    files:
      file.liquid: |
        {% paginate collection.products by 0 %}
        {% endpaginate %}
    offenses:
      - file: file.liquid
        message: Pagination size must be a positive integer between 1 and 250.
        start: [0, 35]
        highlight: "0"
  - name: should report an offense when paginate size is greater than maxSize
    files:
      file.liquid: |
        {% paginate collection.products by 251 %}
        {% endpaginate %}
    offenses:
      - file: file.liquid
        message: Pagination size must be a positive integer between 1 and 250.
        start: [0, 35]
        highlight: "251"
  - name: should not report an offense when paginate size is within the minSize and maxSize range
    files:
      file.liquid: |
        {% paginate collection.products by 25 %}
        {% endpaginate %}
  - name: should not report an offense when paginate size is a section setting with a valid default value
    files:
      file.liquid: |
        {% paginate collection.products by section.settings.products_per_page %}
        {% endpaginate %}
        {% schema %}
          {
            "name": "test",
            "settings": [
              {
                "type": "number",
                "id": "products_per_page",
                "label": "Products per Page",
                "default": 12
              }
            ]
          }
        {% endschema %}
  - name: should report an offense when paginate size is a section setting with an invalid default value
    files:
      file.liquid: |
        {% paginate collection.products by section.settings.products_per_page %}
        {% endpaginate %}
        {% schema %}
          {
            "name": "test",
            "settings": [
              {
                "type": "number",
                "id": "products_per_page",
                "label": "Products per Page",
                "default": 251
              }
            ]
          }
        {% endschema %}
    offenses:
      - file: file.liquid
        message: "This setting's default value should be between 1 and 250 but is currently 251."
        start: [0, 35]
        highlight: section.settings.products_per_page
  - name: should report an offense when paginate size is a section setting with a missing default value
    files:
      file.liquid: |
        {% paginate collection.products by section.settings.products_per_page %}
        {% endpaginate %}
        {% schema %}
          {
            "name": "test",
            "settings": [
              {
                "type": "number",
                "id": "products_per_page",
                "label": "Products per Page"
              }
            ]
          }
        {% endschema %}
    offenses:
      - file: file.liquid
        message: Default pagination size should be defined in the section settings.
        start: [0, 35]
        highlight: section.settings.products_per_page
  - name: should not report an offense when settings is not an array
    files:
      file.liquid: |
        {% paginate collection.products by section.settings.products_per_page %}
        {% endpaginate %}
        {% schema %}
          {
            "name": "test",
            "settings": {
              "products_per_page": {
                "type": "number",
                "id": "products_per_page",
                "label": "Products per Page",
                "default": 51
              }
            }
          }
        {% endschema %}
