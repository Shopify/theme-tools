        }
    offenses:
      - file: locales/pt-BR.schema.json
        message: "The translation for 'hello.world' is missing"
        start: [1, 2]
        highlight: '"hello": {}'
        fix: |-
          {
            "hello": {
              "world": "TODO"
            }
          }
