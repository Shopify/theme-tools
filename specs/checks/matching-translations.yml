        message: "A default translation for 'world' does not exist"
        start: [2, 2]
        highlight: '"world": "Mundo"'
        suggest:
          - message: Delete unneeded translation key
            result: |-
              {
                "hello": "Olá"
              }
  - name: should report offenses when nested translation keys do not exist (1)
    files:
      locales/en.default.json: |-
        {
          "hello": {
            "world": "Hello, world!"
          }
        }
      locales/pt-BR.json: |-
        {
          "hello": {}
        }
    offenses:
      - file: locales/pt-BR.json
        message: "The translation for 'hello.world' is missing"
        start: [1, 2]
        highlight: '"hello": {}'
        fix: |-
          {
            "hello": {
              "world": "TODO"
            }
          }
