        start: [8, 4]
        highlight: |-
          "results": {
                "few": "A few results",
                "many": "Many results"
              }
  - name: should recognize every plural category in default translations
    files:
      locales/en.default.json: |-
        {
          "a": { "zero": "Zero" },
          "b": { "two": "Two" },
          "c": { "few": "Few" },
          "d": { "many": "Many" }
        }
    offenses:
      - file: locales/en.default.json
        message: "The pluralized translation 'a' is missing the 'other' key"
        start: [1, 2]
        highlight: '"a": { "zero": "Zero" }'
      - file: locales/en.default.json
        message: "The pluralized translation 'b' is missing the 'other' key"
        start: [2, 2]
        highlight: '"b": { "two": "Two" }'
