          "suffixes": { "phone": "Phone", "someone": "Someone", "another": "Another" },
          "mixed": { "one": "One", "title": "Items" },
          "one": { "many": { "title": "Items" } },
          "objects": { "one": { "title": "One" } },
          "nonstrings": { "one": 1, "few": null, "many": true },
          "arrays": [{ "count": { "one": "One" } }]
        }
  - name: should not require other in default translations provided by Shopify or customer accounts
    files:
      locales/en.default.json: |-
        {
          "shopify": { "items": { "one": "One" } },
          "customer_accounts": { "one": "One" }
        }
  - name: should only require other in the storefront default locale
    files:
      locales/fr.json: '{ "items": { "one": "Un article" } }'
      locales/en.default.schema.json: '{ "items": { "one": "One item" } }'
      locales/fr.schema.json: '{ "items": { "one": "Un article" } }'
      assets/en.default.json: '{ "items": { "one": "One item" } }'
      config/settings_data.json: '{ "items": { "one": "One item" } }'
  - name: should not report anything if the default translations are unparseable
    files:
      locales/en.default.json: '{"items":{"one":"One item"}'
  - name: should require other alongside missing and extra translations
    files:
      locales/en.default.json: |-
        {
          "items": { "one": "One item" },
          "title": "Items"
        }
      locales/fr.json: |-
        {
          "items": { "few": "Quelques articles" },
          "extra": "Extra"
        }
    offenses:
      - file: locales/en.default.json
        message: "The pluralized translation 'items' is missing the 'other' key"
        start: [1, 2]
        highlight: '"items": { "one": "One item" }'
      - file: locales/fr.json
        message: "The translation for 'title' is missing"
        start: [0, 0]
        highlight: |-
          {
            "items": { "few": "Quelques articles" },
            "extra": "Extra"
          }
        fix: |-
          {
            "items": {
              "few": "Quelques articles"
            },
            "extra": "Extra",
            "title": "TODO"
          }
      - file: locales/fr.json
        message: "A default translation for 'extra' does not exist"
        start: [2, 2]
        highlight: '"extra": "Extra"'
        suggest:
          - message: Delete unneeded translation key
            result: |-
              {
                "items": {
                  "few": "Quelques articles"
                }
              }
