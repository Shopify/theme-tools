check: MatchingTranslations
severity: error
cases:
  - name: should report offenses when the translation file is missing a key (1)
    files:
      locales/en.default.json: |-
        {
          "hello": "Hello",
          "world": "World"
        }
      locales/pt-BR.json: |-
        {
          "hello": "Olá"
        }
    offenses:
      - file: locales/pt-BR.json
        message: "The translation for 'world' is missing"
        start: [0, 0]
        highlight: |-
          {
            "hello": "Olá"
          }
        fix: |-
          {
            "hello": "Olá",
            "world": "TODO"
          }
  - name: should report offenses when the translation file is missing a key (2)
    files:
      locales/en.default.schema.json: |-
        {
          "hello": "Hello",
          "world": "World"
        }
      locales/pt-BR.schema.json: |-
        {
          "hello": "Olá"
        }
    offenses:
      - file: locales/pt-BR.schema.json
        message: "The translation for 'world' is missing"
        start: [0, 0]
        highlight: |-
          {
            "hello": "Olá"
          }
        fix: |-
          {
            "hello": "Olá",
            "world": "TODO"
          }
  - name: should report offenses when the default translation is missing a key (1)
    files:
      locales/en.default.json: |-
        {
          "hello": "Hello"
        }
      locales/pt-BR.json: |-
        {
          "hello": "Olá",
          "world": "Mundo"
        }
    offenses:
      - file: locales/pt-BR.json
        message: "A default translation for 'world' does not exist"
        start: [2, 2]
        highlight: '"world": "Mundo"'
        suggest:
          - message: Delete unneeded translation key
            result: |-
              {
                "hello": "Olá"
              }
  - name: should report offenses when the default translation is missing a key (2)
    files:
      locales/en.default.schema.json: |-
        {
          "hello": "Hello"
        }
      locales/pt-BR.schema.json: |-
        {
          "hello": "Olá",
