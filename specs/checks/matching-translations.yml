        message: "The pluralized translation 'c' is missing the 'other' key"
        start: [3, 2]
        highlight: '"c": { "few": "Few" }'
      - file: locales/en.default.json
        message: "The pluralized translation 'd' is missing the 'other' key"
        start: [4, 2]
        highlight: '"d": { "many": "Many" }'
  - name: should not report pluralized default translations with other
