check = "SchemaPresetsBlockOrder"
severity = "warning"

[[cases]]
name = "reports no warning when the preset blocks are in the block_order"

[cases.files]
"sections/file.liquid" = '''
  {% schema %}
  {
    "presets": [
      {
        "name": "Preset 1",
        "blocks": {
          "block-1": {
            "type": "text"
          },
          "block-2": {
            "type": "icon"
          }
        },
        "block_order": ["block-1", "block-2"]
      }
    ]
  }
{% endschema %}'''

[[cases]]
name = "reports a warning when not all preset blocks are in the block_order"

[cases.files]
"sections/file.liquid" = '''
{% schema %}
{
  "name": "Test section",
  "presets": [
    {
      "name": "Preset 1",
      "blocks": {
        "block-1": {
          "type": "text"
        },
        "block-2": {
          "type": "icon"
        }
      },
      "block_order": ["block-1"]
    }
  ]
}
{% endschema %}'''

[[cases.offenses]]
file = "sections/file.liquid"
message = "block 'block-2' is missing from the block_order"
start = [ 14, 21 ]
highlight = "[\"block-1\"]"

[[cases]]
name = "reports no warning when the preset blocks has static blocks that are not in the block_order"

