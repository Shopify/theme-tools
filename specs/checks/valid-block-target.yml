        start: [13, 16]
        highlight: '"invalid_preset_block"'
      - file: sections/invalid-preset.liquid
        message: "Theme block 'blocks/invalid_preset_block.liquid' does not exist."
        start: [13, 16]
        highlight: '"invalid_preset_block"'
  - name: "should report errors in presets for private blocks even when @theme is specified at root level (sections bucket)"
    files:
      blocks/_private.liquid: ""
      sections/private-blocks.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "@theme"
            }
          ],
          "presets": [
