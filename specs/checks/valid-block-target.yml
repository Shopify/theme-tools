    offenses:
      - file: sections/invalid-preset.liquid
        message: 'Theme block type "invalid_preset_block" must be allowed in "blocks" at the root of this schema.'
        start: [13, 18]
        highlight: '"invalid_preset_block"'
      - file: sections/invalid-preset.liquid
        message: "Theme block 'blocks/invalid_preset_block.liquid' does not exist."
        start: [13, 18]
        highlight: '"invalid_preset_block"'
  - name: "should report errors for private blocks even when @theme is specified at root level with hash-style presets (sections bucket)"
    files:
      blocks/_private.liquid: ""
      sections/private-blocks.liquid: |
        {% schema %}
        {
