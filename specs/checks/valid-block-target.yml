        start: [13, 18]
        highlight: '"_private"'
      - file: sections/private-blocks.liquid
        message: "Theme block 'blocks/_private.liquid' does not exist."
        start: [13, 18]
        highlight: '"_private"'
  - name: should not report errors for private blocks when listed at root level (sections bucket)
    files:
      blocks/_private.liquid: ""
      sections/private-blocks.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "_private"
