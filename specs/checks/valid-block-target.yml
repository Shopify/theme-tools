    offenses:
      - file: blocks/invalid-block.liquid
        message: "Theme block 'blocks/missing_block.liquid' does not exist."
        start: [13, 18]
        highlight: '"missing_block"'
  - name: should not report an error when a preset defined block file exists with hash-style presets (blocks bucket)
    files:
      blocks/text.liquid: ""
      blocks/invalid-block.liquid: |
        {% schema %}
        {
          "name": "Block name",
          "blocks": [
            {
              "type": "@theme"
            }
          ],
          "presets": [
            {
              "name": "Default",
              "blocks": {
                "text_block": {
                  "type": "text"
                }
              },
              "block_order": ["text_block"]
            }
          ]
        }
        {% endschema %}
  - name: should not report errors for locally scoped blocks at root level
    files:
      sections/local-blocks.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "local_block",
              "name": "Local block"
            }
          ]
        }
        {% endschema %}
  - name: should report an error when a preset defined block is not specified at root level (sections bucket)
    files:
      blocks/text.liquid: ""
      sections/invalid-preset.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "text"
            }
          ],
          "presets": [
            {
              "name": "Default preset",
              "blocks": [
                {
                  "type": "invalid_preset_block"
                }
              ]
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: sections/invalid-preset.liquid
        message: 'Theme block type "invalid_preset_block" must be allowed in "blocks" at the root of this schema.'
        start: [13, 18]
        highlight: '"invalid_preset_block"'
      - file: sections/invalid-preset.liquid
        message: "Theme block 'blocks/invalid_preset_block.liquid' does not exist."
        start: [13, 18]
        highlight: '"invalid_preset_block"'
  - name: should report an error when a default defined block is not specified at root level
