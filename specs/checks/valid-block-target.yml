        message: 'Block type "group" is not allowed in "slide" blocks. Allowed types are: text, image.'
        start: [16, 23]
        highlight: '"group"'
  - name: should report errors for further nested blocks when they are not allowed (sections bucket)
    files:
      blocks/image.liquid: ""
      blocks/group.liquid: |
        {% schema %}
        {
          "name": "Group",
          "blocks": [
            {
              "type": "text"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: ""
      blocks/slide.liquid: |
        {% schema %}
        {
          "name": "Slide",
          "blocks": [
            {
              "type": "group"
            }
          ]
        }
        {% endschema %}
      sections/slideshow.liquid: |
        {% schema %}
        {
          "name": "Slideshow",
          "blocks": [
            {
              "type": "slide"
            }
          ],
          "presets": [
            {
              "name": "Default",
              "blocks": [
                {
                  "type": "slide",
                  "blocks": [
                    {
                      "type": "group",
                      "blocks": [
                        {
                          "type": "image"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: sections/slideshow.liquid
        message: 'Block type "image" is not allowed in "group" blocks. Allowed types are: text.'
        start: [19, 26]
        highlight: '"image"'
  - name: Static Blocks used in a sections file > When presets are defined as a hash > When the static block is used in the same file > is silent for valid static blocks references
    files:
      sections/slideshow.liquid: |2
                          # Static block is defined in the body of the file
                          {% content_for "block", type: "static", id: "static_id" %}

                          {% schema %}
                            {
                              "name": "Slideshow",
                              "presets": [
                                {
                                  "name": "Default",
                                  "blocks": {
          "static_id": {
            "type": "static",
            "static": true,
            "settings": {
              "text": "some text"
            }
          }
        },
                                  "block_order": []
                                }
                              ]
                            }
                          {% endschema %}
      blocks/static.liquid: |
        {% schema %}
          {
            "name": "some static block",
            "settings": [{"type":"text","id":"text","label":"Text"}]
          }
        {% endschema %}
  - name: Static Blocks used in a sections file > When presets are defined as a hash > When the static block is used in the same file > reports a warning for missing (or mismatching) static blocks references
    files:
      sections/slideshow.liquid: |2
                          # Static block is defined in the body of the file
                          {% content_for "block", type: "static", id: "static_id" %}

                          {% schema %}
                            {
                              "name": "Slideshow",
                              "presets": [
                                {
                                  "name": "Default",
                                  "blocks": {
          "mismatching_id": {
            "type": "static",
            "static": true,
            "settings": {
              "text": "some text"
            }
          }
        },
                                  "block_order": []
                                }
                              ]
                            }
                          {% endschema %}
      blocks/static.liquid: |
        {% schema %}
          {
            "name": "some static block",
            "settings": [{"type":"text","id":"text","label":"Text"}]
          }
        {% endschema %}
    offenses:
      - file: sections/slideshow.liquid
        message: 'Could not find a static block of type "static" with id "mismatching_id" in this file.'
        start: [11, 12]
        highlight: '"static"'
  - name: Static Blocks used in a sections file > When presets are defined as a hash > When the static block preset is defined in a nested block > is silent for valid static blocks references
    files:
      sections/slideshow-container.liquid: |2
                          # This file demonstrates how a static block can be used inside a nested block's preset
                          {% content_for "blocks" %}

                          {% schema %}
                            {
                              "name": "Slideshow container",
                              "blocks": [{ "type": "slideshow" }],
                              "presets": [{
                                "name": "default",
                                "block_order": ["slideshow1"],
                                "blocks": {
                                  "slideshow1": {
                                    "type": "slideshow",
                                    "blocks": {
          "static_id": {
            "type": "static",
            "static": true
          }
        },
                                    "block_order": []
                                  }
                                }
                              }]
                            }
                          {% endschema %}
      blocks/slideshow.liquid: |
        # Static block is defined in the body of the file
        {% content_for "block", type: "static", id: "static_id" %}
        # ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^

        {% schema %}
          { "name": "Slideshow" }
        {% endschema %}
      blocks/static.liquid: |
        {% schema %}
          {
            "name": "some static block",
            "settings": [{"type":"text","id":"text","label":"Text"}]
          }
        {% endschema %}
  - name: Static Blocks used in a sections file > When presets are defined as a hash > When the static block preset is defined in a nested block > reports warnings when using a mismatching (or nonexisting) static block
    files:
      sections/slideshow-container.liquid: |2
                          # This file demonstrates how a static block can be used inside a nested block's preset
                          {% content_for "blocks" %}

                          {% schema %}
                            {
                              "name": "Slideshow container",
