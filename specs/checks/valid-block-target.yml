    offenses:
      - file: blocks/invalid-block.liquid
        message: "Theme block 'blocks/missing_block.liquid' does not exist."
        start: [13, 18]
        highlight: '"missing_block"'
  - name: should not report subsequent errors in present defined blocks if error in root level (blocks bucket)
    files:
      blocks/invalid-block.liquid: |
        {% schema %}
        {
          "name": "Block name",
          "blocks": [
            {
              "type": "invalid"
            }
          ],
