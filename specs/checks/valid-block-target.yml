check: ValidBlockTarget
severity: error
cases:
  - name: "should ignore @app and @theme block types in sections bucket"
    files:
      sections/app-theme.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "@app"
            },
            {
              "type": "@theme"
            }
          ]
        }
        {% endschema %}
  - name: should not report any errors when all block files exist (sections bucket)
    files:
      blocks/text.liquid: ""
      sections/valid.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "text"
            }
          ]
        }
        {% endschema %}
  - name: should report errors when root level block file does not exist (sections bucket)
    files:
      sections/invalid-section.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "invalid"
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: sections/invalid-section.liquid
        message: "Theme block 'blocks/invalid.liquid' does not exist."
        start: [5, 14]
        highlight: '"invalid"'
  - name: should report an error when a preset defined block file does not exist (sections bucket)
    files:
      sections/invalid-block.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "@theme"
            }
          ],
          "presets": [
            {
              "name": "Default",
              "blocks": [
                {
                  "type": "missing_block"
                }
              ]
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: sections/invalid-block.liquid
        message: "Theme block 'blocks/missing_block.liquid' does not exist."
        start: [13, 18]
        highlight: '"missing_block"'
  - name: should report an error when default defined block file does not exist
    files:
      sections/invalid-file.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "@theme"
            }
          ],
          "default": {
            "title": "Default",
            "blocks": [
              {
                "name": "some block",
                "type": "missing_block"
              }
            ]
          }
        }
        {% endschema %}
    offenses:
      - file: sections/invalid-file.liquid
        message: "Theme block 'blocks/missing_block.liquid' does not exist."
        start: [13, 16]
        highlight: '"missing_block"'
  - name: should not report subsequent errors in present defined blocks if error in root level (sections bucket)
    files:
      sections/invalid-block.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "invalid"
            }
          ],
          "presets": [
            {
              "name": "Default",
              "blocks": [
                {
                  "type": "text"
                }
              ]
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: sections/invalid-block.liquid
        message: "Theme block 'blocks/invalid.liquid' does not exist."
        start: [5, 14]
        highlight: '"invalid"'
  - name: should report an error when a preset defined block file does not exist with hash-style presets (sections bucket)
    files:
      sections/invalid-block.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "@theme"
            }
          ],
          "presets": [
            {
              "name": "Default",
              "blocks": {
                "missing_block_hash": {
                  "type": "missing_block"
                }
              },
              "block_order": ["missing_block_hash"]
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: sections/invalid-block.liquid
        message: "Theme block 'blocks/missing_block.liquid' does not exist."
        start: [13, 18]
        highlight: '"missing_block"'
  - name: should not report an error when a preset defined block file exists with hash-style presets (sections bucket)
    files:
      blocks/text.liquid: ""
      sections/invalid-block.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "@theme"
            }
          ],
          "presets": [
            {
              "name": "Default",
              "blocks": {
                "text_block": {
                  "type": "text"
                }
              },
              "block_order": ["text_block"]
            }
          ]
        }
        {% endschema %}
  - name: "should ignore @app and @theme block types in blocks bucket"
    files:
      blocks/app-theme.liquid: |
        {% schema %}
        {
          "name": "Block name",
          "blocks": [
            {
              "type": "@app"
            },
            {
              "type": "@theme"
            }
          ]
        }
        {% endschema %}
  - name: should not report any errors when all block files exist (blocks bucket)
    files:
      blocks/text.liquid: ""
      blocks/valid.liquid: |
        {% schema %}
        {
          "name": "Block name",
          "blocks": [
            {
              "type": "text"
            }
          ]
        }
        {% endschema %}
  - name: should report errors when root level block file does not exist (blocks bucket)
    files:
      blocks/invalid-section.liquid: |
        {% schema %}
        {
          "name": "Block name",
          "blocks": [
            {
              "type": "invalid"
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: blocks/invalid-section.liquid
        message: "Theme block 'blocks/invalid.liquid' does not exist."
        start: [5, 14]
        highlight: '"invalid"'
  - name: should report an error when a preset defined block file does not exist (blocks bucket)
    files:
      blocks/invalid-block.liquid: |
        {% schema %}
        {
          "name": "Block name",
          "blocks": [
            {
