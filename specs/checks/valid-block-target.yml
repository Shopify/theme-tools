              "name": "Default",
              "blocks": [
                {
                  "type": "_private"
                }
              ]
            }
          ]
        }
        {% endschema %}
  - name: should handle mixed private and public blocks correctly (sections bucket)
    files:
      blocks/_private.liquid: ""
      blocks/custom.liquid: ""
      sections/mixed-blocks.liquid: |
