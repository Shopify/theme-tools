              ]
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: sections/private-blocks.liquid
        message: 'Theme block type "_private" is a private block so it must be explicitly allowed in "blocks" at the root of this schema.'
        start: [13, 18]
        highlight: '"_private"'
  - name: "should report errors in default for private blocks even when @theme is specified at root level"
    files:
      blocks/_private.liquid: ""
      sections/private-blocks.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "@theme"
            }
