          "default": {
            "name": "Default",
            "blocks": [
              {
                "name": "private",
                "type": "_private"
              }
            ]
          }
        }
        {% endschema %}
    offenses:
      - file: sections/private-blocks.liquid
        message: 'Theme block type "_private" is a private block so it must be explicitly allowed in "blocks" at the root of this schema.'
        start: [13, 16]
        highlight: '"_private"'
  - name: should report errors with correct indices (sections bucket)
    files:
      sections/private-blocks.liquid: |
        {% schema %}
        {
          "name": "Section name",
          "blocks": [
            {
              "type": "@theme"
            }
          ],
