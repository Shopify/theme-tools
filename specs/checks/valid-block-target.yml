                }
              },
              "block_order": ["private_hash"]
            }
          ]
        }
        {% endschema %}
  - name: should report errors for nested blocks when they are not allowed (sections bucket)
    files:
      blocks/image.liquid: ""
      blocks/group.liquid: ""
      blocks/text.liquid: ""
      blocks/slide.liquid: |
        {% schema %}
        {
          "name": "Slide",
          "blocks": [
            {
              "type": "text"
            },
            {
              "type": "image"
            }
          ]
        }
        {% endschema %}
      sections/slideshow.liquid: |
        {% schema %}
        {
          "name": "Slideshow",
          "blocks": [
            {
              "type": "slide"
            }
          ],
          "presets": [
            {
              "name": "Default",
              "blocks": [
                {
                  "type": "slide",
                  "blocks": [
                    {
                      "type": "group"
                    }
                  ]
                }
              ]
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: sections/slideshow.liquid
        message: 'Block type "group" is not allowed in "slide" blocks. Allowed types are: text, image.'
        start: [16, 22]
        highlight: '"group"'
  - name: should report errors for nested private blocks when they are not allowed (sections bucket)
    files:
      blocks/image.liquid: ""
      blocks/_private.liquid: ""
      blocks/text.liquid: ""
      blocks/slide.liquid: |
        {% schema %}
        {
          "name": "Slide",
          "blocks": [
