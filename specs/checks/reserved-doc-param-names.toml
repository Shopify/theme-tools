check = "ReservedDocParamNames"
severity = "error"

[[cases]]
name = "reports Liquid literal parameter names in blocks/file.liquid"

[cases.files]
"blocks/file.liquid" = '''
{% doc %}
  @param nil - Example param
  @param null - Example param
  @param true - Example param
  @param false - Example param
  @param blank - Example param
  @param empty - Example param
{% enddoc %}
'''

[[cases.offenses]]
file = "blocks/file.liquid"
message = "The parameter name 'nil' is reserved because Liquid parses it as a literal."
start = [ 1, 9 ]
highlight = "nil"

[[cases.offenses]]
file = "blocks/file.liquid"
message = "The parameter name 'null' is reserved because Liquid parses it as a literal."
start = [ 2, 9 ]
highlight = "null"

[[cases.offenses]]
file = "blocks/file.liquid"
message = "The parameter name 'true' is reserved because Liquid parses it as a literal."
start = [ 3, 9 ]
highlight = "true"

[[cases.offenses]]
file = "blocks/file.liquid"
message = "The parameter name 'false' is reserved because Liquid parses it as a literal."
start = [ 4, 9 ]
highlight = "false"

[[cases.offenses]]
file = "blocks/file.liquid"
message = "The parameter name 'blank' is reserved because Liquid parses it as a literal."
start = [ 5, 9 ]
highlight = "blank"

[[cases.offenses]]
file = "blocks/file.liquid"
message = "The parameter name 'empty' is reserved because Liquid parses it as a literal."
start = [ 6, 9 ]
highlight = "empty"

