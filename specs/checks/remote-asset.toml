check = "RemoteAsset"
severity = "warning"

[[cases]]
name = "should report an offense when asset_url or img_url filters are not used"

[cases.files]
"file.liquid" = '''
<img src="{{ 'image.png' }}" />
<link href="{{ 'style.css' }}" />
<script src="{{ 'script.js' }}" defer="defer"></script>
{{ url | img_tag }}
'''

[[cases.offenses]]
file = "file.liquid"
message = "Use one of the asset_url filters to serve assets for better performance."
start = [ 0, 5 ]
highlight = "src=\"{{ 'image.png' }}\""

[[cases.offenses]]
file = "file.liquid"
message = "Use one of the asset_url filters to serve assets for better performance."
start = [ 1, 6 ]
highlight = "href=\"{{ 'style.css' }}\""

[[cases.offenses]]
file = "file.liquid"
message = "Use one of the asset_url filters to serve assets for better performance."
start = [ 2, 8 ]
highlight = "src=\"{{ 'script.js' }}\""

[[cases.offenses]]
file = "file.liquid"
message = "Use one of the asset_url filters to serve assets for better performance."
start = [ 3, 3 ]
highlight = "url | img_tag"

[[cases]]
name = "should not report an offense when asset_url or img_url filters are used"

[cases.files]
"file.liquid" = '''
<img src="{{ 'image.png' | asset_url }}" />
<link href="{{ 'style.css' | img_url }}" />
<script src="{{ 'script.js' | img_url }}" defer="defer"></script>
{{ url | img_tag | asset_url }},
{{ 'bootstrap.min.css' | asset_url | stylesheet_tag }}
{{ product | image_url: width: 450 | img_tag }}
'''

[[cases]]
name = "should not report an offense for links, videos, iframes"

[cases.files]
"file.liquid" = '''
<iframe
  id="inlineFrameExample"
  title="Inline Frame Example"
  width="300"
  height="200"
  src="https://www.openstreetmap.org/export/embed.html?bbox=-0.004017949104309083%2C51.47612752641776%2C0.00030577182769775396%2C51.478569861898606&layer=mapnik"
>
</iframe>
<a href="https://google.com"></a>
<embed type="video/webm" src="https://google.com/..." width="250" height="200">
'''

[[cases]]
name = "should not report an offense when asset_url or img_url filters are used with other filters"

[cases.files]
"file.liquid" = '''
<img src="{{ 'image.png' | asset_url | img_url }}" />
<link href="{{ 'style.css' | img_url | asset_url }}" />
<script src="{{ 'script.js' | img_url | asset_url}}" defer="defer"></script>
'''

[[cases]]
name = "should not report an offense for non-asset elements"

[cases.files]
"file.liquid" = '''
<div class="{{ 'my-class' }}"></div>
<a href="{{ 'page.html' }}">Link</a>
'''

[[cases]]
name = "should not report an offense when asset_url filters are used with deprecated assets"

[cases.files]
"file.liquid" = '''
{{ product.featured_image | product_img_url }}
{{ article.image | article_img_url }}
{{ collection.image | collection_img_url }}
{{ 'image.png' | img_url }}
'''

[[cases]]
name = "should not report an offense when asset_url filters are used with non deprecated assets"

[cases.files]
"file.liquid" = '''
{{ 'option_selection.js' | shopify_asset_url }}
{{ 'lightbox.js' | global_asset_url | script_tag }}
{{ 'disclaimer.pdf' | file_url }}
{{ 'potions-header.png' | file_img_url: 'large' }}
{{ 'cart.js' | asset_url }}
{{ 'red-and-black-bramble-berries.jpg' | asset_img_url }}
'''

[[cases]]
name = "should report the correct message and index for a single offense"

[cases.files]
"file.liquid" = "<img src=\"{{ 'image.png' }}\" />"

[[cases.offenses]]
file = "file.liquid"
message = "Use one of the asset_url filters to serve assets for better performance."
start = [ 0, 5 ]
highlight = "src=\"{{ 'image.png' }}\""

[[cases]]
name = "should not report an offense when asset_url filters are used with known assets"

[cases.files]
"file.liquid" = '''
<link rel="canonical" href="{{ canonical_url }}">
    <link href={{ canonical_url }}
    {{ 'example.js' | canonical_url }}'''

[[cases]]
name = "should report an offense for scripts from remote domains"

[cases.files]
"file.liquid" = "<script src=\"https://example.com/jquery.js\" defer></script>"

[[cases.offenses]]
file = "file.liquid"
message = "Asset should be served by the Shopify CDN for better performance."
start = [ 0, 8 ]
highlight = "src=\"https://example.com/jquery.js\""

[[cases]]
name = "should report an offense for remote stylesheets"

[cases.files]
"file.liquid" = '''
<link href="https://example.com/bootstrap.css" rel="stylesheet">
<link href="{{ "https://example.com/bootstrap.css" | replace: 'bootstrap', 'tailwind' }}" rel="stylesheet">
<link href=“https://thisisbad.com/styles.css“>
'''

[[cases.offenses]]
file = "file.liquid"
message = "Asset should be served by the Shopify CDN for better performance."
start = [ 0, 6 ]
highlight = "href=\"https://example.com/bootstrap.css\""

[[cases.offenses]]
file = "file.liquid"
message = "Asset should be served by the Shopify CDN for better performance."
start = [ 1, 6 ]
highlight = "href=\"{{ \"https://example.com/bootstrap.css\" | replace: 'bootstrap', 'tailwind' }}\""

[[cases.offenses]]
file = "file.liquid"
message = "Asset should be served by the Shopify CDN for better performance."
start = [ 2, 6 ]
highlight = "href=“https://thisisbad.com/styles.css“"

[[cases]]
name = "should report an offense when a non shopify cdn is used as a liquid filter and when a asset_url filter is not used."

[cases.files]
"file.liquid" = '''
{{ "https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" | stylesheet_tag }}
'''

[[cases.offenses]]
file = "file.liquid"
message = "Asset should be served by the Shopify CDN for better performance."
start = [ 0, 3 ]
highlight = "\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css\""

[[cases.offenses]]
file = "file.liquid"
message = "Use one of the asset_url filters to serve assets for better performance."
start = [ 0, 3 ]
highlight = "\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css\" | stylesheet_tag"

[[cases]]
name = "should not report an offense for variable-based URLs"

[cases.files]
"file.liquid" = '''
<img src="{{ image }}">
<img src="{{ image.src }}">
<source src="{{ source.url }}" type="{{ source.mime_type }}">
<source src="{{ video_source.url }}">
'''

[[cases]]
name = "should not report an offense for hash URLs"

[cases.files]
"file.liquid" = '''
<link rel="expect" href="#MainContent" blocking="render">
<link href="#section-header" rel="preload">
<img src="#placeholder">
'''

[[cases]]
name = "should not report an offense for base64 encoded data URIs"

[cases.files]
"file.liquid" = '''
<img
  src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
/>
'''

[[cases]]
name = "should not report an offense for various base64 data URI image formats"

[cases.files]
"file.liquid" = '''
<img src="data:image/png;base64,iVBORw0KGgo=" />
<img src="data:image/jpeg;base64,/9j/4AAQSkZJRgAB" />
<img src="data:image/svg+xml;base64,PHN2Zy8+" />
<img src="data:image/webp;base64,UklGRlYA" />
'''

[[cases]]
name = "should still report an offense for remote images alongside base64 images"

[cases.files]
"file.liquid" = '''
<img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" />
<img src="https://example.com/remote-image.png" />
'''

[[cases.offenses]]
file = "file.liquid"
message = "Asset should be served by the Shopify CDN for better performance."
start = [ 1, 5 ]
highlight = "src=\"https://example.com/remote-image.png\""

[[cases]]
name = "should not report an offense for data URIs used with img_tag filter"

[cases.files]
"file.liquid" = '''
{{ 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==' | img_tag }}
'''

[[cases]]
name = "should still report an offense for string literals without asset_url filter"

[cases.files]
"file.liquid" = '''
<img src="{{ 'image.png' }}" />
'''

[[cases.offenses]]
file = "file.liquid"
message = "Use one of the asset_url filters to serve assets for better performance."
start = [ 0, 5 ]
highlight = "src=\"{{ 'image.png' }}\""

[[cases]]
name = "should not report an offence if url is a shopify CDN"

[cases.files]
"file.liquid" = '''
<link rel="preconnect" href="https://fonts.shopifycdn.com" crossorigin>
<link id="ModelViewerStyle" rel="stylesheet" href="https://cdn.shopify.com/shopifycloud/model-viewer-ui/assets/v1.0/model-viewer-ui.css" media="print" onload="this.media='all'">
<script id="hot-reload-client" src="/cdn/shopifycloud/theme-hot-reload/theme-hot-reload.js" defer></script>
'''

[[cases]]
name = "should report an offense if url is not listed in allowedDomains"

[cases.files]
"layout/theme.liquid" = '''
<script src="https://domain.com" defer></script>
'''

[cases.config.RemoteAsset]
allowedDomains = [ "someotherdomain.com" ]

[[cases.offenses]]
file = "layout/theme.liquid"
message = "Asset should be served by the Shopify CDN for better performance."
start = [ 0, 8 ]
highlight = "src=\"https://domain.com\""

[[cases]]
name = "should report an offense if the url in the config is malformed/missing protocol"

[cases.files]
"layout/theme.liquid" = '''
<script src="https://domain.com" defer></script>
<script src="https://www.domain.com" defer></script>
'''

[cases.config.RemoteAsset]
allowedDomains = [ "www.domain.com", "domain.com" ]

[[cases.offenses]]
file = "layout/theme.liquid"
message = "Asset should be served by the Shopify CDN for better performance."
start = [ 0, 8 ]
highlight = "src=\"https://domain.com\""

[[cases.offenses]]
file = "layout/theme.liquid"
message = "Asset should be served by the Shopify CDN for better performance."
start = [ 1, 8 ]
highlight = "src=\"https://www.domain.com\""

[[cases]]
name = "should not report an offense if url is listed in allowedDomains"

[cases.files]
"layout/theme.liquid" = '''
<script src="https://domain.com" defer></script>
'''

[cases.config.RemoteAsset]
allowedDomains = [ "https://domain.com", "http://domain.com", "https://www.domain.com" ]
