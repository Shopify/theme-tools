check: AssetSizeJavaScript
severity: error
cases:
  - name: "should not find file size for invalid URLs: https://{{ settings.url }}"
    files:
      templates/index.liquid: '<script src="https://{{ settings.url }}" defer></script>'
  - name: "should not find file size for invalid URLs: {{ 'this_file_does_not_exist.js' | asset_url }}"
    files:
      templates/index.liquid: "<script src=\"{{ 'this_file_does_not_exist.js' | asset_url }}\" defer></script>"
  - name: "should not find file size for invalid URLs: {% if on_product %}https://hello.world{% else %}https://hi.world{% endif %}"
    files:
      templates/index.liquid: '<script src="{% if on_product %}https://hello.world{% else %}https://hi.world{% endif %}" defer></script>'
  - name: should report a warning when the JavaScript http request exceeds the threshold
    files:
      templates/index.liquid: |
        <html>
          <head>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js" defer></script>
          </head>
        </html>
      https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js: "console.log('hello world');"
    config:
      AssetSizeJavaScript: { thresholdInBytes: 1 }
    offenses:
      - file: templates/index.liquid
        message: JavaScript on every page load exceeds compressed size threshold (1 Bytes), consider using the import on interaction pattern.
        start: [2, 17]
        highlight: "https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
  - name: should not report any offenses if JavaScript is smaller than threshold
    files:
      assets/theme.js: "console.log('hello world'); console.log('Oh. Hi Mark!')"
      templates/index.liquid: |
        <html>
          <head>
            <script src="{{ 'theme.js' | asset_url }}" defer></script>
          </head>
        </html>
  - name: should report an offense if JavaScript is larger than threshold
    files:
      assets/theme.js: "console.log('hello world'); console.log('Oh. Hi Mark!')"
      templates/index.liquid: |
        <html>
          <head>
            <script src="{{ 'theme.js' | asset_url }}" defer></script>
          </head>
        </html>
    config:
      AssetSizeJavaScript: { thresholdInBytes: 2 }
    offenses:
      - file: templates/index.liquid
        message: JavaScript on every page load exceeds compressed size threshold (2 Bytes), consider using the import on interaction pattern.
        start: [2, 17]
        highlight: "{{ 'theme.js' | asset_url }}"
  - name: should not report any offenses for inline JavaScript
    files:
      templates/index.liquid: |
        <html>
          <head>
            <script>
              console.log('hello world');
            </script>
          </head>
        </html>
  - name: should report an offense if JS is larger than threshold
    files:
      assets/theme.js: 'console.log("hello world");'
      templates/index.liquid: |
        <html>
          <head>
            {{ 'theme.js' | asset_url | script_tag }}
            {{ "https://example.com" | script_tag }}
          </head>
        </html>
      https://example.com: "console.log('hello world');"
    config:
      AssetSizeJavaScript: { thresholdInBytes: 2 }
    offenses:
      - file: templates/index.liquid
        message: JavaScript on every page load exceeds compressed size threshold (2 Bytes), consider using the import on interaction pattern.
        start: [2, 7]
        highlight: "'theme.js' | asset_url | script_tag "
      - file: templates/index.liquid
        message: JavaScript on every page load exceeds compressed size threshold (2 Bytes), consider using the import on interaction pattern.
        start: [3, 7]
        highlight: '"https://example.com"'
  - name: should not report any offenses if there is no javascript
    files:
      templates/index.liquid: |
        <html>
          <head>
          </head>
        </html>
