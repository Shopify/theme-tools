check: SchemaOncePerFile
severity: error
cases:
  - name: reports second and subsequent schema tags in a file
    files:
      sections/test.liquid: |-
        {% schema %}{% endschema %}
        {% schema %}{% endschema %}
        {% schema %}{% endschema %}
    offenses:
      - file: sections/test.liquid
        message: "{% schema %} can only appear once per file."
        start: [1, 0]
        highlight: "{% schema %}"
      - file: sections/test.liquid
        message: "{% schema %} can only appear once per file."
        start: [2, 0]
        highlight: "{% schema %}"
