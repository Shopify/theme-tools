check: UnrecognizedBlockArguments
severity: warning
cases:
  - name: accepts schema, LiquidDoc-only, and built-in content parameters
    files:
      blocks/card.liquid: |-
        {% doc %}
          @param {string} tracking_id - Developer-only tracking id
        {% enddoc %}
        {% schema %}
        {"settings":[{"id":"heading","type":"text"}]}
        {% endschema %}
      templates/test.liquid: "{% block 'card', heading: 'Hello', tracking_id: 'hero', content: body %}{% endblock %}"
  - name: accepts a schema parameter without LiquidDoc
    files:
      blocks/card.liquid: |-
        {% schema %}
        {"settings":[{"id":"heading","type":"text"}]}
        {% endschema %}
      templates/test.liquid: "{% block 'card', heading: 'Hello' %}{% endblock %}"
  - name: reports an argument outside the merged interface
    files:
      blocks/card.liquid: |-
        {% doc %}
          @param {string} tracking_id - Developer-only tracking id
        {% enddoc %}
        {% schema %}
        {"settings":[{"id":"heading","type":"text"}]}
        {% endschema %}
      templates/test.liquid: "{% block 'card', heading: 'Hello', unknown: true %}{% endblock %}"
    offenses:
      - file: templates/test.liquid
        message: "Unknown argument 'unknown' in block tag for 'card'."
        start: [0, 35]
        highlight: "unknown: true"
  - name: validates the LiquidDoc-only interface of a schema-less block
    files:
      blocks/card.liquid: |-
        {% doc %}
          @param {string} tracking_id - Developer-only tracking id
        {% enddoc %}
      templates/test.liquid: "{% block 'card', tracking_id: 'hero', unknown: true %}{% endblock %}"
    offenses:
      - file: templates/test.liquid
        message: "Unknown argument 'unknown' in block tag for 'card'."
        start: [0, 38]
        highlight: "unknown: true"
  - name: preserves block.name as the supported caller-side system argument
    files:
      blocks/card.liquid: |-
        {% doc %}
          @param {string} tracking_id - Developer-only tracking id
        {% enddoc %}
        {% schema %}
        {"settings":[{"id":"heading","type":"text"}]}
        {% endschema %}
      templates/test.liquid: "{% block 'card', block.name: 'Card' %}{% endblock %}"
  - name: "leaves dotted arguments to LiquidSyntaxError in {% block 'card', block.settings.heading: 'Hello', unknown: true %}{% endblock %}"
    files:
      blocks/card.liquid: |-
        {% doc %}
          @param {string} tracking_id - Developer-only tracking id
        {% enddoc %}
        {% schema %}
        {"settings":[{"id":"heading","type":"text"}]}
        {% endschema %}
      templates/test.liquid: "{% block 'card', block.settings.heading: 'Hello', unknown: true %}{% endblock %}"
  - name: "leaves dotted arguments to LiquidSyntaxError in {% block 'card', block.unknown: 'value', unknown: true %}{% endblock %}"
    files:
      blocks/card.liquid: |-
        {% doc %}
          @param {string} tracking_id - Developer-only tracking id
        {% enddoc %}
        {% schema %}
        {"settings":[{"id":"heading","type":"text"}]}
        {% endschema %}
      templates/test.liquid: "{% block 'card', block.unknown: 'value', unknown: true %}{% endblock %}"
  - name: does not report unknown arguments for an unreadable missing target
    files:
      templates/test.liquid: "{% block 'card', unknown: 'value' %}{% endblock %}"
  - name: does not report unknown arguments for an unreadable invalid target schema
    files:
      blocks/card.liquid: |-
        {% schema %}
        { invalid
        {% endschema %}
      templates/test.liquid: "{% block 'card', unknown: 'value' %}{% endblock %}"
