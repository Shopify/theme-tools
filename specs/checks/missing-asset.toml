check = "MissingAsset"
severity = "error"

[[cases]]
name = "should report the missing asset when assigned to a variable"

[cases.files]
"snippets/snippet.liquid" = '''
{% assign logo_url = 'logo.png' | asset_url %}
<img src="{{ logo_url }}" alt="Logo" />
'''
"snippets/existing.liquid" = ""

[[cases.offenses]]
file = "snippets/snippet.liquid"
message = "'assets/logo.png' does not exist"
start = [ 0, 21 ]
highlight = "'logo.png'"

[[cases]]
name = "should report the missing asset when defined inline"

[cases.files]
"snippets/snippet.liquid" = "<link rel=\"stylesheet\" href=\"{{ 'styles.css' | asset_url }}\" />"
"snippets/existing.liquid" = ""

[[cases.offenses]]
file = "snippets/snippet.liquid"
message = "'assets/styles.css' does not exist"
start = [ 0, 32 ]
highlight = "'styles.css'"

[[cases]]
name = "should report the missing asset when multiple filters applied"

[cases.files]
"snippets/snippet.liquid" = "<link rel=\"stylesheet\" href=\"{{ 'styles.css' | asset_url | stylesheet_tag}}\" />"
"snippets/existing.liquid" = ""

[[cases.offenses]]
file = "snippets/snippet.liquid"
message = "'assets/styles.css' does not exist"
start = [ 0, 32 ]
highlight = "'styles.css'"

[[cases]]
name = "should report no offenses when an asset file exists"

[cases.files]
"snippets/snippet.liquid" = "<link rel=\"stylesheet\" href=\"{{ 'styles.css' | asset_url }}\" />"
"assets/styles.css" = ""

[[cases]]
name = "should not report for compiled .js.liquid files"

[cases.files]
"snippets/snippet.liquid" = "{{ 'foo.js' | asset_url }} "
"assets/foo.js.liquid" = "console.log(\"{{ \"hi\" }}\");"

[[cases]]
name = "should not report for compiled .css.liquid files"

[cases.files]
"snippets/snippet.liquid" = "{{ 'foo.css' | asset_url }} "
"assets/foo.css.liquid" = "body { color: {{ \"blue\" }}; }"

[[cases]]
name = "should not report for compiled .scss.liquid files"

[cases.files]
"snippets/snippet.liquid" = "{{ 'foo.scss.css' | asset_url }} "
"assets/foo.scss.liquid" = "html { & body { color: {{ \"blue\" }}; } }"
