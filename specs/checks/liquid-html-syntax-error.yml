check: LiquidHTMLSyntaxError
severity: error
cases:
  - name: should detect and fix double pipes in variable output
    files:
      file.liquid: "{{ 'hello' | upcase | | downcase }}"
    docset: default
    offenses:
      - file: file.liquid
        message: 'Syntax is not supported. Remove extra `|` character(s).'
        start: [0, 20]
        highlight: "| | "
        fix: "{{ 'hello' | upcase | downcase }}"
  - name: should detect and fix double pipes with extra whitespace
    files:
      file.liquid: "{{ 'hello' | upcase |   | downcase }}"
    docset: default
    offenses:
      - file: file.liquid
        message: 'Syntax is not supported. Remove extra `|` character(s).'
        start: [0, 20]
        highlight: "|   | "
        fix: "{{ 'hello' | upcase | downcase }}"
  - name: should detect and fix double pipes in assign tag
    files:
      file.liquid: "{% assign result = 'hello' | upcase | | downcase %}"
    docset: default
    offenses:
      - file: file.liquid
        message: 'Syntax is not supported. Remove extra `|` character(s).'
        start: [0, 36]
        highlight: "| | "
        fix: "{% assign result = 'hello' | upcase | downcase %}"
  - name: should detect and fix double pipes in echo tag
    files:
      file.liquid: "{% echo 'hello' | upcase | | downcase %}"
    docset: default
    offenses:
      - file: file.liquid
        message: 'Syntax is not supported. Remove extra `|` character(s).'
        start: [0, 25]
        highlight: "| | "
        fix: "{% echo 'hello' | upcase | downcase %}"
  - name: should handle multiple double pipes in one expression
    files:
      file.liquid: "{{ 'hello' | upcase | | downcase | | reverse }}"
    docset: default
    offenses:
      - file: file.liquid
        message: 'Syntax is not supported. Remove extra `|` character(s).'
        start: [0, 20]
        highlight: "| | "
        fix: "{{ 'hello' | upcase | downcase | | reverse }}"
      - file: file.liquid
        message: 'Syntax is not supported. Remove extra `|` character(s).'
        start: [0, 33]
        highlight: "| | "
        fix: "{{ 'hello' | upcase | | downcase | reverse }}"
    autofix:
      file.liquid: "{{ 'hello' | upcase | downcase | reverse }}"
  - name: should detect and fix trailing pipe in variable output
    files:
      file.liquid: "{{ 'hello' | upcase | }}"
    docset: default
    offenses:
      - file: file.liquid
        message: 'Syntax is not supported. Remove the trailing `|` character.'
        start: [0, 19]
        highlight: " |"
        fix: "{{ 'hello' | upcase }}"
  - name: should detect and fix trailing pipe in assign tag
    files:
      file.liquid: "{% assign result = 'hello' | upcase | %}"
    docset: default
    offenses:
      - file: file.liquid
        message: 'Syntax is not supported. Remove the trailing `|` character.'
        start: [0, 35]
        highlight: " |"
        fix: "{% assign result = 'hello' | upcase %}"
  - name: should detect and fix trailing pipe in echo tag
    files:
      file.liquid: "{% echo 'hello' | upcase | %}"
    docset: default
    offenses:
      - file: file.liquid
        message: 'Syntax is not supported. Remove the trailing `|` character.'
        start: [0, 24]
        highlight: " |"
        fix: "{% echo 'hello' | upcase %}"
  - name: should detect and fix multiple trailing pipes
    files:
      file.liquid: "{{ 'hello' | upcase | | }}"
    docset: default
    offenses:
      - file: file.liquid
        message: 'Syntax is not supported. Remove the trailing `|` character.'
        start: [0, 19]
        highlight: " | |"
        fix: "{{ 'hello' | upcase }}"
  - name: should handle mixed valid and invalid pipes
    files:
      file.liquid: "{{ 'hello' | upcase | | downcase | reverse | }}"
    docset: default
    offenses:
      - file: file.liquid
        message: 'Syntax is not supported. Remove extra `|` character(s).'
        start: [0, 20]
        highlight: "| | "
        fix: "{{ 'hello' | upcase | downcase | reverse | }}"
      - file: file.liquid
        message: 'Syntax is not supported. Remove the trailing `|` character.'
        start: [0, 42]
        highlight: " |"
        fix: "{{ 'hello' | upcase | | downcase | reverse }}"
    autofix:
      file.liquid: "{{ 'hello' | upcase | downcase | reverse }}"
  - name: should not interfere with valid filter parameter syntax
    files:
      file.liquid: "{{ 'hello' | append: 'world' | upcase }}"
    docset: default
  - name: should handle liquid tag with mixed pipe issues
    files:
      file.liquid: |-
        {% liquid
                assign foo = 'test' | upcase | | downcase |
                echo bar | reverse
              %}
    docset: default
    offenses:
      - file: file.liquid
        message: 'Syntax is not supported. Remove extra `|` character(s).'
        start: [1, 37]
        highlight: "| | "
        fix: |-
          {% liquid
                  assign foo = 'test' | upcase | downcase |
                  echo bar | reverse
                %}
      - file: file.liquid
        message: 'Syntax is not supported. Remove the trailing `|` character.'
        start: [1, 49]
        highlight: " |"
        fix: |-
          {% liquid
                  assign foo = 'test' | upcase | | downcase
                  echo bar | reverse
                %}
    autofix:
      file.liquid: |-
        {% liquid
                assign foo = 'test' | upcase | downcase
                echo bar | reverse
              %}
  - name: should not report on valid filter chains
    files:
      file.liquid: "{{ 'hello' | upcase | append: 'world' | downcase }}"
    docset: default
  - name: should not report on simple filters
    files:
      file.liquid: "{{ 'hello' | upcase }}"
    docset: default
  - name: should not report on filters with arguments
    files:
      file.liquid: "{{ product.title | append: ' - ' | append: shop.name }}"
    docset: default
  - name: should not report on valid assign with filters
    files:
      file.liquid: '{% assign title = product.title | upcase | truncate: 50 %}'
    docset: default
  - name: should not report on valid echo with filters
    files:
      file.liquid: '{% echo product.title | upcase | truncate: 50 %}'
    docset: default
  - name: should handle pipes in string literals correctly
    files:
      file.liquid: "{{ 'hello | world' | upcase }}"
    docset: default
  - name: should not report on conditional expressions with pipes
    files:
      file.liquid: "{{ product.title | default: 'No title' }}"
    docset: default
  - name: should not report an offense for valid boolean expressions (1)
    files:
      file.liquid: "{% if 1 > 2 %}hello{% endif %}"
    docset: default
  - name: should not report an offense for valid boolean expressions (2)
    files:
      file.liquid: "{% if variable == 5 %}hello{% endif %}"
    docset: default
  - name: should not report an offense for valid boolean expressions (3)
    files:
      file.liquid: "{% if 'abc' contains 'a' %}hello{% endif %}"
    docset: default
  - name: should not report an offense for valid boolean expressions (4)
    files:
      file.liquid: "{% if product.title != '' %}hello{% endif %}"
    docset: default
  - name: should not report an offense for valid boolean expressions (5)
    files:
      file.liquid: "{% if 1 and 2 %}hello{% endif %}"
    docset: default
  - name: should not report an offense for valid boolean expressions (6)
    files:
      file.liquid: "{% if true or false %}hello{% endif %}"
    docset: default
  - name: should not report an offense for valid boolean expressions (7)
    files:
      file.liquid: "{% if 10 > 5 and user.active %}hello{% endif %}"
    docset: default
  - name: should not report an offense for valid boolean expressions (8)
    files:
      file.liquid: "{% if price >= 100 or discount %}hello{% endif %}"
    docset: default
  - name: should not report an offense for valid boolean expressions (9)
    files:
      file.liquid: "{% if user.name contains 'admin' or user.role == 'owner' %}hello{% endif %}"
    docset: default
  - name: should not report an offense for valid single values (1)
    files:
      file.liquid: "{% if variable %}hello{% endif %}"
    docset: default
  - name: should not report an offense for valid single values (2)
    files:
      file.liquid: "{% if user.active %}hello{% endif %}"
    docset: default
  - name: should not report an offense for valid single values (3)
    files:
      file.liquid: "{% if true %}hello{% endif %}"
    docset: default
  - name: should not report an offense for valid single values (4)
    files:
      file.liquid: "{% if false %}hello{% endif %}"
    docset: default
  - name: should not report an offense for valid single values (5)
    files:
      file.liquid: "{% if 1 %}hello{% endif %}"
    docset: default
  - name: should not report an offense for valid single values (6)
    files:
      file.liquid: "{% if 0 %}hello{% endif %}"
    docset: default
  - name: should not report an offense for valid single values (7)
