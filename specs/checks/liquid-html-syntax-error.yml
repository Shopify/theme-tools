    docset: default
  - name: should not report an offense for valid single values (8)
    files:
      file.liquid: "{% if contains %}hello{% endif %}"
    docset: default
  - name: should report an offense when parser stops at numbers
    files:
      file.liquid: "{% if 7 1 > 100 %}hello{% endif %}"
    docset: default
    offenses:
      - file: file.liquid
        message: "Syntax is not supported: Expression stops at truthy value '7', and will ignore: '1 > 100'"
        start: [0, 6]
        highlight: "7 1 > 100"
        fix: "{% if 7 %}hello{% endif %}"
  - name: should report an offense when parser stops at strings
    files:
      file.liquid: "{% if 'hello' 1 > 100 %}world{% endif %}"
