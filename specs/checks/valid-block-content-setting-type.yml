check: ValidBlockContentSettingType
severity: error
cases:
  - name: reports a number schema setting named content on its type
    files:
      blocks/card.liquid: |-
        {% schema %}
        {"settings":[{"id":"content","type":"number"}]}
        {% endschema %}
    offenses:
      - file: blocks/card.liquid
        message: "Schema setting 'content' has Liquid type 'number', but the built-in 'content' parameter has type 'string'."
        start: [1, 36]
        highlight: '"number"'
  - name: reports a checkbox schema setting named content on its type
    files:
      blocks/card.liquid: |-
        {% schema %}
        {"settings":[{"id":"content","type":"checkbox"}]}
        {% endschema %}
    offenses:
      - file: blocks/card.liquid
        message: "Schema setting 'content' has Liquid type 'boolean', but the built-in 'content' parameter has type 'string'."
        start: [1, 36]
        highlight: '"checkbox"'
  - name: reports a product schema setting named content on its type
    files:
      blocks/card.liquid: |-
        {% schema %}
        {"settings":[{"id":"content","type":"product"}]}
        {% endschema %}
    offenses:
      - file: blocks/card.liquid
        message: "Schema setting 'content' has Liquid type 'product', but the built-in 'content' parameter has type 'string'."
        start: [1, 36]
        highlight: '"product"'
  - name: reports a product_list schema setting named content on its type
    files:
      blocks/card.liquid: |-
        {% schema %}
        {"settings":[{"id":"content","type":"product_list"}]}
        {% endschema %}
    offenses:
      - file: blocks/card.liquid
        message: "Schema setting 'content' has Liquid type 'product[]', but the built-in 'content' parameter has type 'string'."
        start: [1, 36]
        highlight: '"product_list"'
  - name: accepts a string-compatible text schema setting named content
    files:
      blocks/card.liquid: |-
        {% schema %}
        {"settings":[{"id":"content","type":"text"}]}
        {% endschema %}
  - name: accepts a string-compatible textarea schema setting named content
    files:
      blocks/card.liquid: |-
        {% schema %}
        {"settings":[{"id":"content","type":"textarea"}]}
        {% endschema %}
  - name: accepts a string-compatible richtext schema setting named content
    files:
      blocks/card.liquid: |-
        {% schema %}
        {"settings":[{"id":"content","type":"richtext"}]}
        {% endschema %}
  - name: accepts a string-compatible inline_richtext schema setting named content
    files:
      blocks/card.liquid: |-
        {% schema %}
        {"settings":[{"id":"content","type":"inline_richtext"}]}
        {% endschema %}
  - name: accepts a string-compatible html schema setting named content
    files:
      blocks/card.liquid: |-
        {% schema %}
        {"settings":[{"id":"content","type":"html"}]}
        {% endschema %}
  - name: does not speculate about an unmapped schema setting type named content
    files:
      blocks/card.liquid: |-
        {% schema %}
        {"settings":[{"id":"content","type":"metaobject"}]}
        {% endschema %}
  - name: accepts non-string schema settings with other IDs
    files:
      blocks/card.liquid: |-
        {% schema %}
        {"settings":[{"id":"count","type":"number"}]}
        {% endschema %}
  - name: does not report a non-string content setting outside theme block files
    files:
      sections/main.liquid: |-
        {% schema %}
        {"settings":[{"id":"content","type":"number"}]}
        {% endschema %}
  - name: reports the schema mismatch once alongside ValidBlockArgumentTypes
    checks: [ValidBlockArgumentTypes, ValidBlockContentSettingType]
    files:
      blocks/card.liquid: |-
        {% doc %}
          @param {string} [content] - Body
        {% enddoc %}
        {% schema %}
        {"settings":[{"id":"content","type":"number"}]}
        {% endschema %}
    offenses:
      - check: ValidBlockContentSettingType
        file: blocks/card.liquid
        message: "Schema setting 'content' has Liquid type 'number', but the built-in 'content' parameter has type 'string'."
        start: [4, 36]
        highlight: '"number"'
  - name: names the built-in parameter as the string authority when schema and LiquidDoc agree on another type
    checks: [ValidBlockArgumentTypes, ValidBlockContentSettingType]
    files:
      blocks/card.liquid: |-
        {% doc %}
          @param {number} [content] - Body
        {% enddoc %}
        {% schema %}
        {"settings":[{"id":"content","type":"number"}]}
        {% endschema %}
    offenses:
      - check: ValidBlockContentSettingType
        file: blocks/card.liquid
        message: "Schema setting 'content' has Liquid type 'number', but the built-in 'content' parameter has type 'string'."
        start: [4, 36]
        highlight: '"number"'
      - check: ValidBlockArgumentTypes
        file: blocks/card.liquid
        message: "The built-in parameter 'content' has Liquid type 'string', but LiquidDoc declares 'number'. The built-in parameter type is authoritative."
        start: [1, 9]
        highlight: "{number}"
