check: ValidContentForArguments
severity: error
cases:
  - name: should not report offenses for strategies we do not know or support yet
    files:
      file.liquid: '{% content_for "snippet", closest.product: product %}'
  - name: "should accept `closest.*` kwargs"
    files:
      file.liquid: '{% content_for "blocks", closest.product: product %}'
  - name: "should not accept `context.*` kwargs"
    files:
      file.liquid: '{% content_for "blocks", context.product: product %}'
    offenses:
      - file: file.liquid
        message: "{% content_for \"blocks\" %} only accepts 'closest.*' arguments"
        start: [0, 25]
        highlight: "context.product: product"
  - name: "should report offenses for non-`closest.*` kwargs"
    files:
      file.liquid: '{% content_for "blocks", product: product %}'
    offenses:
      - file: file.liquid
        message: "{% content_for \"blocks\" %} only accepts 'closest.*' arguments"
        start: [0, 25]
        highlight: "product: product"
  - name: should accept valid arguments
    files:
      file.liquid: '{% content_for "block", type: "text", id: "static-block" %}'
  - name: "should report an offense if 'type' is not a string"
    files:
      file.liquid: '{% content_for "block", type: 10, id: "static-block" %}'
    offenses:
      - file: file.liquid
        message: "The 'type' argument should be a string"
        start: [0, 30]
        highlight: "10"
        suggest: []
  - name: "should report an offense if 'id' is not a string"
    files:
      file.liquid: '{% content_for "block", type: "foo", id: (0..10) %}'
    offenses:
      - file: file.liquid
        message: "The 'id' argument should be a string"
        start: [0, 41]
        highlight: "(0..10)"
        suggest: []
  - name: should accept static arguments
    files:
      file.liquid: '{% content_for "block", type: "foo", id: "id", product: product %}'
  - name: should report an offense for reserved arguments
    files:
      file.liquid: '{% content_for "block", type: "foo", id: "id", settings: settings %}'
    offenses:
      - file: file.liquid
        message: "{% content_for \"block\" %} doesn't support 'settings' because it's a reserved argument."
        start: [0, 47]
        highlight: "settings: settings"
  - name: should report offenses for multiple reserved arguments
    files:
      file.liquid: '{% content_for "block", type: "foo", id: "id", settings: settings, section: section %}'
    offenses:
      - file: file.liquid
        message: "{% content_for \"block\" %} doesn't support 'settings' because it's a reserved argument."
        start: [0, 47]
        highlight: "settings: settings"
      - file: file.liquid
        message: "{% content_for \"block\" %} doesn't support 'section' because it's a reserved argument."
        start: [0, 67]
        highlight: "section: section"
