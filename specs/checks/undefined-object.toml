[[cases]]
name = "reports schema settings used as bare variables in an app block"
mode = "app"
docset = "default"

[cases.files]
"blocks/card.liquid" = '''
<h2>{{ heading }}</h2>
{% schema %}{"name":"Card","settings":[{"type":"text","id":"heading","label":"Heading"}]}{% endschema %}
'''

[[cases.offenses]]
file = "blocks/card.liquid"
message = "Unknown object 'heading' used."
start = [ 0, 7 ]
highlight = "heading"

[[cases]]
name = "should report an offense when object is undefined"
docset = "default"

[cases.files]
"file.liquid" = '''
{{ my_var }}
'''

[[cases.offenses]]
file = "file.liquid"
message = "Unknown object 'my_var' used."
start = [ 0, 3 ]
highlight = "my_var"

[[cases]]
name = "should report an offense when object with an attribute is undefined"
docset = "default"

