file = "file.liquid"
message = "Unknown object 'c' used."
start = [ 4, 3 ]
highlight = "c"

[[cases.offenses]]
file = "file.liquid"
message = "Unknown object 'c' used."
start = [ 9, 3 ]
highlight = "c"

