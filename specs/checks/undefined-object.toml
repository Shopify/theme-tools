"blocks/card.liquid" = '''
{% doc %}
  @param {string} [eyebrow]
{% enddoc %}
<p>{{ eyebrow }}</p>
<div>{{ content }}</div>
{% schema %}
  { "name": "Card", "settings": [
{% endschema %}
'''

[[cases]]
name = "reports schema settings used as bare variables in a section file"
docset = "default"

[cases.files]
"sections/hero.liquid" = '''
<h2>{{ heading }}</h2>
{% schema %}{"name":"Card","settings":[{"type":"text","id":"heading","label":"Heading"}]}{% endschema %}
'''

[[cases.offenses]]
file = "sections/hero.liquid"
message = "Unknown object 'heading' used."
start = [ 0, 7 ]
highlight = "heading"

[[cases]]
name = "should not report an offense when a self defined variable is defined with a @param tag"
docset = "default"

[cases.files]
"snippets/file.liquid" = '''
{% doc %}
  @param {string} text
{% enddoc %}

{% assign text = text | default: "value" %}
'''

[[cases]]
name = "should report an offense when assigning an undefined variable to itself"
docset = "default"

[cases.files]
"file.liquid" = '''
{% assign my_var = my_var | default: "fallback" %}
'''

[[cases.offenses]]
file = "file.liquid"
message = "Unknown object 'my_var' used."
start = [ 0, 19 ]
highlight = "my_var"

[[cases]]
name = "should not report an offense when using variables inside visible_if statements in a schema tag"
docset = "default"

[cases.files]
"file.liquid" = '''
{% schema %}
{
  "settings": [
    {
      "type": "text",
      "label": "foo",
      "id": "foo",
    }
    {
      "type": "text",
      "label": "bar",
      "id": "bar",
      "visible_if": "{{ block.settings.foo }}",
    }
  ]
}
{% endschema %}
'''
