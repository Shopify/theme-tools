check = "ValidSchemaName"
severity = "error"

[[cases]]
name = "reports offense with schema name over 25 characters long"

[cases.files]
"sections/file.liquid" = '''
{% schema %}
  {
    "name": "test-schema-name-that-is-too-long"
  }
{% endschema %}
'''

[[cases.offenses]]
file = "sections/file.liquid"
message = "Schema name 'test-schema-name-that-is-too-long' is too long (max 25 characters)"
start = [ 2, 12 ]
highlight = "\"test-schema-name-that-is-too-long\""

[[cases]]
name = "reports no offenses with schema name translation that exists and is not over 25 chars long"

[cases.files]
"locales/en.default.schema.json" = "{ \"default\": { \"my_translation_key\": \"My translation is good.\"}}"
"code.liquid" = '''
{% schema %}
  {
    "name": "t:default.my_translation_key"
  }
{% endschema %}'''

[[cases]]
name = "reports an offense with schema name translation that exists and is over 25 chars long"

[cases.files]
"locales/en.default.schema.json" = "{ \"my_translation_key\": \"My translation is tooooooooo long.\"}"
"blocks/code.liquid" = '''
{% schema %}
  {
    "name": "t:my_translation_key"
  }
{% endschema %}'''

[[cases.offenses]]
file = "blocks/code.liquid"
message = "Schema name 'My translation is tooooooooo long.' from 'locales/en.default.schema.json' is too long (max 25 characters)"
start = [ 2, 12 ]
highlight = "\"t:my_translation_key\""
