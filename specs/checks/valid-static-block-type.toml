check = "ValidStaticBlockType"
severity = "error"

[[cases]]
name = "should not report any offenses if type is valid"

[cases.files]
"blocks/valid.liquid" = "Hello world!"
"blocks/file.liquid" = "{% content_for \"block\", type: \"valid\", id: \"static-block\" %}"

[[cases]]
name = "should report an offense if type is invalid"

[cases.files]
"blocks/valid.liquid" = "Hello world!"
"blocks/file.liquid" = "{% content_for \"block\", type: \"invalid\", id: \"static-block\" %}"

[[cases.offenses]]
file = "blocks/file.liquid"
message = "'blocks/invalid.liquid' does not exist"
start = [ 0, 30 ]
highlight = "\"invalid\""
suggest = []
