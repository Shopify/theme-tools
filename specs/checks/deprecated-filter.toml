check = "DeprecatedFilter"
severity = "warning"

[[cases]]
name = "should report an offense when a deprecated filter is used"
docset = "default"

[cases.files]
"file.liquid" = '''
{{ '#EA5AB9' | hex_to_rgba }}
{{ '#EA5AB9' | hex_to_rgba: 0.5 }}
'''

[[cases.offenses]]
file = "file.liquid"
message = "Deprecated filter 'hex_to_rgba', consider using 'color_to_rgb'."
start = [ 0, 13 ]
highlight = "| hex_to_rgba"
fix = '''
{{ '#EA5AB9' | color_to_rgb }}
{{ '#EA5AB9' | hex_to_rgba: 0.5 }}
'''

[[cases.offenses]]
file = "file.liquid"
message = "Deprecated filter 'hex_to_rgba', consider using 'color_to_rgb'."
start = [ 1, 13 ]
highlight = "| hex_to_rgba: 0.5"
fix = '''
{{ '#EA5AB9' | hex_to_rgba }}
{{ '#EA5AB9' | color_to_rgb | color_modify: 'alpha', 0.5 }}
'''

[cases.autofix]
"file.liquid" = '''
{{ '#EA5AB9' | color_to_rgb }}
{{ '#EA5AB9' | color_to_rgb | color_modify: 'alpha', 0.5 }}
'''

[[cases]]
name = "should not report an offense when a non-deprecated filter is used"
docset = "default"

[cases.files]
"file.liquid" = '''
{{ '#EA5AB9' | color_to_rgb }}
{{ '#EA5AB9' | color_to_rgb | color_modify: 'alpha', 0.5 }}
'''

[[cases]]
name = "should suggest a fix to replace the deprecated 'hex_to_rgba' filter"
docset = "default"

[cases.files]
"file.liquid" = "{{ \"#EA5AB9\" | hex_to_rgba }}"

[[cases.offenses]]
file = "file.liquid"
message = "Deprecated filter 'hex_to_rgba', consider using 'color_to_rgb'."
start = [ 0, 13 ]
highlight = "| hex_to_rgba"
fix = "{{ \"#EA5AB9\" | color_to_rgb }}"

[[cases]]
name = "should suggest a fix to replace the deprecated 'hex_to_rgba' filter when an alpha value is passed"
docset = "default"

[cases.files]
"file.liquid" = "{{ \"#EA5AB9\" | hex_to_rgba: 0.5 }}"

[[cases.offenses]]
file = "file.liquid"
message = "Deprecated filter 'hex_to_rgba', consider using 'color_to_rgb'."
start = [ 0, 13 ]
highlight = "| hex_to_rgba: 0.5"
fix = "{{ \"#EA5AB9\" | color_to_rgb | color_modify: 'alpha', 0.5 }}"

