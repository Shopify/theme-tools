check = "MissingBlockArguments"
severity = "warning"

[[cases]]
name = "does not require schema settings with implicit platform defaults"

[cases.files]
"blocks/card.liquid" = '''
{% schema %}
{"settings":[{"id":"title","type":"text"},{"id":"enabled","type":"checkbox"}]}
{% endschema %}'''
"templates/test.liquid" = "{% block 'card' %}{% endblock %}"

[[cases]]
name = "does not require schema settings with explicit schema defaults"

[cases.files]
"blocks/card.liquid" = '''
{% schema %}
{"settings":[{"id":"columns","type":"range","min":1,"max":4,"step":1,"default":2},{"id":"heading_font","type":"font_picker","default":"assistant_n4"}]}
{% endschema %}'''
"templates/test.liquid" = "{% block 'card' %}{% endblock %}"

[[cases]]
name = "does not require schema settings with settings that forbid defaults"

[cases.files]
"blocks/card.liquid" = '''
{% schema %}
{"settings":[{"id":"product","type":"product"},{"id":"image","type":"image_picker"}]}
{% endschema %}'''
"templates/test.liquid" = "{% block 'card' %}{% endblock %}"

[[cases]]
name = "requires a LiquidDoc echo of a schema setting with an implicit platform default"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {boolean} enabled - Enabled
{% enddoc %}
{% schema %}
{"settings":[{"id":"enabled","type":"checkbox"}]}
{% endschema %}'''
"templates/test.liquid" = "{% block 'card' %}{% endblock %}"

[[cases.offenses]]
file = "templates/test.liquid"
message = "Missing required argument 'enabled' in block tag for 'card'."
start = [ 0, 0 ]
highlight = "{% block 'card' %}"

[[cases]]
name = "requires a LiquidDoc echo of a schema setting with an explicit schema default"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {number} columns - Columns
{% enddoc %}
{% schema %}
{"settings":[{"id":"columns","type":"range","min":1,"max":4,"step":1,"default":2}]}
{% endschema %}'''
"templates/test.liquid" = "{% block 'card' %}{% endblock %}"

[[cases.offenses]]
file = "templates/test.liquid"
message = "Missing required argument 'columns' in block tag for 'card'."
start = [ 0, 0 ]
highlight = "{% block 'card' %}"

[[cases]]
name = "requires a LiquidDoc echo of a schema setting with a setting that forbids defaults"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {image} image - Image
{% enddoc %}
{% schema %}
{"settings":[{"id":"image","type":"image_picker"}]}
{% endschema %}'''
"templates/test.liquid" = "{% block 'card' %}{% endblock %}"

[[cases.offenses]]
file = "templates/test.liquid"
message = "Missing required argument 'image' in block tag for 'card'."
start = [ 0, 0 ]
highlight = "{% block 'card' %}"

[[cases]]
name = "keeps optional LiquidDoc echoes of schema settings optional"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} [title] - Title
{% enddoc %}
{% schema %}
{"settings":[{"id":"title","type":"text"}]}
{% endschema %}'''
"templates/test.liquid" = "{% block 'card' %}{% endblock %}"

[[cases]]
name = "applies requiredness to LiquidDoc-only developer parameters"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} developer_id - Developer-only id
{% enddoc %}
{% schema %}
{"settings":[{"id":"title","type":"text"}]}
{% endschema %}'''
"templates/test.liquid" = "{% block 'card' %}{% endblock %}"

[[cases.offenses]]
file = "templates/test.liquid"
message = "Missing required argument 'developer_id' in block tag for 'card'."
start = [ 0, 0 ]
highlight = "{% block 'card' %}"

[[cases]]
name = "requires LiquidDoc-only parameters from a schema-less block"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} tracking_id - Tracking id
{% enddoc %}'''
"templates/test.liquid" = "{% block 'card' %}{% endblock %}"

[[cases.offenses]]
file = "templates/test.liquid"
message = "Missing required argument 'tracking_id' in block tag for 'card'."
start = [ 0, 0 ]
highlight = "{% block 'card' %}"

[[cases]]
name = "accepts an explicit argument for required built-in content"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} content - Body
{% enddoc %}
{% schema %}
{"settings":[]}
{% endschema %}'''
"templates/test.liquid" = "{% block 'card', content: body %}{% endblock %}"

[[cases]]
name = "accepts an explicit argument for required schema-backed content"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} content - Body
{% enddoc %}
{% schema %}
{"settings":[{"id":"content","type":"text"}]}
{% endschema %}'''
"templates/test.liquid" = "{% block 'card', content: body %}{% endblock %}"

[[cases]]
name = "treats text in the invocation body as required content"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} content - Body
{% enddoc %}
{% schema %}
{"settings":[]}
{% endschema %}'''
"templates/test.liquid" = "{% block 'card' %}Body{% endblock %}"

[[cases]]
name = "treats a comment in the invocation body as required content"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} content - Body
{% enddoc %}
{% schema %}
{"settings":[]}
{% endschema %}'''
"templates/test.liquid" = "{% block 'card' %}{% comment %}Hidden{% endcomment %}{% endblock %}"

[[cases]]
name = "treats an assignment in the invocation body as required content"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} content - Body
{% enddoc %}
{% schema %}
{"settings":[]}
{% endschema %}'''
"templates/test.liquid" = "{% block 'card' %}{% assign value = 'hidden' %}{% endblock %}"

[[cases]]
name = "accepts a body for required schema-backed content"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} content - Body
{% enddoc %}
{% schema %}
{"settings":[{"id":"content","type":"text"}]}
{% endschema %}'''
"templates/test.liquid" = "{% block 'card' %}Body{% endblock %}"

[[cases]]
name = "does not treat a whitespace-only body as required content"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} content - Body
{% enddoc %}
{% schema %}
{"settings":[]}
{% endschema %}'''
"templates/test.liquid" = """
{% block 'card' %}
  \t
{% endblock %}"""

[[cases.offenses]]
file = "templates/test.liquid"
message = "Missing required argument 'content' in block tag for 'card'."
start = [ 0, 0 ]
highlight = "{% block 'card' %}"

[[cases]]
name = "requires schema-backed content when LiquidDoc declares it required"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} content - Body
{% enddoc %}
{% schema %}
{"settings":[{"id":"content","type":"text"}]}
{% endschema %}'''
"templates/test.liquid" = "{% block 'card' %}{% endblock %}"

[[cases.offenses]]
file = "templates/test.liquid"
message = "Missing required argument 'content' in block tag for 'card'."
start = [ 0, 0 ]
highlight = "{% block 'card' %}"

[[cases]]
name = "keeps schema-backed content optional when LiquidDoc declares it optional"

[cases.files]
"blocks/card.liquid" = '''
{% doc %}
  @param {string} [content] - Body
{% enddoc %}
{% schema %}
{"settings":[{"id":"content","type":"text"}]}
{% endschema %}'''
"templates/test.liquid" = "{% block 'card' %}{% endblock %}"

[[cases]]
name = "does not report missing arguments for an unreadable missing target"

[cases.files]
"templates/test.liquid" = "{% block 'card' %}{% endblock %}"

[[cases]]
name = "does not report missing arguments for an unreadable invalid target schema"

[cases.files]
"blocks/card.liquid" = '''
{% schema %}
{ invalid
{% endschema %}'''
"templates/test.liquid" = "{% block 'card' %}{% endblock %}"
