check: LiquidSyntaxError
severity: error
cases:
  - name: accepts section keyword arguments
    files:
      snippets/test.liquid: "{% section 'header', color: 'red' %}"

  # The parser (LiquidHTMLSyntaxError) catches this one, not this check.
  - name: does not report bare bracket section keyword argument values
    files:
      snippets/test.liquid: "{% section 'header', foo: [0] %}"

  - name: knows tags from the docset inside liquid blocks
    docset:
      tags: [{ name: custom_tag }]
    files:
      snippets/test.liquid: |-
        {% liquid
          custom_tag
        %}

  - name: reports unknown tags inside liquid blocks
    files:
      snippets/test.liquid: |-
        {% liquid
          hello world
        %}
    offenses:
      - file: snippets/test.liquid
        message: Unknown tag 'hello'
        start: [1, 2]
        highlight: hello world

  - name: reports each unknown tag where it is, even when the text repeats
    files:
      snippets/test.liquid: |-
        {% liquid
          echo 'hello world'
          hello world
          hello world
        %}
    offenses:
      - file: snippets/test.liquid
        message: Unknown tag 'hello'
        start: [2, 2]
        highlight: hello world
      - file: snippets/test.liquid
        message: Unknown tag 'hello'
        start: [3, 2]
        highlight: hello world
  - name: reports parameter offenses for plain arguments
    checks: &block-checks
      - LiquidSyntaxError
      - MissingBlockArguments
      - UnrecognizedBlockArguments
      - ValidBlockArgumentTypes
      - DuplicateBlockArguments
    docset: default
    files:
      templates/test.liquid: "{% block 'card', unknown: true, count: 'many', count: 'more' %}{% endblock %}"
      blocks/card.liquid: &card |-
        {% doc %}
          @param {string} heading - Heading
          @param {string} tracking_id - Tracking id
        {% enddoc %}
        {% schema %}
        {"settings":[{"id":"heading","type":"text"},{"id":"count","type":"number"}]}
        {% endschema %}
    offenses:
      - check: DuplicateBlockArguments
        file: templates/test.liquid
        message: "Duplicate argument 'count' in block tag for 'card'."
        start: [0, 47]
        highlight: "count: 'more'"
      - check: MissingBlockArguments
        file: templates/test.liquid
        message: "Missing required argument 'heading' in block tag for 'card'."
        start: [0, 0]
        highlight: "{% block 'card', unknown: true, count: 'many', count: 'more' %}"
      - check: MissingBlockArguments
        file: templates/test.liquid
        message: "Missing required argument 'tracking_id' in block tag for 'card'."
        start: [0, 0]
        highlight: "{% block 'card', unknown: true, count: 'many', count: 'more' %}"
      - check: UnrecognizedBlockArguments
        file: templates/test.liquid
        message: "Unknown argument 'unknown' in block tag for 'card'."
        start: [0, 17]
        highlight: "unknown: true"
      - check: ValidBlockArgumentTypes
        file: templates/test.liquid
        message: "Type mismatch for argument 'count': expected number, got string"
        start: [0, 39]
        highlight: "'many'"
      - check: ValidBlockArgumentTypes
        file: templates/test.liquid
        message: "Type mismatch for argument 'count': expected number, got string"
        start: [0, 54]
        highlight: "'more'"
  - name: accepts block.name with a string value
    checks: *block-checks
    docset: default
    files:
      templates/test.liquid: "{% block 'card', block.name: 'Card', heading: 'Hello', count: 1, tracking_id: 'id' %}{% endblock %}"
      blocks/card.liquid: *card
  - name: "reports only one syntax error for block.settings.heading: 'Hello'"
    checks: *block-checks
    docset: default
    files:
      templates/test.liquid: "{% block 'card', block.settings.heading: 'Hello', count: 'many', count: 'more' %}{% endblock %}"
      blocks/card.liquid: *card
    offenses:
      - check: LiquidSyntaxError
        file: templates/test.liquid
        message: "Liquid syntax error: in 'block' - Use 'heading:' instead of 'block.settings.heading:' when calling a block."
        start: [0, 17]
        highlight: "block.settings.heading: 'Hello'"
  - name: 'reports only one syntax error for block.settings.count: 1'
    checks: *block-checks
    docset: default
    files:
      templates/test.liquid: "{% block 'card', block.settings.count: 1, count: 'many', count: 'more' %}{% endblock %}"
      blocks/card.liquid: *card
    offenses:
      - check: LiquidSyntaxError
        file: templates/test.liquid
        message: "Liquid syntax error: in 'block' - Use 'count:' instead of 'block.settings.count:' when calling a block."
        start: [0, 17]
        highlight: "block.settings.count: 1"
  - name: 'reports only one syntax error for block.content: body'
    checks: *block-checks
    docset: default
    files:
      templates/test.liquid: "{% block 'card', block.content: body, count: 'many', count: 'more' %}{% endblock %}"
      blocks/card.liquid: *card
    offenses:
      - check: LiquidSyntaxError
        file: templates/test.liquid
        message: "Liquid syntax error: in 'block' - Use plain named arguments, for example: block 'name', heading: value"
        start: [0, 17]
        highlight: "block.content: body"
  - name: "reports only one syntax error for block.settings.heading.label: 'Hello'"
    checks: *block-checks
    docset: default
    files:
      templates/test.liquid: "{% block 'card', block.settings.heading.label: 'Hello', count: 'many', count: 'more' %}{% endblock %}"
      blocks/card.liquid: *card
    offenses:
      - check: LiquidSyntaxError
        file: templates/test.liquid
        message: "Liquid syntax error: in 'block' - Use plain named arguments, for example: block 'name', heading: value"
        start: [0, 17]
        highlight: "block.settings.heading.label: 'Hello'"
  - name: "reports only one syntax error for heading.label: 'Hello'"
    checks: *block-checks
    docset: default
    files:
      templates/test.liquid: "{% block 'card', heading.label: 'Hello', count: 'many', count: 'more' %}{% endblock %}"
      blocks/card.liquid: *card
    offenses:
      - check: LiquidSyntaxError
        file: templates/test.liquid
        message: "Liquid syntax error: in 'block' - Use plain named arguments, for example: block 'name', heading: value"
        start: [0, 17]
        highlight: "heading.label: 'Hello'"
  - name: 'reports only one syntax error for block.name: value'
    checks: *block-checks
    docset: default
    files:
      templates/test.liquid: "{% block 'card', block.name: value, count: 'many', count: 'more' %}{% endblock %}"
      blocks/card.liquid: *card
    offenses:
      - check: LiquidSyntaxError
        file: templates/test.liquid
        message: "Syntax error in 'block' tag"
        start: [0, 0]
        highlight: "{% block 'card', block.name: value, count: 'many', count: 'more' %}{% endblock %}"
  - name: "reports only one syntax error for block.name: value, heading.label: 'Hello'"
    checks: *block-checks
    docset: default
    files:
      templates/test.liquid: "{% block 'card', block.name: value, heading.label: 'Hello', count: 'many', count: 'more' %}{% endblock %}"
      blocks/card.liquid: *card
    offenses:
      - check: LiquidSyntaxError
        file: templates/test.liquid
        message: "Liquid syntax error: in 'block' - Use plain named arguments, for example: block 'name', heading: value"
        start: [0, 36]
        highlight: "heading.label: 'Hello'"
  - name: 'reports only one syntax error for block.name: value, block.settings.count: 1'
    checks: *block-checks
    docset: default
    files:
      templates/test.liquid: "{% block 'card', block.name: value, block.settings.count: 1, count: 'many', count: 'more' %}{% endblock %}"
      blocks/card.liquid: *card
    offenses:
      - check: LiquidSyntaxError
        file: templates/test.liquid
        message: "Liquid syntax error: in 'block' - Use 'count:' instead of 'block.settings.count:' when calling a block."
        start: [0, 36]
        highlight: "block.settings.count: 1"
  - name: "reports only one syntax error for block.settings.heading: 'Hello', block.content: body"
    checks: *block-checks
    docset: default
    files:
      templates/test.liquid: "{% block 'card', block.settings.heading: 'Hello', block.content: body, count: 'many', count: 'more' %}{% endblock %}"
      blocks/card.liquid: *card
    offenses:
      - check: LiquidSyntaxError
        file: templates/test.liquid
        message: "Liquid syntax error: in 'block' - Use 'heading:' instead of 'block.settings.heading:' when calling a block."
        start: [0, 17]
        highlight: "block.settings.heading: 'Hello'"
  - name: "reports only one syntax error for block.content: body, block.settings.heading: 'Hello'"
    checks: *block-checks
    docset: default
    files:
      templates/test.liquid: "{% block 'card', block.content: body, block.settings.heading: 'Hello', count: 'many', count: 'more' %}{% endblock %}"
      blocks/card.liquid: *card
    offenses:
      - check: LiquidSyntaxError
        file: templates/test.liquid
        message: "Liquid syntax error: in 'block' - Use plain named arguments, for example: block 'name', heading: value"
        start: [0, 17]
        highlight: "block.content: body"
  - name: does not report unknown tags like {% foobar %}
    files:
      snippets/test.liquid: "{% foobar %}"
  - name: reports misplaced branch keyword else
    files:
      snippets/test.liquid: "{% else %}"
    offenses:
      - file: snippets/test.liquid
        message: "Unknown tag 'else'"
        start: [0, 0]
        highlight: "{% else %}"
  - name: reports misplaced branch keyword when
    files:
      snippets/test.liquid: "{% when x %}"
    offenses:
      - file: snippets/test.liquid
        message: "Unknown tag 'when'"
        start: [0, 0]
        highlight: "{% when x %}"
  - name: reports misplaced branch keyword when inside if
    files:
      snippets/test.liquid: "{% if true %}{% when x %}{% endif %}"
    offenses:
      - file: snippets/test.liquid
        message: "Unknown tag 'when'"
        start: [0, 13]
        highlight: "{% when x %}"
  - name: reports misplaced branch keyword when inside for
    files:
      snippets/test.liquid: "{% for x in xs %}{% when x %}{% endfor %}"
    offenses:
      - file: snippets/test.liquid
        message: "Unknown tag 'when'"
        start: [0, 17]
        highlight: "{% when x %}"
  - name: reports misplaced branch keyword when inside liquid
    files:
      snippets/test.liquid: |-
        {% liquid
          when x
        %}
    offenses:
      - file: snippets/test.liquid
        message: "Unknown tag 'when'"
        start: [1, 2]
        highlight: when x
  - name: reports misplaced branch keyword elsif inside liquid
    files:
      snippets/test.liquid: |-
        {% liquid
          elsif x
        %}
    offenses:
      - file: snippets/test.liquid
        message: "Unknown tag 'elsif'"
        start: [1, 2]
        highlight: elsif x
  - name: does not report valid else branches in {% if true %}{% else %}{% endif %}
    files:
      snippets/test.liquid: "{% if true %}{% else %}{% endif %}"
  - name: does not report valid else branches in {% case x %}{% when x %}{% else %}{% endcase %}
    files:
      snippets/test.liquid: "{% case x %}{% when x %}{% else %}{% endcase %}"
  - name: does not report valid else branches in {% for x in xs %}{% else %}{% endfor %}
    files:
      snippets/test.liquid: "{% for x in xs %}{% else %}{% endfor %}"
  - name: reports no-space multiline comments without prefixed continuation lines
    files:
      snippets/test.liquid: |-
        {% #hello
        world %}
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in tag '#' - Each line of comments must be prefixed by the '#' character"
        start: [0, 0]
        highlight: |-
          {% #hello
          world %}
  - name: accepts no-space multiline comments with prefixed continuation lines
    files:
      snippets/test.liquid: |-
        {% #hello
        #world %}
  - name: "accepts Ruby's blank-first-line single-continuation shape"
    files:
      snippets/test.liquid: |-
        {% #
        world %}
  - name: "produces no diagnostics for {% assign x = 1 %}"
    files:
      snippets/test.liquid: "{% assign x = 1 %}"
  - name: "produces no diagnostics for {% assign x = 'hello' %}"
    files:
      snippets/test.liquid: "{% assign x = 'hello' %}"
  - name: "produces no diagnostics for {% assign x = foo.bar %}"
    files:
      snippets/test.liquid: "{% assign x = foo.bar %}"
  - name: "produces no diagnostics for {% assign x = foo | filter %}"
    files:
      snippets/test.liquid: "{% assign x = foo | filter %}"
  - name: "produces no diagnostics for {% assign x = %} (empty RHS)"
    files:
      snippets/test.liquid: "{% assign x = %}"
  - name: "produces no diagnostics for {% assign x extra = x %}"
    files:
      snippets/test.liquid: "{% assign x extra = x %}"
  - name: 'matches Ruby Liquid parity for unclosed assign quote prefix in {% assign "x = y %}'
    files:
      snippets/test.liquid: '{% assign "x = y %}'
  - name: "matches Ruby Liquid parity for unclosed assign quote prefix in {% assign 'x = y %}"
    files:
      snippets/test.liquid: "{% assign 'x = y %}"
  - name: "reports LiquidSyntaxError for {% assign = 1 %} (missing LHS)"
    files:
      snippets/test.liquid: "{% assign = 1 %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'assign' tag"
        start: [0, 0]
        highlight: "{% assign = 1 %}"
  - name: "reports LiquidSyntaxError for {% assign x.y = 1 %} (dotted LHS)"
    files:
      snippets/test.liquid: "{% assign x.y = 1 %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'assign' tag"
        start: [0, 0]
        highlight: "{% assign x.y = 1 %}"
  - name: "reports LiquidSyntaxError for {% assign !x = 1 %} (garbage before target)"
    files:
      snippets/test.liquid: "{% assign !x = 1 %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'assign' tag"
        start: [0, 0]
        highlight: "{% assign !x = 1 %}"
  - name: "reports diagnostics for {% assign x 42 = x %}"
    files:
      snippets/test.liquid: "{% assign x 42 = x %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'assign' tag"
        start: [0, 0]
        highlight: "{% assign x 42 = x %}"
  - name: "reports diagnostics for {% assign x 'hi' = x %}"
    files:
      snippets/test.liquid: "{% assign x 'hi' = x %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'assign' tag"
        start: [0, 0]
        highlight: "{% assign x 'hi' = x %}"
  - name: "reports diagnostics for {% assign x ? = x %}"
    files:
      snippets/test.liquid: "{% assign x ? = x %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'assign' tag"
        start: [0, 0]
        highlight: "{% assign x ? = x %}"
  - name: "reports LiquidSyntaxError for {% assign x = foo | %} (empty filter)"
    files:
      snippets/test.liquid: "{% assign x = foo | %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'assign' tag"
        start: [0, 0]
        highlight: "{% assign x = foo | %}"
  - name: produces no diagnostics for valid capture tags inside liquid blocks
    files:
      snippets/test.liquid: |-
        {% liquid
          capture x
          endcapture
        %}
  - name: reports LiquidSyntaxError for skipped capture markup inside liquid blocks
    files:
      snippets/test.liquid: |-
        {% liquid
          capture @x
          endcapture
        %}
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'capture' tag"
        start: [1, 2]
        highlight: |-
          capture @x
            endcapture
  - name: produces no diagnostics for {% include 42 %}
    files:
      snippets/test.liquid: "{% include 42 %}"
  - name: produces no diagnostics for {% include 3.14 %}
    files:
      snippets/test.liquid: "{% include 3.14 %}"
  - name: produces no diagnostics for {% include -5 %}
    files:
      snippets/test.liquid: "{% include -5 %}"
  - name: produces no diagnostics for {% include true %}
    files:
      snippets/test.liquid: "{% include true %}"
  - name: produces no diagnostics for {% include false %}
    files:
      snippets/test.liquid: "{% include false %}"
  - name: produces no diagnostics for {% include nil %}
    files:
      snippets/test.liquid: "{% include nil %}"
  - name: produces no diagnostics for {% include blank %}
    files:
      snippets/test.liquid: "{% include blank %}"
  - name: produces no diagnostics for {% include empty %}
    files:
      snippets/test.liquid: "{% include empty %}"
  - name: produces no diagnostics for {% include (1..5) %}
    files:
      snippets/test.liquid: "{% include (1..5) %}"
  - name: "reports LiquidSyntaxError for {% include ? %}"
    files:
      snippets/test.liquid: "{% include ? %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'include' tag"
        start: [0, 0]
        highlight: "{% include ? %}"
  - name: reports LiquidSyntaxError for bare bracket access in include bindings
    files:
      snippets/test.liquid: "{% include 42 for [0] %}"
    offenses:
      - file: snippets/test.liquid
        message: Bare bracket access is not allowed in strict2 mode
        start: [0, 0]
        highlight: "{% include 42 for [0] %}"
  - name: reports LiquidSyntaxError for multipart include named arguments
    files:
      snippets/test.liquid: "{% include 42, key.secondkey: value %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'include' tag"
        start: [0, 0]
        highlight: "{% include 42, key.secondkey: value %}"
  - name: produces no diagnostics for {% echo %}
    files:
      snippets/test.liquid: "{% echo %}"
  - name: produces no diagnostics for {% echo    %}
    files:
      snippets/test.liquid: "{% echo    %}"
  - name: produces no diagnostics for {{ }}
    files:
      snippets/test.liquid: "{{ }}"
  - name: produces no diagnostics for {{    }}
    files:
      snippets/test.liquid: "{{    }}"
  - name: reports LiquidSyntaxError for garbage-only variable output
    files:
      snippets/test.liquid: "{{ @ }}"
    offenses:
      - file: snippets/test.liquid
        message: Syntax error in variable output
        start: [0, 0]
        highlight: "{{ @ }}"
  - name: "produces no diagnostics for {{ product.title | append: }}"
    files:
      snippets/test.liquid: "{{ product.title | append: }}"
  - name: "produces no diagnostics for {% echo product.title | append: %}"
    files:
      snippets/test.liquid: "{% echo product.title | append: %}"
  - name: "produces no diagnostics for {% assign title = product.title | append: %}"
    files:
      snippets/test.liquid: "{% assign title = product.title | append: %}"
  - name: "reports diagnostics for malformed prefixes in {{ x y | append: }}"
    files:
      snippets/test.liquid: "{{ x y | append: }}"
    offenses:
      - file: snippets/test.liquid
        message: Syntax error in variable output
        start: [0, 0]
        highlight: "{{ x y | append: }}"
  - name: "reports diagnostics for malformed prefixes in {% echo x y | append: %}"
    files:
      snippets/test.liquid: "{% echo x y | append: %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'echo' tag"
        start: [0, 0]
        highlight: "{% echo x y | append: %}"
  - name: "reports diagnostics for malformed prefixes in {% assign a = x y | append: %}"
    files:
      snippets/test.liquid: "{% assign a = x y | append: %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'assign' tag"
        start: [0, 0]
        highlight: "{% assign a = x y | append: %}"
  - name: "reports diagnostics for {{ product.title | }}"
    files:
      snippets/test.liquid: "{{ product.title | }}"
    offenses:
      - file: snippets/test.liquid
        message: Syntax error in variable output
        start: [0, 0]
        highlight: "{{ product.title | }}"
  - name: "reports diagnostics for {% echo product.title | %}"
    files:
      snippets/test.liquid: "{% echo product.title | %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'echo' tag"
        start: [0, 0]
        highlight: "{% echo product.title | %}"
  - name: reports LiquidSyntaxError for bare bracket tablerow named argument values
    files:
      snippets/test.liquid: "{% tablerow product in collection.products cols: [0] %}{% endtablerow %}"
    offenses:
      - file: snippets/test.liquid
        message: Bare bracket access is not allowed
        start: [0, 0]
        highlight: "{% tablerow product in collection.products cols: [0] %}{% endtablerow %}"
  - name: uses injected tag docs to allow known loop arguments
    files:
      snippets/test.liquid: "{% tablerow product in collection.products cols: 3 limit: 6 %}{% endtablerow %}"
  - name: produces no diagnostics for {% cycle x, %}
    files:
      snippets/test.liquid: "{% cycle x, %}"
  - name: produces no diagnostics for {% tablerow product in collection.products, %}{% endtablerow %}
    files:
      snippets/test.liquid: "{% tablerow product in collection.products, %}{% endtablerow %}"
  - name: produces no diagnostics for {% paginate collection.products by 12, %}{% endpaginate %}
    files:
      snippets/test.liquid: "{% paginate collection.products by 12, %}{% endpaginate %}"
  - name: reports diagnostics for {% cycle x,, %}
    files:
      snippets/test.liquid: "{% cycle x,, %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'cycle' tag"
        start: [0, 0]
        highlight: "{% cycle x,, %}"
  - name: "reports diagnostics for {% cycle x @, %}"
    files:
      snippets/test.liquid: "{% cycle x @, %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'cycle' tag"
        start: [0, 0]
        highlight: "{% cycle x @, %}"
  - name: reports diagnostics for {% tablerow product in collection.products,, %}{% endtablerow %}
    files:
      snippets/test.liquid: "{% tablerow product in collection.products,, %}{% endtablerow %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'tablerow' tag"
        start: [0, 0]
        highlight: "{% tablerow product in collection.products,, %}{% endtablerow %}"
  - name: "reports diagnostics for {% tablerow product in collection.products @, %}{% endtablerow %}"
    files:
      snippets/test.liquid: "{% tablerow product in collection.products @, %}{% endtablerow %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'tablerow' tag"
        start: [0, 0]
        highlight: "{% tablerow product in collection.products @, %}{% endtablerow %}"
  - name: reports diagnostics for {% paginate collection.products by 12,, %}{% endpaginate %}
    files:
      snippets/test.liquid: "{% paginate collection.products by 12,, %}{% endpaginate %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'paginate' tag"
        start: [0, 0]
        highlight: "{% paginate collection.products by 12,, %}"
  - name: "reports diagnostics for {% paginate collection.products by 12 @, %}{% endpaginate %}"
    files:
      snippets/test.liquid: "{% paginate collection.products by 12 @, %}{% endpaginate %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'paginate' tag"
        start: [0, 0]
        highlight: "{% paginate collection.products by 12 @, %}"
  - name: emits a single LiquidSyntaxError on the same line
    files:
      snippets/test.liquid: "{% assign x = foo | %}"
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'assign' tag"
        start: [0, 0]
        highlight: "{% assign x = foo | %}"
  - name: keeps one offense per line when errors are on different lines
    files:
      snippets/test.liquid: |-
        {% assign x = foo | %}
        {% assign = 1 %}
    offenses:
      - file: snippets/test.liquid
        message: "Syntax error in 'assign' tag"
        start: [0, 0]
        highlight: "{% assign x = foo | %}"
      - file: snippets/test.liquid
        message: "Syntax error in 'assign' tag"
        start: [1, 0]
        highlight: "{% assign = 1 %}"
  - name: "reports LiquidSyntaxError for {% case [0] %} (bare bracket in case expression)"
    files:
      snippets/test.liquid: "{% case [0] %}{% when 1 %}{% endcase %}"
    offenses:
      - file: snippets/test.liquid
        message: Bare bracket access is not allowed
        start: [0, 0]
        highlight: "{% case [0] %}{% when 1 %}{% endcase %}"
  - name: "reports LiquidSyntaxError for {% when [0] %} (bare bracket in when value)"
    files:
      snippets/test.liquid: "{% case x %}{% when [0] %}{% endcase %}"
    offenses:
      - file: snippets/test.liquid
        message: Bare bracket access is not allowed
