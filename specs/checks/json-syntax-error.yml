check: JSONSyntaxError
severity: error
cases:
  - name: should report an error for invalid JSON (0)
    files:
      file.json: |-
        {
              "key1": "value1",
              "key2": "value2",,
            }
    offenses:
      - file: file.json
        message: Property name expected
        start: [2, 23]
        highlight: ","
      - file: file.json
        message: Expecting a value
        start: [2, 23]
        highlight: ","
  - name: should report an error for invalid JSON (1)
    files:
      file.json: |
        {
              "key1": "value1",
              "key2": "value2"
    offenses:
      - file: file.json
        message: Expecting a closing brace (})
        start: [3, 0]
        highlight: ""
  - name: should report an error for invalid JSON (2)
    files:
      file.json: |-
        {
              'key1': "value1",
              "key2": "value2"
            }
    offenses:
      - file: file.json
        message: Invalid symbol
        start: [1, 6]
        highlight: "'key1'"
      - file: file.json
        message: Property name expected
        start: [1, 12]
        highlight: ":"
      - file: file.json
        message: Expecting a value
        start: [1, 22]
        highlight: ","
  - name: should not report any errors for valid JSON
    files:
      file.json: |-
        {
              "key1": "value1",
              "key2": "value2"
            }
