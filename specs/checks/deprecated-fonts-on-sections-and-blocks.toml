check = "DeprecatedFontsOnSectionsAndBlocks"
severity = "warning"

[[cases]]
name = "reports no warning when the setting has a non-deprecated font as default value"

[cases.files]
"sections/file.liquid" = '''
  {% schema %}
  {
    "settings": [
      {
        "type": "font_picker",
        "id": "heading_font",
        "label": "Heading font",
        "default": "alegreya_n4"
      }
    ]
  }
{% endschema %}'''

[[cases]]
name = "reports a warning when setting has a deprecated font as default value"

[cases.files]
"sections/file.liquid" = '''
  {% schema %}
  {
    "settings": [
      {
        "type": "font_picker",
        "id": "heading_font",
        "label": "Heading font",
        "default": "helvetica_n4"
      }
    ]
  }
{% endschema %}'''

[[cases.offenses]]
file = "sections/file.liquid"
message = "setting 'heading_font' is using deprecated font 'helvetica_n4'"
start = [ 7, 19 ]
highlight = "\"helvetica_n4\""

