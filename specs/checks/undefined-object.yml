check: UndefinedObject
severity: warning
cases:
  - name: allows section in a snippet in app mode
    mode: app
    docset: default
    files:
      snippets/my-snippet.liquid: '{% doc %} @param {string} x - x {% enddoc %}{{ section }}'
  - name: allows block in a snippet in app mode
    mode: app
    docset: default
    files:
      snippets/my-snippet.liquid: '{% doc %} @param {string} x - x {% enddoc %}{{ block }}'
  - name: allows recommendations in a snippet in app mode
    mode: app
    docset: default
    files:
      snippets/my-snippet.liquid: '{% doc %} @param {string} x - x {% enddoc %}{{ recommendations }}'
  - name: allows app in a snippet in app mode
    mode: app
    docset: default
    files:
      snippets/my-snippet.liquid: '{% doc %} @param {string} x - x {% enddoc %}{{ app }}'
  - name: reports schema settings used as bare variables in an app block
    mode: app
    docset: default
    files:
      blocks/card.liquid: |
        <h2>{{ heading }}</h2>
        {% schema %}{"name":"Card","settings":[{"type":"text","id":"heading","label":"Heading"}]}{% endschema %}
    offenses:
      - file: blocks/card.liquid
        message: Unknown object 'heading' used.
        start: [0, 7]
        highlight: heading
  - name: should report an offense when object is undefined
    files:
      file.liquid: |
        {{ my_var }}
    docset: default
    offenses:
      - file: file.liquid
        message: "Unknown object 'my_var' used."
        start: [0, 3]
        highlight: my_var
  - name: should report an offense when object with an attribute is undefined
    files:
      file.liquid: |
        {{ my_var.my_attr }}
    docset: default
    offenses:
      - file: file.liquid
        message: "Unknown object 'my_var' used."
        start: [0, 3]
        highlight: my_var.my_attr
  - name: should report an offense when undefined object is used as an argument
    files:
      file.liquid: |
        {{ product[my_object] }}
        {{ product[my_object] }}

        {% comment %} string arguments should not be reported {% endcomment %}
        {{ product["my_object"] }}
    docset: default
    offenses:
      - file: file.liquid
        message: "Unknown object 'my_object' used."
        start: [0, 11]
        highlight: my_object
      - file: file.liquid
        message: "Unknown object 'my_object' used."
        start: [1, 11]
        highlight: my_object
  - name: should report an offense when object is undefined in a Liquid tag
    files:
      file.liquid: |
        {% liquid
          echo my_var
        %}
    docset: default
    offenses:
      - file: file.liquid
        message: "Unknown object 'my_var' used."
        start: [1, 7]
        highlight: my_var
  - name: should not report an offense when object is defined with an assign tag
    files:
      file.liquid: |
        {% assign my_var = "value" %}
        {{ my_var }}
    docset: default
  - name: should not report an offense when object is defined with an assign tag and it is used as an argument
    files:
      file.liquid: |
        {% assign prop = "title" %}
        {{ product[prop] }}
    docset: default
  - name: should not report an offense when object is defined with an assign tag in a Liquid tag
    files:
      file.liquid: |
        {% liquid
          assign my_var = "value"
          echo my_var
        %}
    docset: default
  - name: should not report an offense when object is defined with a capture tag
    files:
      file.liquid: |
        {% capture my_var %} value {% endcapture %}
        {{ my_var }}
    docset: default
  - name: should not report an offense when object is defined in a for loop
    files:
      file.liquid: |
        {% for c in collections %}
          {{ c }}
        {% endfor %}
    docset: default
  - name: should report an offense when object is defined in a for loop but used outside of the scope
    files:
      file.liquid: |
        {% for c in collections %}
          {{ c }}
        {% endfor %}{{ c }}
    docset: default
    offenses:
      - file: file.liquid
        message: "Unknown object 'c' used."
        start: [2, 15]
        highlight: c
  - name: should report an offense when object is defined in a for loop but used outside of the scope (in scenarios where the same variable has multiple scopes in the file)
    files:
      file.liquid: |
        {% for c in collections %}
          {% comment %} -- Scope 1 -- {% endcomment %}
          {{ c }}
        {% endfor %}
        {{ c }}
        {% for c in collections %}
          {% comment %} -- Scope 2 -- {% endcomment %}
          {{ c }}
        {% endfor %}
        {{ c }}
    docset: default
    offenses:
      - file: file.liquid
        message: "Unknown object 'c' used."
        start: [4, 3]
        highlight: c
      - file: file.liquid
        message: "Unknown object 'c' used."
        start: [9, 3]
        highlight: c
  - name: should report an offense when undefined object defines another object
    files:
      file.liquid: |
        {% assign my_object = my_var %}
        {{ my_object }}
    docset: default
    offenses:
      - file: file.liquid
        message: "Unknown object 'my_var' used."
        start: [0, 22]
        highlight: my_var
  - name: should not report an offense when object is defined in a tablerow loop
    files:
      file.liquid: |
        {% tablerow c in collections %}
          {{ c }}
        {% endtablerow %}
    docset: default
  - name: should report an offense when object is defined in a tablerow loop but used outside of the scope
    files:
      file.liquid: |
        {% tablerow c in collections %}
          {{ c }}
        {% endtablerow %}{{ c }}
    docset: default
    offenses:
      - file: file.liquid
        message: "Unknown object 'c' used."
        start: [2, 20]
        highlight: c
  - name: should contextually report on the undefined nature of the paginate object (defined in paginate tag, undefined outside)
    files:
      file.liquid: |
        {% assign col = 'string' | split: '' %}
        {% paginate col by 5 %}
          {{ paginate }}
        {% endpaginate %}{{ paginate }}
    docset: default
    offenses:
      - file: file.liquid
        message: "Unknown object 'paginate' used."
        start: [3, 20]
        highlight: paginate
  - name: should contextually report on the undefined nature of the form object (defined in form tag, undefined outside)
    files:
      file.liquid: |
        {% form "cart" %}
          {{ form }}
        {% endform %}{{ form }}
    docset: default
    offenses:
      - file: file.liquid
        message: "Unknown object 'form' used."
        start: [2, 16]
        highlight: form
  - name: should support {% layout none %}
    files:
      file.liquid: |
        {% layout none %}
        {{ none }}
    docset: default
    offenses:
      - file: file.liquid
        message: "Unknown object 'none' used."
        start: [1, 3]
        highlight: none
  - name: should support {% increment var %} and {% decrement var %} (1)
    files:
      file.liquid: |
        {% increment var %}
        {{ var }}
    docset: default
  - name: should support {% increment var %} and {% decrement var %} (2)
    files:
      file.liquid: |
        {% decrement var %}
        {{ var }}
    docset: default
  - name: 'should not report an offense when object is undefined in a "snippet" file with no presense of doc tags'
    files:
      snippets/file.liquid: |
        {{ my_var }}
  - name: 'should report an offense when object is undefined in a "snippet" file with doc tags that are missing the associated param'
    files:
      snippets/file.liquid: |
        {% doc %}
        {% enddoc %}
        {{ my_var }}
    docset: default
    offenses:
      - file: snippets/file.liquid
        message: "Unknown object 'my_var' used."
        start: [2, 3]
        highlight: my_var
  - name: "should not report an offense when object is defined with @param in a snippet file"
    files:
      snippets/file.liquid: |
        {% doc %}
          @param {string} text
        {% enddoc %}

        {{ text }}
    docset: default
  - name: should report an offense when object is not global
    files:
      file.liquid: |
        {{ image }}
    docset: default
    offenses:
      - file: file.liquid
        message: "Unknown object 'image' used."
        start: [0, 3]
        highlight: image
  - name: should not report an offense for forloop/tablerowloop variables when in the correct context (1)
    files:
      file.liquid: |
        {% for x in collections %}
          {{ forloop }}
        {% endfor %}
    docset: default
  - name: should not report an offense for forloop/tablerowloop variables when in the correct context (2)
    files:
      file.liquid: |
        {% tablerow x in collections %}
          {{ tablerowloop }}
        {% endtablerow %}
    docset: default
  - name: should support contextual exceptions (1)
