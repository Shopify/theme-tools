check = "DeprecateBgsizes"
severity = "warning"

[[cases]]
name = "should report offenses for deprecated attributes"

[cases.files]
"file.liquid" = '''
<div class="lazyload" data-bgset="image.jpg"></div>
<div class="lazyload" data-bgset="image2.jpg"></div>
'''

[[cases.offenses]]
file = "file.liquid"
message = "Use the native loading=\"lazy\" attribute instead of lazysizes"
start = [ 0, 12 ]
highlight = "lazyload"

[[cases.offenses]]
file = "file.liquid"
message = "Use the CSS imageset attribute instead of data-bgset"
start = [ 0, 22 ]
highlight = "data-bgset=\"image.jpg\""

[[cases.offenses]]
file = "file.liquid"
message = "Use the native loading=\"lazy\" attribute instead of lazysizes"
start = [ 1, 12 ]
highlight = "lazyload"

[[cases.offenses]]
file = "file.liquid"
message = "Use the CSS imageset attribute instead of data-bgset"
start = [ 1, 22 ]
highlight = "data-bgset=\"image2.jpg\""

[[cases]]
name = "should not report offenses for non-deprecated attributes"

[cases.files]
"file.liquid" = '''
<div class="non-lazyload" data-non-bgset="image.jpg"></div>
<div class="non-lazyload" data-non-bgset="image2.jpg"></div>
'''
