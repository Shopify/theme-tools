check: AppBlockMissingSchema
severity: error
cases:
  - name: should report an error when schema tag is missing on a theme app extension (blocks only)
    files:
      blocks/footer.liquid: |
        <footer class="footer">
          {% for block in section.blocks %}
            {% case block.type %}
              {% when 'link' %}
                <div class="link" {{ block.shopify_attributes }}>
                  {{ block.settings.linktext | link_to: block.settings.linkurl }}
                </div>

              {% when 'custom-text' %}
                <div class="text" {{ block.shopify_attributes }}>
                  {{ block.settings.custom-text-field }}
                </div>
            {% endcase %}
          {% endfor %}
        </footer>
    offenses:
      - file: blocks/footer.liquid
        message: The schema does not exist
        start: [0, 0]
        highlight: ""
  - name: should not report an error when schema tag is missing on a snippet in a theme app extension )
    files:
      snippets/footer.liquid: |
        <footer class="footer">
          {% for block in section.blocks %}
            {% case block.type %}
              {% when 'link' %}
                <div class="link" {{ block.shopify_attributes }}>
                  {{ block.settings.linktext | link_to: block.settings.linkurl }}
                </div>

              {% when 'custom-text' %}
                <div class="text" {{ block.shopify_attributes }}>
                  {{ block.settings.custom-text-field }}
                </div>
            {% endcase %}
          {% endfor %}
        </footer>
  - name: should not report when the schema is present on a theme app extension
    files:
      blocks/footer.liquid: |-
        <footer class="footer">
          {% for block in section.blocks %}
            {% case block.type %}
              {% when 'link' %}
                <div class="link" {{ block.shopify_attributes }}>
                  {{ block.settings.linktext | link_to: block.settings.linkurl }}
                </div>

              {% when 'custom-text' %}
                <div class="text" {{ block.shopify_attributes }}>
                  {{ block.settings.custom-text-field }}
                </div>
            {% endcase %}
          {% endfor %}
        </footer>

        {% schema %}
        {
          "name": "Footer",
          "max_blocks": 8,
          "blocks": [
            {
              "type": "link",
              "name": "Link",
              "settings": [
                {
                  "id": "linkurl",
                  "type": "url",
                  "label": "URL link"
                },
                {
                  "id": "linktext",
                  "type": "text",
                  "label": "Link text"
                }
              ]
            },
            {
              "type": "custom-text",
              "name": "Custom Text",
              "settings": [
                {
                  "id": "custom-text-field",
                  "type": "textarea",
                  "label": "Text"
                }
              ]
            }
          ]
        }
        {% endschema %}
