check: JSONMissingBlock
severity: error
cases:
  - name: should report an offense when a block does not exist
    files:
      templates/product.failing.json: |-
        {
                  "sections": {
                    "custom-section": {
                      "type": "custom-section",
                      "blocks": {
                        "text_tqQTNE": {
                          "type": "missing_block"
                        }
                      },
                      "block_order": ["text_tqQTNE"]
                    }
                  },
                  "order": ["custom-section"]
                }
      sections/custom-section.liquid: |
        {% schema %}
        {
          "name": "Custom Section",
          "blocks": [
            {
              "type": "missing_block"
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: templates/product.failing.json
        message: "Theme block 'blocks/missing_block.liquid' does not exist."
        start: [6, 26]
        highlight: '"missing_block"'
  - name: should not report an offense when block exists
    files:
      templates/product.valid.json: |-
        {
                  "sections": {
                    "custom-section": {
                      "type": "custom-section",
                      "blocks": {
                        "text_block": {
                          "type": "text"
                        }
                      },
                      "block_order": ["text_block"]
                    }
                  },
                  "order": ["custom-section"]
                }
      sections/custom-section.liquid: |
        {% schema %}
        {
          "name": "Custom Section",
          "blocks": [
            {
              "type": "text"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: ""
  - name: should report an offense when a nested block does not exist
    files:
      templates/product.nested.json: |-
        {
                  "sections": {
                    "custom-section": {
                      "type": "custom-section",
                      "blocks": {
                        "parent_block": {
                          "type": "text",
                          "blocks": {
                            "child_block": {
                              "type": "missing_nested"
                            }
                          }
                        }
                      },
                      "block_order": ["parent_block"]
                    }
                  },
                  "order": ["custom-section"]
                }
      sections/custom-section.liquid: |
        {% schema %}
        {
          "name": "Custom Section",
          "blocks": [
            {
              "type": "text"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: |
        {% schema %}
          {
            "name": "Text Block",
            "blocks": [
              {
                "type": "missing_nested"
              }
            ]
          }
          {% endschema %}
    offenses:
      - file: templates/product.nested.json
        message: "Theme block 'blocks/missing_nested.liquid' does not exist."
        start: [9, 30]
        highlight: '"missing_nested"'
  - name: should report an offense when block exists but is not in the section liquid schema
    files:
      templates/product.valid.json: |-
        {
                  "sections": {
                    "custom-section": {
                      "type": "custom-section",
                      "blocks": {
                        "text_block": {
                          "type": "text"
                        }
                      },
                      "block_order": ["text_block"]
                    }
                  },
                  "order": ["custom-section"]
                }
      sections/custom-section.liquid: |
        {% schema %}
        {
          "name": "Custom Section",
          "blocks": [
            {
              "type": "image"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: ""
      blocks/image.liquid: ""
    offenses:
      - file: templates/product.valid.json
        message: "Block type 'text' is not allowed in 'sections/custom-section.liquid'."
        start: [6, 26]
        highlight: '"text"'
  - name: should report an offense when a nested block exists but is not in the block liquid schema
    files:
      templates/product.nested.json: |-
        {
                  "sections": {
                    "custom-section": {
                      "type": "custom-section",
                      "blocks": {
                        "parent_block": {
                          "type": "text",
                          "blocks": {
                            "child_block": {
                              "type": "missing_nested"
                            }
                          }
                        }
                      },
                      "block_order": ["parent_block"]
                    }
                  },
                  "order": ["custom-section"]
                }
      sections/custom-section.liquid: |
        {% schema %}
        {
          "name": "Custom Section",
          "blocks": [
            {
              "type": "text"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: |
        {% schema %}
          {
            "name": "Text Block",
            "blocks": [
              {
                "type": "image"
              }
            ]
          }
          {% endschema %}
      blocks/image.liquid: ""
      blocks/missing_nested.liquid: ""
    offenses:
      - file: templates/product.nested.json
        message: "Block type 'missing_nested' is not allowed in 'blocks/text.liquid'."
        start: [9, 30]
        highlight: '"missing_nested"'
  - name: should report an offense when a nested private block exists but is not in the block liquid schema
    files:
      templates/product.nested.json: |-
        {
                  "sections": {
                    "custom-section": {
                      "type": "custom-section",
                      "blocks": {
                        "parent_block": {
                          "type": "text",
                          "blocks": {
                            "child_block": {
                              "type": "_private_block"
                            }
                          }
                        }
                      },
                      "block_order": ["parent_block"]
                    }
                  },
                  "order": ["custom-section"]
                }
      sections/custom-section.liquid: |
        {% schema %}
        {
          "name": "Custom Section",
          "blocks": [
            {
              "type": "text"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: |
        {% schema %}
          {
            "name": "Text Block",
            "blocks": [
              {
                "type": "@theme"
              }
            ]
          }
          {% endschema %}
      blocks/image.liquid: ""
      blocks/_private_block.liquid: ""
    offenses:
      - file: templates/product.nested.json
        message: "Block type '_private_block' is not allowed in 'blocks/text.liquid'."
        start: [9, 30]
        highlight: '"_private_block"'
  - name: should not report an offense when a static block exists and is not in the block liquid schema
    files:
      templates/product.static.json: |-
        {
                  "sections": {
                    "custom-section": {
                      "type": "custom-section",
                      "blocks": {
                        "child_block": {
                          "type": "text"
                        },
                        "static_block": {
                          "type": "static_block",
                          "static": true
                        }
                      },
                      "block_order": ["child_block"]
                    }
                  },
                  "order": ["custom-section"]
                }
      sections/custom-section.liquid: |
        {% schema %}
        {
          "name": "Custom Section",
          "blocks": [
            {
              "type": "text"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: |
        {% schema %}
          {
            "name": "Text Block",
            "blocks": [
              {
                "type": "@theme"
              }
            ]
          }
          {% endschema %}
      blocks/static_block.liquid: |
        {% schema %}
          {
            "name": "Static Block",
          }
          {% endschema %}
  - name: should ignore non-template JSON files
    files:
      config/index.json: |-
        {
                  "blocks": {
                    "text_block": {
                      "type": "nonexistent"
                    }
                  }
                }
  - name: should ignore templates with local blocks
    files:
      templates/product.nested.json: |-
        {
                  "sections": {
                    "custom-section": {
                      "type": "custom-section",
                      "blocks": {
                        "parent_block": {
                          "type": "text",
                          "blocks": {
                            "child_block": {
                              "type": "_private_block"
                            }
                          }
                        }
                      },
                      "block_order": ["parent_block"]
                    }
                  },
                  "order": ["custom-section"]
                }
      sections/custom-section.liquid: |
        {% schema %}
        {
          "name": "Custom Section",
          "blocks": [
            {
              "type": "text",
              "name": "Text Block"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: |
        {% schema %}
          {
            "name": "Text Block",
            "blocks": [
              {
                "type": "image",
                "name": "Image Block"
              }
            ]
          }
          {% endschema %}
      blocks/image.liquid: ""
      blocks/_private_block.liquid: ""

  - name: allows app and named section-local blocks in a Dawn-style section
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "title": {
                  "type": "title"
                },
                "price": {
                  "type": "price"
                },
                "widget": {
                  "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "title",
              "name": "Title"
            },
            {
              "type": "price",
              "name": "Price"
            },
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
  - name: requires app permission in a Dawn-style section
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "title": {
                  "type": "title"
                },
                "price": {
                  "type": "price"
                },
                "widget": {
                  "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "title",
              "name": "Title"
            },
            {
              "type": "price",
              "name": "Price"
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: templates/product.json
        message: "Block type 'shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000' is not allowed in 'sections/main-product.liquid'."
        start: [12, 18]
        highlight: '"shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"'
  - name: still validates theme block files and permissions in an app-enabled section
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "title": {
                  "type": "title"
                },
                "price": {
                  "type": "price"
                },
                "widget": {
                  "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                },
                "missing": {
                  "type": "missing"
                },
                "text": {
                  "type": "text"
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "title",
              "name": "Title"
            },
            {
              "type": "price",
              "name": "Price"
            },
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: |
    offenses:
      - file: templates/product.json
        message: "Theme block 'blocks/missing.liquid' does not exist."
        start: [15, 18]
        highlight: '"missing"'
      - file: templates/product.json
        message: "Block type 'text' is not allowed in 'sections/main-product.liquid'."
        start: [18, 18]
        highlight: '"text"'
  - name: allows app and theme blocks in a Horizon-style section
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "widget": {
                  "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                },
                "text": {
                  "type": "text"
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            },
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: |
  - name: does not let theme permission or static bypass section app permission
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "widget": {
                  "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000",
                  "static": true
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: templates/product.json
        message: "Block type 'shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000' is not allowed in 'sections/main-product.liquid'."
        start: [6, 18]
        highlight: '"shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"'
  - name: does not let app permission allow a section theme block
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "widget": {
                  "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                },
                "text": {
                  "type": "text"
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: |
    offenses:
      - file: templates/product.json
        message: "Block type 'text' is not allowed in 'sections/main-product.liquid'."
        start: [9, 18]
        highlight: '"text"'
  - name: rejects an app in a section with no allowed blocks
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "widget": {
                  "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": []
        }
        {% endschema %}
    offenses:
      - file: templates/product.json
        message: "Block type 'shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000' is not allowed in 'sections/main-product.liquid'."
        start: [6, 18]
        highlight: '"shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"'
  - name: allows a nested app when only its immediate host allows apps
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "details": {
                  "type": "product-details",
                  "blocks": {
                    "widget": {
                      "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                    },
                    "text": {
                      "type": "text"
                    }
                  }
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            }
          ]
        }
        {% endschema %}
      blocks/product-details.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            },
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: |
  - name: does not inherit app permission from the containing section
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "details": {
                  "type": "product-details",
                  "blocks": {
                    "widget": {
                      "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                    }
                  }
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            },
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
      blocks/product-details.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: templates/product.json
        message: "Block type 'shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000' is not allowed in 'blocks/product-details.liquid'."
        start: [9, 22]
        highlight: '"shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"'
  - name: does not let app permission allow a nested theme block
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "details": {
                  "type": "product-details",
                  "blocks": {
                    "widget": {
                      "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                    },
                    "text": {
                      "type": "text"
                    }
                  }
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            }
          ]
        }
        {% endschema %}
      blocks/product-details.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
      blocks/text.liquid: |
    offenses:
      - file: templates/product.json
        message: "Block type 'text' is not allowed in 'blocks/product-details.liquid'."
        start: [12, 22]
        highlight: '"text"'
  - name: rejects a nested app when its host has no allowed blocks
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "details": {
                  "type": "product-details",
                  "blocks": {
                    "widget": {
                      "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                    }
                  }
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            }
          ]
        }
        {% endschema %}
      blocks/product-details.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": []
        }
        {% endschema %}
    offenses:
      - file: templates/product.json
        message: "Block type 'shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000' is not allowed in 'blocks/product-details.liquid'."
        start: [9, 22]
        highlight: '"shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"'
  - name: still detects a missing theme block alongside a valid nested app
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "details": {
                  "type": "product-details",
                  "blocks": {
                    "widget": {
                      "type": "shopify://apps/example/blocks/widget/00000000-0000-4000-8000-000000000000"
                    },
                    "missing": {
                      "type": "missing"
                    }
                  }
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            }
          ]
        }
        {% endschema %}
      blocks/product-details.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            },
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
    offenses:
      - file: templates/product.json
        message: "Theme block 'blocks/missing.liquid' does not exist."
        start: [12, 22]
        highlight: '"missing"'
  - name: does not treat other Shopify URIs as app blocks
    files:
      templates/product.json: |
        {
          "sections": {
            "main": {
              "type": "main-product",
              "blocks": {
                "other": {
                  "type": "shopify://other/widget"
                }
              }
            }
          },
          "order": [
            "main"
          ]
        }
      sections/main-product.liquid: |
        {% schema %}
        {
          "name": "Example",
          "blocks": [
            {
              "type": "@theme"
            },
            {
              "type": "@app"
            }
          ]
        }
        {% endschema %}
