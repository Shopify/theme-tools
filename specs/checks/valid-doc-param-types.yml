check: ValidDocParamTypes
severity: error
cases:
  - name: should not report an error when a valid basic parameter (string) type is used
    files:
      file.liquid: |
        {% doc %}
          @param {string} param1 - Example param
        {% enddoc %}
    docset: default
  - name: should not report an error when a valid basic parameter (number) type is used
    files:
      file.liquid: |
        {% doc %}
          @param {number} param1 - Example param
        {% enddoc %}
    docset: default
  - name: should not report an error when a valid basic parameter (boolean) type is used
    files:
      file.liquid: |
        {% doc %}
          @param {boolean} param1 - Example param
        {% enddoc %}
    docset: default
  - name: should not report an error when a valid basic parameter (object) type is used
    files:
      file.liquid: |
        {% doc %}
          @param {object} param1 - Example param
        {% enddoc %}
    docset: default
  - name: should not report an error when a valid liquid object parameter (product) type is used
    files:
      file.liquid: |
        {% doc %}
          @param {product} param1 - Example param
        {% enddoc %}
    docset: default
  - name: "should not report an error when a valid liquid object array parameter (product[]) type is used"
    files:
      file.liquid: |
        {% doc %}
          @param {product[]} param1 - Example param
        {% enddoc %}
    docset: default
  - name: "Module: ValidDocParamTypes > accepts the string enum {'heading' | 'small'}"
    files:
      file.liquid: |-
        {% doc %}
          @param {'heading' | 'small'} [variant] - Text style
        {% enddoc %}
    docset: default
  - name: 'accepts the string enum {"Heading"|"small"}'
    files:
      file.liquid: |-
        {% doc %}
          @param {"Heading"|"small"} [variant] - Text style
        {% enddoc %}
    docset: default
  - name: "accepts the string enum {'heading'}"
    files:
      file.liquid: |-
        {% doc %}
          @param {'heading'} [variant] - Text style
        {% enddoc %}
    docset: default
  - name: "accepts the string enum {'' | ' small '}"
    files:
      file.liquid: |-
        {% doc %}
          @param {'' | ' small '} [variant] - Text style
        {% enddoc %}
    docset: default
  - name: "accepts the string enum {'a|b' | 'a}b'}"
    files:
      file.liquid: |-
        {% doc %}
          @param {'a|b' | 'a}b'} [variant] - Text style
        {% enddoc %}
    docset: default
  - name: "accepts the string enum {\"it's\" | 'say \"hi\"'}"
    files:
      file.liquid: |-
        {% doc %}
          @param {"it's" | 'say "hi"'} [variant] - Text style
        {% enddoc %}
    docset: default
  - name: "reports the complete invalid enum {'heading' |} and preserves the optional parameter in its fix"
    files:
      file.liquid: |-
        {% doc %}
          @param   { 'heading' | }   [variant] - Text style
        {% enddoc %}
    docset: default
    offenses:
      - file: file.liquid
        message: "The parameter type ' 'heading' | ' is not supported."
        start: [1, 11]
        highlight: "{ 'heading' | }"
        suggest:
          - message: Remove invalid parameter type
            result: |-
              {% doc %}
                @param [variant] - Text style
              {% enddoc %}
  - name: "reports the complete invalid enum {| 'heading'} and preserves the optional parameter in its fix"
    files:
      file.liquid: |-
        {% doc %}
          @param   { | 'heading' }   [variant] - Text style
        {% enddoc %}
    docset: default
    offenses:
      - file: file.liquid
        message: "The parameter type ' | 'heading' ' is not supported."
        start: [1, 11]
        highlight: "{ | 'heading' }"
        suggest:
          - message: Remove invalid parameter type
            result: |-
              {% doc %}
                @param [variant] - Text style
              {% enddoc %}
  - name: "reports the complete invalid enum {'heading' || 'small'} and preserves the optional parameter in its fix"
    files:
      file.liquid: |-
        {% doc %}
          @param   { 'heading' || 'small' }   [variant] - Text style
        {% enddoc %}
    docset: default
    offenses:
      - file: file.liquid
        message: "The parameter type ' 'heading' || 'small' ' is not supported."
        start: [1, 11]
        highlight: "{ 'heading' || 'small' }"
        suggest:
          - message: Remove invalid parameter type
            result: |-
              {% doc %}
                @param [variant] - Text style
              {% enddoc %}
  - name: "reports the complete invalid enum {'heading' 'small'} and preserves the optional parameter in its fix"
    files:
      file.liquid: |-
        {% doc %}
          @param   { 'heading' 'small' }   [variant] - Text style
        {% enddoc %}
    docset: default
    offenses:
      - file: file.liquid
        message: "The parameter type ' 'heading' 'small' ' is not supported."
        start: [1, 11]
        highlight: "{ 'heading' 'small' }"
        suggest:
          - message: Remove invalid parameter type
            result: |-
              {% doc %}
                @param [variant] - Text style
              {% enddoc %}
  - name: "reports the complete invalid enum {'heading' | small} and preserves the optional parameter in its fix"
    files:
      file.liquid: |-
        {% doc %}
          @param   { 'heading' | small }   [variant] - Text style
        {% enddoc %}
    docset: default
    offenses:
      - file: file.liquid
        message: "The parameter type ' 'heading' | small ' is not supported."
        start: [1, 11]
        highlight: "{ 'heading' | small }"
        suggest:
          - message: Remove invalid parameter type
            result: |-
              {% doc %}
                @param [variant] - Text style
              {% enddoc %}
  - name: "reports the complete invalid enum {'heading' | 'small} and preserves the optional parameter in its fix"
    files:
      file.liquid: |-
        {% doc %}
          @param   { 'heading' | 'small }   [variant] - Text style
        {% enddoc %}
    docset: default
    offenses:
      - file: file.liquid
        message: "The parameter type ' 'heading' | 'small ' is not supported."
        start: [1, 11]
        highlight: "{ 'heading' | 'small }"
        suggest:
          - message: Remove invalid parameter type
            result: |-
              {% doc %}
                @param [variant] - Text style
              {% enddoc %}
  - name: "reports the complete invalid enum {'heading' | number} and preserves the optional parameter in its fix"
    files:
      file.liquid: |-
        {% doc %}
          @param   { 'heading' | number }   [variant] - Text style
        {% enddoc %}
    docset: default
    offenses:
      - file: file.liquid
        message: "The parameter type ' 'heading' | number ' is not supported."
        start: [1, 11]
        highlight: "{ 'heading' | number }"
        suggest:
          - message: Remove invalid parameter type
            result: |-
              {% doc %}
                @param [variant] - Text style
              {% enddoc %}
  - name: "reports the complete invalid enum {heading | small} and preserves the optional parameter in its fix"
    files:
      file.liquid: |-
        {% doc %}
          @param   { heading | small }   [variant] - Text style
        {% enddoc %}
    docset: default
    offenses:
      - file: file.liquid
        message: "The parameter type ' heading | small ' is not supported."
        start: [1, 11]
        highlight: "{ heading | small }"
        suggest:
          - message: Remove invalid parameter type
            result: |-
              {% doc %}
                @param [variant] - Text style
              {% enddoc %}
  - name: "reports the complete invalid enum {1 | 2} and preserves the optional parameter in its fix"
    files:
      file.liquid: |-
        {% doc %}
          @param   { 1 | 2 }   [variant] - Text style
        {% enddoc %}
    docset: default
    offenses:
      - file: file.liquid
        message: "The parameter type ' 1 | 2 ' is not supported."
        start: [1, 11]
        highlight: "{ 1 | 2 }"
        suggest:
          - message: Remove invalid parameter type
            result: |-
              {% doc %}
                @param [variant] - Text style
              {% enddoc %}
  - name: "reports the complete invalid enum {true | false} and preserves the optional parameter in its fix"
    files:
      file.liquid: |-
        {% doc %}
          @param   { true | false }   [variant] - Text style
        {% enddoc %}
    docset: default
    offenses:
      - file: file.liquid
        message: "The parameter type ' true | false ' is not supported."
        start: [1, 11]
        highlight: "{ true | false }"
        suggest:
          - message: Remove invalid parameter type
            result: |-
              {% doc %}
                @param [variant] - Text style
              {% enddoc %}
  - name: "reports the complete invalid enum {('heading' | 'small')} and preserves the optional parameter in its fix"
    files:
      file.liquid: |-
        {% doc %}
          @param   { ('heading' | 'small') }   [variant] - Text style
        {% enddoc %}
    docset: default
    offenses:
      - file: file.liquid
        message: "The parameter type ' ('heading' | 'small') ' is not supported."
        start: [1, 11]
        highlight: "{ ('heading' | 'small') }"
        suggest:
          - message: Remove invalid parameter type
            result: |-
              {% doc %}
                @param [variant] - Text style
              {% enddoc %}
  - name: "reports the complete invalid enum {'heading'[]} and preserves the optional parameter in its fix"
    files:
      file.liquid: |-
        {% doc %}
          @param   { 'heading'[] }   [variant] - Text style
        {% enddoc %}
    docset: default
    offenses:
      - file: file.liquid
        message: "The parameter type ' 'heading'[] ' is not supported."
        start: [1, 11]
        highlight: "{ 'heading'[] }"
        suggest:
          - message: Remove invalid parameter type
            result: |-
              {% doc %}
                @param [variant] - Text style
              {% enddoc %}
  - name: should report an error with suggestions when an invalid parameter type is used
    files:
      file.liquid: |
        {% doc %}
          @param {invalidType} param1 - Example param
        {% enddoc %}
    docset: default
    offenses:
      - file: file.liquid
        message: "The parameter type 'invalidType' is not supported."
        start: [1, 9]
        highlight: "{invalidType}"
        suggest:
          - message: Remove invalid parameter type
            result: |
              {% doc %}
                @param param1 - Example param
              {% enddoc %}
  - name: should apply suggestion when an invalid parameter type is used (1)
    files:
      file.liquid: "{% doc %} @param {invalidType} param1 - Example param {% enddoc %}"
    docset: default
    offenses:
      - file: file.liquid
        message: "The parameter type 'invalidType' is not supported."
        start: [0, 17]
        highlight: "{invalidType}"
        suggest:
          - message: Remove invalid parameter type
            result: "{% doc %} @param param1 - Example param {% enddoc %}"
  - name: should apply suggestion when an invalid parameter type is used (2)
    files:
      file.liquid: "{% doc %} @param   {   invalidType   }   param1 - Example param {% enddoc %}"
    docset: default
    offenses:
      - file: file.liquid
        message: "The parameter type '   invalidType   ' is not supported."
        start: [0, 19]
        highlight: "{   invalidType   }"
        suggest:
          - message: Remove invalid parameter type
            result: "{% doc %} @param param1 - Example param {% enddoc %}"
  - name: validates named types, arrays, and enums together
    files:
      file.liquid: |-
        {% doc %}
              @param {product} product
              @param {string[]} labels
              @param {'heading' | 'small'} [variant]
              @param {unknown[]} unknown
              @param {'heading' |} invalid_variant
            {% enddoc %}
    docset: default
    offenses:
      - file: file.liquid
        message: "The parameter type 'unknown[]' is not supported."
        start: [4, 13]
        highlight: "{unknown[]}"
        suggest:
          - message: Remove invalid parameter type
            result: |-
              {% doc %}
                    @param {product} product
                    @param {string[]} labels
                    @param {'heading' | 'small'} [variant]
                    @param unknown
                    @param {'heading' |} invalid_variant
                  {% enddoc %}
      - file: file.liquid
        message: "The parameter type ''heading' |' is not supported."
        start: [5, 13]
        highlight: "{'heading' |}"
        suggest:
          - message: Remove invalid parameter type
            result: |-
              {% doc %}
                    @param {product} product
                    @param {string[]} labels
                    @param {'heading' | 'small'} [variant]
                    @param {unknown[]} unknown
                    @param invalid_variant
                  {% enddoc %}
  - name: removes the invalid type without changing braces in its description
    files:
      file.liquid: |-
        {% doc %}
          @param {'heading' |} [variant] - example {foo}
        {% enddoc %}
    docset: default
    offenses:
      - file: file.liquid
        message: "The parameter type ''heading' |' is not supported."
        start: [1, 9]
        highlight: "{'heading' |}"
        suggest:
          - message: Remove invalid parameter type
            result: |-
              {% doc %}
                @param [variant] - example {foo}
              {% enddoc %}
  - name: reports invalid string literal types
    files:
      file.liquid: |-
        {% doc %}
          @param  {'heading' |}  variant
        {% enddoc %}
    offenses:
      - file: file.liquid
        message: "The parameter type ''heading' |' is not supported."
        start: [1, 10]
        highlight: "{'heading' |}"
        suggest:
          - message: Remove invalid parameter type
            result: |-
              {% doc %}
                @param variant
              {% enddoc %}
  - name: "without a docset > accepts the string enum {'heading' | 'small'}"
    files:
      file.liquid: |-
        {% doc %}
          @param {'heading' | 'small'} variant
        {% enddoc %}
  - name: 'accepts the string enum {"heading"}'
    files:
      file.liquid: |-
        {% doc %}
          @param {"heading"} variant
        {% enddoc %}
  - name: does not check the named type {product}, which requires the docset
    files:
      file.liquid: |-
        {% doc %}
          @param {product} variant
        {% enddoc %}
  - name: "does not check the named type {product[]}, which requires the docset"
    files:
      file.liquid: |-
        {% doc %}
          @param {product[]} variant
        {% enddoc %}
  - name: does not check the named type {invalidType}, which requires the docset
    files:
      file.liquid: |-
        {% doc %}
          @param {invalidType} variant
        {% enddoc %}
  - name: "does not check the named type {unknown[]}, which requires the docset"
    files:
      file.liquid: |-
        {% doc %}
          @param {unknown[]} variant
        {% enddoc %}
