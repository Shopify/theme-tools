[[cases]]
name = "counts uses in a schema visible_if expression"

[cases.files]
"blocks/logo.liquid" = '''
{% assign has_logo_image = true %}
{% schema %}
  {
    "name": "Logo",
    "settings": [
      {
        "type": "range",
        "id": "height",
        "min": 16,
        "max": 80,
        "step": 4,
        "default": 32,
        "visible_if": "{{ has_logo_image == true }}"
      }
    ]
  }
{% endschema %}
'''

[[cases]]
name = "does not count other schema strings as uses"

[cases.files]
"blocks/example.liquid" = '''
{% assign unused_var = true %}
{% schema %}
