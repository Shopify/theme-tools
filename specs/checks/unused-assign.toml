check = "UnusedAssign"
severity = "warning"

[[cases]]
name = "reports a variable that is assigned but not used"

[cases.files]
"file.liquid" = '''
{% assign unusedVar = "value" %}
{% assign usedVar = "anotherValue" %}
{{ usedVar }}
'''

[[cases.offenses]]
file = "file.liquid"
message = "The variable 'unusedVar' is assigned but not used"
start = [ 0, 0 ]
highlight = "{% assign unusedVar = \"value\" %}"

[[cases.offenses.suggest]]
message = "Remove the unused variable 'unusedVar'"
result = '''

{% assign usedVar = "anotherValue" %}
{{ usedVar }}
'''

[[cases]]
name = "does not report a variable that is assigned and used"

[cases.files]
"file.liquid" = '''
{% assign usedVar = "value" %}
{{ usedVar }}
'''

[[cases]]
name = "suggests removing the only assign in a file"

[cases.files]
"file.liquid" = '''
{% assign unusedVar = "value" %}
'''

[[cases.offenses]]
file = "file.liquid"
message = "The variable 'unusedVar' is assigned but not used"
start = [ 0, 0 ]
highlight = "{% assign unusedVar = \"value\" %}"

[[cases.offenses.suggest]]
message = "Remove the unused variable 'unusedVar'"
result = '''

'''

[[cases]]
name = "counts uses inside a capture tag"

[cases.files]
"file.liquid" = '''
{% assign usedVar = "anotherValue" %}
{% capture foo %}
  {{ usedVar }}
{% endcapture %}
{{ foo }}
'''

[[cases]]
name = "reports an unused capture"

[cases.files]
"file.liquid" = '''
{% assign usedVar = "anotherValue" %}
{% capture foo %}
  {{ usedVar }}
{% endcapture %}
'''

[[cases.offenses]]
file = "file.liquid"
message = "The variable 'foo' is assigned but not used"
start = [ 1, 0 ]
highlight = "{% capture foo %}"

[[cases.offenses.suggest]]
message = "Remove the unused variable 'foo'"
result = '''
{% assign usedVar = "anotherValue" %}

'''

