[[cases]]
name = "ignores variables that start with an underscore"

[cases.files]
"file.liquid" = '''
{% assign _ = 1 %}
{% assign _unusedVar = 1 %}
{% capture _ %}
  {% form "cart", cart %}
    {% assign some_var = cart.successfully_posted? %}
  {% endform %}
{% endcapture %}
{{ some_var }}
'''

