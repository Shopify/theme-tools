check: DuplicateBlockArguments
severity: warning
cases:
  - name: reports duplicate arguments after interface sources are merged
    files:
      templates/test.liquid: "{% block 'card', heading: 'a', heading: 'b' %}{% endblock %}"
    offenses:
      - file: templates/test.liquid
        message: "Duplicate argument 'heading' in block tag for 'card'."
        start: [0, 31]
        highlight: "heading: 'b'"
  - name: does not report unique arguments
    files:
      templates/test.liquid: "{% block 'card', heading: 'a', content: body %}{% endblock %}"
  - name: "warns that text body content takes precedence over content:"
    files:
      templates/test.liquid: "{% block 'card', content: body %}Body{% endblock %}"
    offenses:
      - file: templates/test.liquid
        message: "The explicit 'content' argument has no effect because the inline block body takes precedence."
        start: [0, 17]
        highlight: "content: body"
  - name: "warns that comment body content takes precedence over content:"
    files:
      templates/test.liquid: "{% block 'card', content: body %}{% comment %}x{% endcomment %}{% endblock %}"
    offenses:
      - file: templates/test.liquid
        message: "The explicit 'content' argument has no effect because the inline block body takes precedence."
        start: [0, 17]
        highlight: "content: body"
  - name: "does not let a whitespace-only body override content:"
    files:
      templates/test.liquid: |-
        {% block 'card', content: body %}
          	
        {% endblock %}
  - name: "preserves the duplicate warning when body content also overrides content:"
    files:
      templates/test.liquid: "{% block 'card', content: first, content: second %}Body{% endblock %}"
    offenses:
      - file: templates/test.liquid
        message: "The explicit 'content' argument has no effect because the inline block body takes precedence."
        start: [0, 17]
        highlight: "content: first"
      - file: templates/test.liquid
        message: "Duplicate argument 'content' in block tag for 'card'."
        start: [0, 33]
        highlight: "content: second"
      - file: templates/test.liquid
        message: "The explicit 'content' argument has no effect because the inline block body takes precedence."
        start: [0, 33]
        highlight: "content: second"
  - name: reports duplicates without resolving the target block
    files:
      templates/test.liquid: "{% block 'missing', value: 'a', value: 'b' %}{% endblock %}"
    offenses:
      - file: templates/test.liquid
        message: "Duplicate argument 'value' in block tag for 'missing'."
        start: [0, 32]
        highlight: "value: 'b'"
