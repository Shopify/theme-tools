check = "UniqueStaticBlockId"
severity = "error"

[[cases]]
name = "should report an error when two static blocks have the same id"

[cases.files]
"file.liquid" = '''
{% content_for "block", type: "text", id: "static-block" %}
{% content_for "block", type: "text", id: "static-block" %}
'''

[[cases.offenses]]
file = "file.liquid"
message = "The id 'static-block' is already being used by another static block"
start = [ 1, 42 ]
highlight = "\"static-block\""
suggest = []

[[cases]]
name = "should not report an error when two static blocks have different id"

[cases.files]
"file.liquid" = '''
{% content_for "block", type: "text", id: "static-block1" %}
{% content_for "block", type: "text", id: "static-block2" %}
'''

[[cases]]
name = "should report an error when two static blocks have same id and different types"

[cases.files]
"file.liquid" = '''
{% content_for "block", type: "text", id: "static-block" %}
{% content_for "block", type: "url", id: "static-block" %}
'''

[[cases.offenses]]
file = "file.liquid"
message = "The id 'static-block' is already being used by another static block"
start = [ 1, 41 ]
highlight = "\"static-block\""
suggest = []

[[cases]]
name = "should not report an error when two static blocks have different id and different types"

[cases.files]
"file.liquid" = '''
{% content_for "block", type: "text", id: "static-block1" %}
{% content_for "block", type: "url", id: "static-block2" %}
'''

[[cases]]
name = "should not report an error when blocks share the same id but have different arbitrary params"

[cases.files]
"file.liquid" = '''
{% content_for "block", type: "text", id: "header-menu", variant: "mobile" %}
{% content_for "block", type: "text", id: "header-menu", variant: "navigation_bar" %}
{% content_for "block", type: "text", id: "header-menu" %}
'''

[[cases]]
name = "should report an error when blocks share the same id and same arbitrary params"

[cases.files]
"file.liquid" = '''
{% content_for "block", type: "text", id: "header-menu", variant: "mobile" %}
{% content_for "block", type: "text", id: "header-menu", variant: "mobile" %}
'''

[[cases.offenses]]
file = "file.liquid"
message = "The id 'header-menu' is already being used by another static block"
start = [ 1, 42 ]
highlight = "\"header-menu\""
suggest = []

[[cases]]
name = "should not report an error when blocks share the same id but have different values for the same param"

[cases.files]
"file.liquid" = '''
{% content_for "block", type: "text", id: "sidebar", color: "blue" %}
{% content_for "block", type: "text", id: "sidebar", color: "red" %}
'''

[[cases]]
name = "should report an error when blocks share the same id and multiple matching params"

[cases.files]
"file.liquid" = '''
{% content_for "block", type: "text", id: "sidebar", color: "blue", size: "large" %}
{% content_for "block", type: "text", id: "sidebar", color: "blue", size: "large" %}
'''

[[cases.offenses]]
file = "file.liquid"
message = "The id 'sidebar' is already being used by another static block"
start = [ 1, 42 ]
highlight = "\"sidebar\""
suggest = []

[[cases]]
name = "should report an error when blocks have same params in different order"

[cases.files]
"file.liquid" = '''
{% content_for "block", type: "text", id: "sidebar", color: "blue", size: "large" %}
{% content_for "block", type: "text", id: "sidebar", size: "large", color: "blue" %}
'''

[[cases.offenses]]
file = "file.liquid"
message = "The id 'sidebar' is already being used by another static block"
start = [ 1, 42 ]
highlight = "\"sidebar\""
suggest = []

[[cases]]
name = "should not report an error when any arbitrary param is a variable lookup"

[cases.files]
"file.liquid" = '''
{% content_for "block", type: "text", id: "header-menu", variant: "mobile" %}
{% content_for "block", type: "text", id: "header-menu", variant: some_variable %}
'''

[[cases]]
name = "should not report an error when two blocks use the same variable lookup"

[cases.files]
"file.liquid" = '''
{% content_for "block", type: "text", id: "header-menu", variant: some_variable %}
{% content_for "block", type: "text", id: "header-menu", variant: some_variable %}
'''
