check: MissingRenderSnippetArguments
severity: warning
cases:
  - name: should report missing required arguments
    files:
      snippets/card.liquid: |
        {% doc %}
          @param {string} required_string - A required string
          @param {number} required_number - A required number
          @param {boolean} required_boolean - A required boolean
          @param {object} required_object - A required object
          @param {string} [optional_string] - An optional string
          @param {number} [optional_number] - An optional number
          @param {object} [optional_object] - An optional object
          @param {boolean} [optional_boolean] - An optional boolean
        {% enddoc %}
      file.liquid: "{% render 'card' %}"
    offenses:
      - file: file.liquid
        message: "Missing required argument 'required_string' in render tag for snippet 'card'."
        start: [0, 10]
        highlight: "'card' "
        suggest:
          - message: "Add required argument 'required_string'"
            result: "{% render 'card', required_string: '' %}"
      - file: file.liquid
        message: "Missing required argument 'required_number' in render tag for snippet 'card'."
        start: [0, 10]
        highlight: "'card' "
        suggest:
          - message: "Add required argument 'required_number'"
            result: "{% render 'card', required_number: 0 %}"
      - file: file.liquid
        message: "Missing required argument 'required_boolean' in render tag for snippet 'card'."
        start: [0, 10]
        highlight: "'card' "
        suggest:
          - message: "Add required argument 'required_boolean'"
            result: "{% render 'card', required_boolean: false %}"
      - file: file.liquid
        message: "Missing required argument 'required_object' in render tag for snippet 'card'."
        start: [0, 10]
        highlight: "'card' "
        suggest:
          - message: "Add required argument 'required_object'"
            result: "{% render 'card', required_object:  %}"
  - name: should suggest adding missing required arguments when none already exist
    files:
      snippets/card.liquid: |
        {% doc %}
          @param {string} required_string - A required string
          @param {number} required_number - A required number
          @param {boolean} required_boolean - A required boolean
          @param {object} required_object - A required object
          @param {string} [optional_string] - An optional string
          @param {number} [optional_number] - An optional number
          @param {object} [optional_object] - An optional object
          @param {boolean} [optional_boolean] - An optional boolean
        {% enddoc %}
      file.liquid: "{% render 'card' %}"
    offenses:
      - file: file.liquid
        message: "Missing required argument 'required_string' in render tag for snippet 'card'."
        start: [0, 10]
        highlight: "'card' "
        suggest:
          - message: "Add required argument 'required_string'"
            result: "{% render 'card', required_string: '' %}"
      - file: file.liquid
        message: "Missing required argument 'required_number' in render tag for snippet 'card'."
        start: [0, 10]
        highlight: "'card' "
        suggest:
          - message: "Add required argument 'required_number'"
            result: "{% render 'card', required_number: 0 %}"
      - file: file.liquid
        message: "Missing required argument 'required_boolean' in render tag for snippet 'card'."
        start: [0, 10]
        highlight: "'card' "
        suggest:
          - message: "Add required argument 'required_boolean'"
            result: "{% render 'card', required_boolean: false %}"
      - file: file.liquid
        message: "Missing required argument 'required_object' in render tag for snippet 'card'."
        start: [0, 10]
        highlight: "'card' "
        suggest:
          - message: "Add required argument 'required_object'"
            result: "{% render 'card', required_object:  %}"
  - name: should suggest adding missing argument after provided alias variable (1)
    files:
      snippets/card.liquid: |
        {% doc %}
          @param {string} title - The title of the card
          @param {string} description - The description of the card
        {% enddoc %}
        <div>{{ title }}</div>
        <div>{{ description }}</div>
      file.liquid: "{% render 'card' with 'my-card' as title %}"
    offenses:
      - file: file.liquid
        message: "Missing required argument 'description' in render tag for snippet 'card'."
        start: [0, 10]
        highlight: "'card' with 'my-card' as title "
        suggest:
          - message: "Add required argument 'description'"
            result: "{% render 'card' with 'my-card' as title, description: '' %}"
  - name: should suggest adding missing argument after provided alias variable (2)
    files:
      snippets/card.liquid: |
        {% doc %}
          @param {string} title - The title of the card
          @param {string} description - The description of the card
        {% enddoc %}
        <div>{{ title }}</div>
        <div>{{ description }}</div>
      file.liquid: "{% render 'card' for titles as title %}"
    offenses:
      - file: file.liquid
        message: "Missing required argument 'description' in render tag for snippet 'card'."
        start: [0, 10]
        highlight: "'card' for titles as title "
        suggest:
          - message: "Add required argument 'description'"
            result: "{% render 'card' for titles as title, description: '' %}"
  - name: should handle mixed case type annotations
    files:
      snippets/card.liquid: |
        {% doc %}
          @param {String} text - The text
          @param {NUMBER} count - The count
          @param {BOOLEAN} flag - The flag
          @param {Object} data - The data
        {% enddoc %}
        <div>{{ text }}{{ count }}{{ flag }}{{ data }}</div>
      file.liquid: "{% render 'card', text: \"hello\", count: 5, flag: true, data: product %}"
  - name: should not report when snippet has no doc comment
    files:
      snippets/card.liquid: "<h1>This snippet has no doc comment</h1>"
      file.liquid: "{% render 'card', title: 'My Card' %}"
  - name: should not report when LiquidDoc definition has no defined params
    files:
      snippets/card.liquid: |
        {% doc %}
          @description this is a description
          @example this is an example
        {% enddoc %}
        <div>{{ title }}</div>
        <div>{{ description }}</div>
      file.liquid: "{% render 'card', title: 'My Card' %}"
  - name: should not report when snippet name is a VariableLookup
    files:
      snippets/card.liquid: |
        {% doc %}
          @param {string} title - The title of the card
          @param {string} description - The description of the card
        {% enddoc %}
        <div>{{ title }}</div>
        <div>{{ description }}</div>
      file.liquid: "{% assign snippet_name = 'card' %}{% render snippet_name, title: 'My Card' %}"
  - name: 'should report when "with/for" alias syntax is used (1)'
    files:
      snippets/card.liquid: |
        {% doc %}
          @param {string} title - The title of the card
        {% enddoc %}
        <div>{{ title }}</div>  
      file.liquid: "{% render 'card' with 'my-card' as unknown %}"
    offenses:
      - file: file.liquid
        message: "Missing required argument 'title' in render tag for snippet 'card'."
        start: [0, 10]
        highlight: "'card' with 'my-card' as unknown "
        suggest:
          - message: "Add required argument 'title'"
            result: "{% render 'card' with 'my-card' as unknown, title: '' %}"
  - name: 'should report when "with/for" alias syntax is used (2)'
    files:
      snippets/card.liquid: |
        {% doc %}
          @param {string} title - The title of the card
        {% enddoc %}
        <div>{{ title }}</div>  
      file.liquid: "{% render 'card' for array as unknown %}"
    offenses:
      - file: file.liquid
        message: "Missing required argument 'title' in render tag for snippet 'card'."
        start: [0, 10]
        highlight: "'card' for array as unknown "
        suggest:
          - message: "Add required argument 'title'"
            result: "{% render 'card' for array as unknown, title: '' %}"
