        heading: "Hello",
        quoted_keyword: 'empty',
        count: -1,
        ratio: 1.5,
        enabled: true,
        disabled: false,
        empty_items: [],
        items: ['x', 2, true, false,],
        title: '{{ closest.product.title }}'
      %}{% endblock %}
    parse: [html, liquid]
    ast:
      type: Document
      name: "#document"
      position:
        start: [0, 0]
        text: |-
          {% block 'shopify://apps/example_app/blocks/example-block/00000000-0000-4000-8000-000000000000',
            heading: "Hello",
