cases:
  - name: should transform a basic Liquid Tag into a LiquidTag
    source: "{% name %}{% if -%}{%- endif %}"
    parse: [html, liquid]
    ast:
      type: Document
      name: "#document"
      position: { start: [0, 0], text: "{% name %}{% if -%}{%- endif %}" }
      children:
        - type: LiquidTag
          name: name
          markup: ""
          whitespaceStart: ""
          whitespaceEnd: ""
          blockStartPosition: { start: [0, 0], text: "{% name %}" }
          markupPosition: { start: [0, 8], text: "" }
          position: { start: [0, 0], text: "{% name %}" }
        - type: LiquidTag
          name: if
          markup: ""
          whitespaceStart: ""
          whitespaceEnd: "-"
          delimiterWhitespaceStart: "-"
          delimiterWhitespaceEnd: ""
          blockStartPosition: { start: [0, 10], text: "{% if -%}" }
          blockEndPosition: { start: [0, 19], text: "{%- endif %}" }
          markupPosition: { start: [0, 16], text: "" }
          position: { start: [0, 10], text: "{% if -%}{%- endif %}" }
          reason: Expected expression but found EndOfString ()
          children:
            - type: LiquidBranch
              name: null
              markup: ""
              whitespaceStart: ""
              whitespaceEnd: ""
              markupPosition: { start: [0, 19], text: "" }
              blockStartPosition: { start: [0, 19], text: "" }
              blockEndPosition: { start: [0, 19], text: "" }
              position: { start: [0, 19], text: "" }
              children: []
