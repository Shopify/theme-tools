          markupPosition: { start: [0, 8], text: '"hi" ' }
          position: { start: [0, 0], text: '{% echo "hi" -%}' }
          markup:
            type: LiquidVariable
            rawSource: '"hi"'
            position: { start: [0, 8], text: '"hi" ' }
