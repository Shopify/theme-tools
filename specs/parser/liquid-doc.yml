cases:
  - name: should preserve string enum doc types in Liquid and HTML documents
    source: |-
      {% doc %}
        @param {'Heading' | 'a|b' | '}' | ''} [variant] - Shared text style
      {% enddoc %}
    parse: [html, liquid]
    ast:
      type: Document
      name: "#document"
      position:
        start: [0, 0]
        text: |-
          {% doc %}
            @param {'Heading' | 'a|b' | '}' | ''} [variant] - Shared text style
          {% enddoc %}
      children:
        - type: LiquidRawTag
          name: doc
          markup: ""
          markupPosition: { start: [0, 7], text: "" }
          whitespaceStart: ""
          whitespaceEnd: ""
          delimiterWhitespaceStart: ""
          delimiterWhitespaceEnd: ""
          blockStartPosition: { start: [0, 0], text: "{% doc %}" }
          blockEndPosition: { start: [2, 0], text: "{% enddoc %}" }
          position:
            start: [0, 0]
            text: |-
              {% doc %}
                @param {'Heading' | 'a|b' | '}' | ''} [variant] - Shared text style
              {% enddoc %}
          body:
            type: RawMarkup
            kind: text
            value: |2
              
                @param {'Heading' | 'a|b' | '}' | ''} [variant] - Shared text style
            position:
              start: [0, 9]
              text: |2
                
                  @param {'Heading' | 'a|b' | '}' | ''} [variant] - Shared text style
            nodes:
              - type: LiquidDocParamNode
                name: param
                required: false
                position: { start: [1, 2], text: "@param {'Heading' | 'a|b' | '}' | ''} [variant] - Shared text style" }
                paramName:
                  type: TextNode
                  value: variant
                  position: { start: [1, 41], text: variant }
                paramType:
                  type: TextNode
                  value: "'Heading' | 'a|b' | '}' | ''"
                  position: { start: [1, 10], text: "'Heading' | 'a|b' | '}' | ''" }
                paramDescription:
                  type: TextNode
                  value: Shared text style
                  position: { start: [1, 52], text: Shared text style }
  - name: should parse doc tags (1)
    source: "{% doc %}{% enddoc %}"
    parse: [liquid]
    ast:
      type: Document
      name: "#document"
      position: { start: [0, 0], text: "{% doc %}{% enddoc %}" }
      children:
        - type: LiquidRawTag
          name: doc
          markup: ""
          markupPosition: { start: [0, 7], text: "" }
          whitespaceStart: ""
          whitespaceEnd: ""
          delimiterWhitespaceStart: ""
          delimiterWhitespaceEnd: ""
          blockStartPosition: { start: [0, 0], text: "{% doc %}" }
          blockEndPosition: { start: [0, 9], text: "{% enddoc %}" }
          position: { start: [0, 0], text: "{% doc %}{% enddoc %}" }
          body:
            type: RawMarkup
            kind: text
            value: ""
            position: { start: [0, 9], text: "" }
            nodes: []
  - name: should parse doc tags (2)
    source: "

      \        {% doc -%}

      \        @param requiredParamWithNoType

      \        @param {String} paramWithDescription - param with description and `punctation`. This is still a valid param description.

      \        @param {String} paramWithNoDescription

      \        @param {String} [optionalParameterWithTypeAndDescription] - optional parameter with type and description

      \        @param [optionalParameterWithDescription] - optional parameter description

      \        @param {String} [optionalParameterWithType]

      \        @unsupported this node falls back to a text node

      \        {%- enddoc %}

      \      "
    parse: [liquid]
    ast:
      type: Document
      name: "#document"
      position:
        start: [0, 0]
        text: "

          \        {% doc -%}

          \        @param requiredParamWithNoType

          \        @param {String} paramWithDescription - param with description and `punctation`. This is still a valid param description.

          \        @param {String} paramWithNoDescription

          \        @param {String} [optionalParameterWithTypeAndDescription] - optional parameter with type and description

          \        @param [optionalParameterWithDescription] - optional parameter description

          \        @param {String} [optionalParameterWithType]

          \        @unsupported this node falls back to a text node

          \        {%- enddoc %}

          \      "
      children:
        - type: LiquidRawTag
          name: doc
          markup: ""
          markupPosition: { start: [1, 15], text: "" }
          whitespaceStart: ""
          whitespaceEnd: "-"
          delimiterWhitespaceStart: "-"
          delimiterWhitespaceEnd: ""
          blockStartPosition: { start: [1, 8], text: "{% doc -%}" }
          blockEndPosition: { start: [9, 8], text: "{%- enddoc %}" }
          position:
            start: [1, 8]
            text: |-
              {% doc -%}
                      @param requiredParamWithNoType
                      @param {String} paramWithDescription - param with description and `punctation`. This is still a valid param description.
                      @param {String} paramWithNoDescription
                      @param {String} [optionalParameterWithTypeAndDescription] - optional parameter with type and description
                      @param [optionalParameterWithDescription] - optional parameter description
                      @param {String} [optionalParameterWithType]
                      @unsupported this node falls back to a text node
                      {%- enddoc %}
          body:
            type: RawMarkup
            kind: text
            value: "

              \        @param requiredParamWithNoType

              \        @param {String} paramWithDescription - param with description and `punctation`. This is still a valid param description.

              \        @param {String} paramWithNoDescription

              \        @param {String} [optionalParameterWithTypeAndDescription] - optional parameter with type and description

              \        @param [optionalParameterWithDescription] - optional parameter description

              \        @param {String} [optionalParameterWithType]

              \        @unsupported this node falls back to a text node

              \        "
            position:
              start: [1, 18]
              text: "

                \        @param requiredParamWithNoType

                \        @param {String} paramWithDescription - param with description and `punctation`. This is still a valid param description.

                \        @param {String} paramWithNoDescription

                \        @param {String} [optionalParameterWithTypeAndDescription] - optional parameter with type and description

                \        @param [optionalParameterWithDescription] - optional parameter description

                \        @param {String} [optionalParameterWithType]

                \        @unsupported this node falls back to a text node

                \        "
            nodes:
              - type: LiquidDocParamNode
                name: param
                paramType: null
                paramDescription: null
                required: true
                position: { start: [2, 8], text: "@param requiredParamWithNoType" }
                paramName:
                  type: TextNode
                  value: requiredParamWithNoType
                  position: { start: [2, 15], text: requiredParamWithNoType }
              - type: LiquidDocParamNode
                name: param
                required: true
                position: { start: [3, 8], text: "@param {String} paramWithDescription - param with description and `punctation`. This is still a valid param description." }
                paramName:
                  type: TextNode
                  value: paramWithDescription
                  position: { start: [3, 24], text: paramWithDescription }
                paramType:
                  type: TextNode
                  value: String
                  position: { start: [3, 16], text: String }
                paramDescription:
                  type: TextNode
                  value: param with description and `punctation`. This is still a valid param description.
                  position: { start: [3, 47], text: param with description and `punctation`. This is still a valid param description. }
              - type: LiquidDocParamNode
                name: param
                paramDescription: null
                required: true
                position: { start: [4, 8], text: "@param {String} paramWithNoDescription" }
                paramName:
                  type: TextNode
                  value: paramWithNoDescription
                  position: { start: [4, 24], text: paramWithNoDescription }
                paramType:
                  type: TextNode
                  value: String
                  position: { start: [4, 16], text: String }
              - type: LiquidDocParamNode
                name: param
                required: false
                position: { start: [5, 8], text: "@param {String} [optionalParameterWithTypeAndDescription] - optional parameter with type and description" }
                paramName:
                  type: TextNode
                  value: optionalParameterWithTypeAndDescription
                  position: { start: [5, 25], text: optionalParameterWithTypeAndDescription }
                paramType:
                  type: TextNode
                  value: String
                  position: { start: [5, 16], text: String }
                paramDescription:
                  type: TextNode
                  value: optional parameter with type and description
                  position: { start: [5, 68], text: optional parameter with type and description }
              - type: LiquidDocParamNode
                name: param
                paramType: null
                required: false
                position: { start: [6, 8], text: "@param [optionalParameterWithDescription] - optional parameter description" }
                paramName:
                  type: TextNode
                  value: optionalParameterWithDescription
                  position: { start: [6, 16], text: optionalParameterWithDescription }
                paramDescription:
                  type: TextNode
                  value: optional parameter description
                  position: { start: [6, 52], text: optional parameter description }
              - type: LiquidDocParamNode
                name: param
                paramDescription: null
                required: false
                position: { start: [7, 8], text: "@param {String} [optionalParameterWithType]" }
                paramName:
                  type: TextNode
                  value: optionalParameterWithType
                  position: { start: [7, 25], text: optionalParameterWithType }
                paramType:
                  type: TextNode
                  value: String
                  position: { start: [7, 16], text: String }
              - type: TextNode
                value: "@unsupported this node falls back to a text node"
                position: { start: [8, 8], text: "@unsupported this node falls back to a text node" }
  - name: should parse doc tags (3)
    source: "

      \        {% doc -%}

      \        @example simple inline example

      \        {%- enddoc %}

      \      "
    parse: [liquid]
    ast:
      type: Document
      name: "#document"
      position:
        start: [0, 0]
        text: "

          \        {% doc -%}

          \        @example simple inline example

          \        {%- enddoc %}

          \      "
      children:
        - type: LiquidRawTag
          name: doc
          markup: ""
          markupPosition: { start: [1, 15], text: "" }
          whitespaceStart: ""
          whitespaceEnd: "-"
          delimiterWhitespaceStart: "-"
          delimiterWhitespaceEnd: ""
          blockStartPosition: { start: [1, 8], text: "{% doc -%}" }
          blockEndPosition: { start: [3, 8], text: "{%- enddoc %}" }
          position:
            start: [1, 8]
            text: |-
              {% doc -%}
                      @example simple inline example
                      {%- enddoc %}
          body:
            type: RawMarkup
            kind: text
            value: "

              \        @example simple inline example

              \        "
            position:
              start: [1, 18]
              text: "

                \        @example simple inline example

                \        "
            nodes:
              - type: LiquidDocExampleNode
                name: example
                isInline: true
                position: { start: [2, 8], text: "@example simple inline example" }
                content:
                  type: TextNode
                  value: simple inline example
                  position: { start: [2, 17], text: simple inline example }
