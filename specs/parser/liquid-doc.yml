                isInline: true
                position:
                  start: [2, 8]
                  text: "@example including inline code

                    \        This is a valid example

                    \        It can have multiple lines

                    \        "
                content:
                  type: TextNode
                  value: |
                    including inline code
                            This is a valid example
                            It can have multiple lines
                  position:
                    start: [2, 17]
                    text: "including inline code

                      \        This is a valid example

                      \        It can have multiple lines

                      \        "
