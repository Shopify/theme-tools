  - name: should parse block tag with Liquid children
    source: "{% capture x %}{{ y }}{% endcapture %}"
    parse: [html]
    ast:
      type: Document
      name: "#document"
      position: { start: [0, 0], text: "{% capture x %}{{ y }}{% endcapture %}" }
