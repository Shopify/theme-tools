cases:
  - name: should parse {% capture x %}hello{% endcapture %}
    source: "{% capture x %}hello{% endcapture %}"
    parse: [html, liquid]
    ast:
      type: Document
      name: "#document"
      position: { start: [0, 0], text: "{% capture x %}hello{% endcapture %}" }
      children:
        - type: LiquidTag
          name: capture
          whitespaceStart: ""
          whitespaceEnd: ""
          delimiterWhitespaceStart: ""
          delimiterWhitespaceEnd: ""
          blockStartPosition: { start: [0, 0], text: "{% capture x %}" }
          blockEndPosition: { start: [0, 20], text: "{% endcapture %}" }
          markupPosition: { start: [0, 11], text: "x " }
          position: { start: [0, 0], text: "{% capture x %}hello{% endcapture %}" }
          markup:
            type: VariableLookup
            name: x
            position: { start: [0, 11], text: x }
            lookups: []
            lookupModes: []
          children:
            - type: TextNode
              value: hello
              position: { start: [0, 15], text: hello }
  - name: should parse {% ifchanged %}content{% endifchanged %}
    source: "{% ifchanged %}content{% endifchanged %}"
    parse: [html]
    ast:
      type: Document
      name: "#document"
      position: { start: [0, 0], text: "{% ifchanged %}content{% endifchanged %}" }
      children:
