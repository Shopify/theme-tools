          whitespaceStart: ""
          whitespaceEnd: ""
          delimiterWhitespaceStart: ""
          delimiterWhitespaceEnd: ""
          blockStartPosition: { start: [0, 0], text: "{% ifchanged %}" }
          blockEndPosition: { start: [0, 22], text: "{% endifchanged %}" }
          markupPosition: { start: [0, 13], text: "" }
          position: { start: [0, 0], text: "{% ifchanged %}content{% endifchanged %}" }
          children:
            - type: TextNode
              value: content
              position: { start: [0, 15], text: content }
