cases:
  - name: should parse HTML attributes
    source: <img src="https://1234" loading='lazy' disabled checked="">
    parse: [html]
    ast:
      type: Document
      name: "#document"
      position: { start: [0, 0], text: <img src="https://1234" loading='lazy' disabled checked=""> }
      children:
        - type: HtmlVoidElement
          name: img
          blockStartPosition: { start: [0, 0], text: <img src="https://1234" loading='lazy' disabled checked=""> }
          position: { start: [0, 0], text: <img src="https://1234" loading='lazy' disabled checked=""> }
          attributes:
            - type: AttrDoubleQuoted
              attributePosition: { start: [0, 10], text: https://1234 }
              position: { start: [0, 5], text: src="https://1234" }
              name:
                - type: TextNode
                  value: src
                  position: { start: [0, 5], text: src }
              value:
                - type: TextNode
                  value: https://1234
                  position: { start: [0, 10], text: https://1234 }
            - type: AttrSingleQuoted
              attributePosition: { start: [0, 33], text: lazy }
              position: { start: [0, 24], text: loading='lazy' }
              name:
                - type: TextNode
                  value: loading
                  position: { start: [0, 24], text: loading }
              value:
                - type: TextNode
                  value: lazy
                  position: { start: [0, 33], text: lazy }
            - type: AttrEmpty
              position: { start: [0, 39], text: disabled }
              name:
                - type: TextNode
                  value: disabled
                  position: { start: [0, 39], text: disabled }
            - type: AttrDoubleQuoted
              attributePosition: { start: [0, 57], text: "" }
              position: { start: [0, 48], text: checked="" }
              name:
                - type: TextNode
                  value: checked
                  position: { start: [0, 48], text: checked }
              value: []
  - name: should parse HTML attributes inside tags
    source: <img {% if cond %}src="https://1234" loading='lazy'{% else %}disabled{% endif %}>
    parse: [html]
    ast:
      type: Document
      name: "#document"
      position: { start: [0, 0], text: "<img {% if cond %}src=\"https://1234\" loading='lazy'{% else %}disabled{% endif %}>" }
      children:
        - type: HtmlVoidElement
          name: img
          blockStartPosition: { start: [0, 0], text: "<img {% if cond %}src=\"https://1234\" loading='lazy'{% else %}disabled{% endif %}>" }
          position: { start: [0, 0], text: "<img {% if cond %}src=\"https://1234\" loading='lazy'{% else %}disabled{% endif %}>" }
          attributes:
            - type: LiquidTag
              name: if
              whitespaceStart: ""
              whitespaceEnd: ""
              delimiterWhitespaceStart: ""
              delimiterWhitespaceEnd: ""
              blockStartPosition: { start: [0, 5], text: "{% if cond %}" }
              blockEndPosition: { start: [0, 69], text: "{% endif %}" }
              markupPosition: { start: [0, 11], text: "cond " }
              position: { start: [0, 5], text: "{% if cond %}src=\"https://1234\" loading='lazy'{% else %}disabled{% endif %}" }
              markup:
                type: VariableLookup
                name: cond
                position: { start: [0, 11], text: cond }
                lookups: []
                lookupModes: []
              children:
                - type: LiquidBranch
                  name: null
                  markup: ""
                  whitespaceStart: ""
                  whitespaceEnd: ""
                  markupPosition: { start: [0, 18], text: "" }
                  blockStartPosition: { start: [0, 18], text: "" }
                  blockEndPosition: { start: [0, 51], text: "" }
                  position: { start: [0, 18], text: src="https://1234" loading='lazy' }
                  children:
                    - type: AttrDoubleQuoted
                      attributePosition: { start: [0, 23], text: https://1234 }
                      position: { start: [0, 18], text: src="https://1234" }
                      name:
                        - type: TextNode
                          value: src
                          position: { start: [0, 18], text: src }
                      value:
                        - type: TextNode
                          value: https://1234
                          position: { start: [0, 23], text: https://1234 }
                    - type: AttrSingleQuoted
                      attributePosition: { start: [0, 46], text: lazy }
                      position: { start: [0, 37], text: loading='lazy' }
                      name:
                        - type: TextNode
                          value: loading
                          position: { start: [0, 37], text: loading }
                      value:
                        - type: TextNode
                          value: lazy
                          position: { start: [0, 46], text: lazy }
                - type: LiquidBranch
                  name: else
                  markup: ""
                  whitespaceStart: ""
                  whitespaceEnd: ""
                  markupPosition: { start: [0, 59], text: "" }
                  blockStartPosition: { start: [0, 51], text: "{% else %}" }
                  blockEndPosition: { start: [0, 69], text: "" }
                  position: { start: [0, 51], text: "{% else %}disabled" }
                  children:
                    - type: AttrEmpty
                      position: { start: [0, 61], text: disabled }
                      name:
                        - type: TextNode
                          value: disabled
                          position: { start: [0, 61], text: disabled }
  - name: should preserve whitespace in LiquidBranch children inside attribute values
    source: <div class="base{% if x %} extra-class{% endif %}"></div>
    parse: [html]
    ast:
      type: Document
      name: "#document"
      position: { start: [0, 0], text: '<div class="base{% if x %} extra-class{% endif %}"></div>' }
      children:
        - type: HtmlElement
          blockStartPosition: { start: [0, 0], text: '<div class="base{% if x %} extra-class{% endif %}">' }
          blockEndPosition: { start: [0, 51], text: </div> }
          position: { start: [0, 0], text: '<div class="base{% if x %} extra-class{% endif %}"></div>' }
          name:
            - type: TextNode
              value: div
              position: { start: [0, 1], text: div }
          attributes:
            - type: AttrDoubleQuoted
              attributePosition: { start: [0, 12], text: "base{% if x %} extra-class{% endif %}" }
              position: { start: [0, 5], text: 'class="base{% if x %} extra-class{% endif %}"' }
              name:
                - type: TextNode
                  value: class
                  position: { start: [0, 5], text: class }
              value:
                - type: TextNode
                  value: base
                  position: { start: [0, 12], text: base }
                - type: LiquidTag
                  name: if
                  whitespaceStart: ""
                  whitespaceEnd: ""
                  delimiterWhitespaceStart: ""
                  delimiterWhitespaceEnd: ""
                  blockStartPosition: { start: [0, 16], text: "{% if x %}" }
                  blockEndPosition: { start: [0, 38], text: "{% endif %}" }
                  markupPosition: { start: [0, 22], text: "x " }
                  position: { start: [0, 16], text: "{% if x %} extra-class{% endif %}" }
                  markup:
                    type: VariableLookup
                    name: x
                    position: { start: [0, 22], text: x }
                    lookups: []
                    lookupModes: []
                  children:
                    - type: LiquidBranch
                      name: null
                      markup: ""
                      whitespaceStart: ""
                      whitespaceEnd: ""
                      markupPosition: { start: [0, 26], text: "" }
                      blockStartPosition: { start: [0, 26], text: "" }
                      blockEndPosition: { start: [0, 38], text: "" }
                      position: { start: [0, 26], text: " extra-class" }
                      children:
                        - type: TextNode
                          value: " extra-class"
                          position: { start: [0, 26], text: " extra-class" }
          children: []
