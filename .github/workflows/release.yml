name: Release Workflow

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  npm_config_registry: "https://registry.npmjs.org"

jobs:
  publish-packages:
    runs-on: ubuntu-latest
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install the packages
        run: pnpm install --frozen-lockfile

      - name: Build the code
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Grab date as YYYY-MM-DD
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Query VS Code Marketplace version
        id: marketplace-version
        run: echo "version=$(pnpm --dir packages/vscode-extension exec vsce show --json Shopify.theme-check-vscode | jq -r .versions[0].version)" >> $GITHUB_OUTPUT

      - name: Query VS Code Package version (Before running changeset version)
        id: package-version
        run: echo "version=$(jq -r .version packages/vscode-extension/package.json)" >> $GITHUB_OUTPUT

      - name: Test OIDC Token
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm" | jq -r '.value')
          [ -n "$TOKEN" ] && echo "✅ OIDC working" || exit 1

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # Put date in the title and commit message
          title: "Theme Tools Release — ${{ steps.date.outputs.date }}"
          commit: "Theme Tools Release — ${{ steps.date.outputs.date }}"
          # When there are no changesets, this gets called
          publish: pnpm changeset publish
          # When there are changesets, this gets called and then a PR is opened/updated
          version: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Clear GitHub credentials before marketplace publish
        run: rm -f "$HOME/.netrc"

      - name: VS Code Marketplace publish
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.marketplace-version.outputs.version != steps.package-version.outputs.version
        run: pnpm publish:vsce
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Open VSX Registry publish
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.marketplace-version.outputs.version != steps.package-version.outputs.version
        run: pnpm publish:ovsx
        env:
          OVSX_PAT: ${{ secrets.OPENVSX_TOKEN }}

  # Its own job, so no npm package runs where a crates.io token can be had.
  publish-crates:
    needs: publish-packages
    if: needs.publish-packages.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Until theme-check is on crates.io, published once by hand with a trusted publisher for
      # this workflow and environment, this publishes nothing. After a partial publish, the next
      # run does the rest.
      - name: List the crates whose version isn't on crates.io
        id: crates
        run: |
          version=$(jq -r .version crates/theme-check/package.json)
          on_crates_io() {
            code=$(curl -s --retry 3 -o /dev/null -w '%{http_code}' -A 'Shopify/theme-tools release' "https://crates.io/api/v1/crates/$1")
            case $code in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "::error::crates.io answered $code for $1"; exit 1 ;;
            esac
          }
          list=
          if on_crates_io theme-check; then
            for crate in liquid-ast liquid-parser theme-check; do
              on_crates_io "$crate/$version" || list="$list $crate"
            done
          fi
          echo "list=$list" >> $GITHUB_OUTPUT

      - name: Exchange the Actions identity token for a crates.io token
        id: crates-io-auth
        if: steps.crates.outputs.list != ''
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # In dependency order.
      - name: Publish the crates to crates.io
        if: steps.crates.outputs.list != ''
        run: for crate in $CRATES; do cargo publish -p "$crate" --locked; done
        env:
          CRATES: ${{ steps.crates.outputs.list }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
