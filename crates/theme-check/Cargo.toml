[package]
name = "theme-check"
description = "The linter for Shopify themes, ported from @shopify/theme-check-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The specs it runs are at the repo root, outside the crate.
exclude = ["tests"]

[dependencies]
liquid-ast.workspace = true
liquid-parser.workspace = true
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
yaml-rust2 = { version = "0.11", default-features = false }

[[test]]
name = "specs"
harness = false
