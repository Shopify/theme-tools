[package]
name = "liquid-parser"
description = "A parser for Liquid HTML templates, ported from @shopify/liquid-html-parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The specs it runs are at the repo root, outside the crate.
exclude = ["/tests"]

[dependencies]
liquid-ast.workspace = true

[dev-dependencies]
serde_json = "1"
yaml-rust2 = { version = "0.11", default-features = false }

[[test]]
name = "specs"
harness = false
